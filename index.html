    ctx.fillRect(0, top, 1280, bottom - top);
  }

  function drawLabelledSkyBand(ctx, top, bottom, color, label) {
    drawSkyBand(ctx, top, bottom, color);
    drawPlaceLabel(ctx, label, 1150, top + (bottom - top) / 2 + 9);
  }

  // ---- Workshop -----------------------------------------------------------------------------

  // Świder: a T-shaped hand drill with a twisted bit.
  function drawDrill(ctx, x, y) {
    D.drawOutlinedRoundRect(ctx, { x: x - 34, y: y - 76, width: 68, height: 12 }, 5, '#a8743a', 2);
    D.drawOutlinedRoundRect(ctx, { x: x - 4, y: y - 66, width: 8, height: 62 }, 3, '#b8c0c8', 2);
    for (let twist = 0; twist < 4; twist += 1) {
      D.drawLine(ctx, x - 4, y - 36 + twist * 9, x + 4, y - 30 + twist * 9, '#5a6068', 2);
    }
  }

  // Poziomica: a wooden bar with a glass tube and its air bubble.
  function drawLevel(ctx, x, y, time) {
    D.drawOutlinedRoundRect(ctx, { x: x - 60, y: y - 18, width: 120, height: 18 }, 4, '#c8903a', 2);
    D.drawOutlinedRoundRect(ctx, { x: x - 18, y: y - 15, width: 36, height: 12 }, 5, '#b8f070', 1.5);
    D.drawOutlinedEllipse(ctx, x + Math.sin(time) * 3, y - 9, 5, 3.5, '#f0ffe0', 1);
  }

  function drawToolTable(ctx, x, y, time) {
    D.drawOutlinedRoundRect(ctx, { x: x - 10, y: y, width: 12, height: 476 - y }, 3, '#7a4a20', 2.5);
    D.drawOutlinedRoundRect(ctx, { x: x + 238, y: y, width: 12, height: 476 - y }, 3, '#7a4a20', 2.5);
    D.drawOutlinedRoundRect(ctx, { x: x - 20, y: y - 14, width: 280, height: 18 }, 4, '#a8743a', 2.5);
    drawDrill(ctx, x + 40, y - 14);
    drawLevel(ctx, x + 170, y - 14, time);
    drawTag(ctx, 'świder', x + 40, y - 104);
    drawTag(ctx, 'poziomica', x + 170, y - 48);
  }

  function drawStatue(ctx, x, y, scale, time) {
    D.drawOutlinedRoundRect(ctx, { x: x - 40 * scale, y: y - 30 * scale, width: 80 * scale, height: 30 * scale }, 4, P.marbleShade, 3);
    ctx.save();
    ctx.translate(x, y - 30 * scale);
    ctx.rotate(Math.sin(time * 1.5) * 0.03);
    person(ctx, 0, 0, scale, marbleStatue, 'point');
    ctx.restore();
  }

  function drawWorkbench(ctx, time) {
    D.drawOutlinedRoundRect(ctx, { x: 470, y: 400, width: 16, height: 76 }, 3, '#7a4a20', 2.5);
    D.drawOutlinedRoundRect(ctx, { x: 800, y: 400, width: 16, height: 76 }, 3, '#7a4a20', 2.5);
    D.drawOutlinedRoundRect(ctx, { x: 450, y: 384, width: 390, height: 22 }, 4, '#a8743a', 3);
    LM.workshopArt.drawWaxPot(ctx, 540, 384, time);
    [0, 1, 2, 3, 4].forEach(function (index) {
      LM.props.drawFeather(ctx, 640 + index * 34, 372, 2.4, -0.3 + index * 0.15);
    });
  }

  // ---- Crete, Sicily and Ikaria -------------------------------------------------------------

  // A parchment with the plan of the labyrinth: rings of walls, each with a gap.
  function drawLabyrinthPlan(ctx, x, y) {
    D.drawOutlinedRoundRect(ctx, { x: x - 66, y: y - 50, width: 132, height: 100 }, 6, P.parchment, 3);
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#7a3a10';
    [40, 28, 16].forEach(function (ringSize, index) {
      ctx.strokeRect(x - ringSize * 1.3, y - ringSize, ringSize * 2.6, ringSize * 2);
      ctx.fillStyle = P.parchment;
      ctx.fillRect(x - 6 + (index % 2 ? 14 : -14), index % 2 ? y + ringSize - 4 : y - ringSize - 4, 12, 8);
    });
  }

  function drawThrone(ctx, x, y) {
    D.drawOutlinedRoundRect(ctx, { x: x - 54, y: y - 210, width: 108, height: 170 }, 14, P.gold, 3);
    D.drawOutlinedRoundRect(ctx, { x: x - 40, y: y - 196, width: 80, height: 150 }, 10, '#c8281a', 2.5);
    D.drawOutlinedRoundRect(ctx, { x: x - 66, y: y - 60, width: 132, height: 60 }, 6, '#c8a030', 3);
  }

  // A dream of Athens; the small bubbles trail off to the left, towards the dreamer's head.
  function drawThoughtBubble(ctx, x, y, time) {
    D.drawOutlinedCircle(ctx, x - 275, y - 20, 9, P.white, 2.5);
    D.drawOutlinedCircle(ctx, x - 220, y - 8, 14, P.white, 2.5);
    D.drawOutlinedEllipse(ctx, x, y, 140, 90, P.white, 3);
    S.drawSun(ctx, x + 92, y - 46, 14, time);
    S.drawTemple(ctx, x, y + 34, 0.95);
    drawTag(ctx, 'Ateny', x, y + 70);
  }

  function drawGrave(ctx, x, y) {
    D.drawOutlinedEllipse(ctx, x, y, 90, 26, '#8a6a3a', 3);
    D.drawOutlinedRoundRect(ctx, { x: x - 22, y: y - 86, width: 44, height: 76 }, 18, '#b8b0a0', 3);
    [-56, -30, 34, 60].forEach(function (flowerX) {
      D.drawOutlinedCircle(ctx, x + flowerX, y - 12, 6, flowerX < 0 ? '#ff8ab0' : P.gold, 1.5);
    });
  }

  function drawIkariaShore(ctx, time) {
    S.drawSky(ctx, { x: 0, y: 0, width: 1280, height: 330 }, DUSK_SKY.top, DUSK_SKY.bottom);
    S.drawSun(ctx, 300, 300, 46, time);
    S.drawSea(ctx, { x: 0, y: 330, width: 1280, height: 390 }, time, { top: '#3a70c0', bottom: '#14306a', foam: '#ffd8b0', wave: '#5a8ad0' });
    D.drawOutlinedPolygon(ctx, [[560, 720], [600, 400], [760, 330], [1000, 300], [1280, 320], [1280, 720]], '#6a8a4a', 3);
    D.drawOutlinedPolygon(ctx, [[600, 470], [620, 430], [1280, 430], [1280, 470]], '#d8c088', 0);
    drawPlaceLabel(ctx, 'Ikaria', 1080, 280);
    drawPlaceLabel(ctx, 'Morze Ikaryjskie', 270, 420);
  }

  // Etna smokes behind the coast of Sicily; Minos's fleet sails in from the left.
  function drawSicily(ctx, time) {
    S.drawSky(ctx, { x: 0, y: 0, width: 1280, height: 420 }, '#4a8ae0', '#ffe8c0');
    [0, 1, 2].forEach(function (puff) {
      const rise = (time * 10 + puff * 27) % 80;
      D.fillCircle(ctx, 1010 + puff * 10 + rise * 0.5, 170 - rise, 18 + rise * 0.15, 'rgba(120, 110, 110, 0.45)');
    });
    D.drawOutlinedPolygon(ctx, [[720, 440], [960, 180], [1060, 180], [1280, 400], [1280, 440]], '#8a6a5a', 3);
    D.drawOutlinedPolygon(ctx, [[960, 180], [1060, 180], [1090, 214], [1040, 204], [1000, 222], [940, 202]], P.white, 2);
    S.drawSea(ctx, { x: 0, y: 380, width: 1280, height: 340 }, time);
    D.drawOutlinedPolygon(ctx, [[460, 720], [520, 440], [700, 410], [1280, 420], [1280, 720]], '#c8b070', 3);
    drawPlaceLabel(ctx, 'Sycylia', 640, 130);
    S.drawShip(ctx, 140, 400, 0.45, CRETAN_SAIL, time);
    S.drawShip(ctx, 300, 410, 0.4, CRETAN_SAIL, time + 1);
  }

  // ---- The pictures -------------------------------------------------------------------------

  const PICTURES = {
    'ika-inventor': function (ctx, time) {
      B.drawAthens(ctx, time);
      person(ctx, 180, 490, 2.4, looks.daedalus, 'point');
      drawStatue(ctx, 420, 490, 2.0, time);
      drawToolTable(ctx, 640, 410, time);
    },
    'ika-crete': function (ctx, time) {
      B.drawCretePalace(ctx, time);
      person(ctx, 320, 490, 2.4, looks.daedalus, 'point');
      drawLabyrinthPlan(ctx, 540, 300);
      person(ctx, 840, 490, 2.6, looks.minos, 'stand');
    },
    'ika-homesick': function (ctx, time) {
      B.drawCliff(ctx, time);
      person(ctx, 110, 304, 1.3, looks.icarus, 'stand');
      person(ctx, 260, 304, 1.7, looks.daedalus, 'mourn');
      drawThoughtBubble(ctx, 620, 170, time);
    },
    'ika-minos-refuses': function (ctx, time) {
      B.drawCretePalace(ctx, time);
      drawThrone(ctx, 200, 490);
      person(ctx, 400, 490, 2.6, looks.minos, 'point');
      person(ctx, 780, 490, 2.3, looks.daedalus, 'mourn');
      person(ctx, 940, 490, 1.8, looks.icarus, 'stand');
    },
    'ika-guarded-sea': function (ctx, time) {
      B.drawHarbor(ctx, time);
      S.drawShip(ctx, 1080, 420, 0.7, CRETAN_SAIL, time + 2);
      S.drawShip(ctx, 840, 470, 1.1, CRETAN_SAIL, time);
      person(ctx, 200, 500, 2.3, looks.daedalus, 'mourn');
      person(ctx, 360, 500, 1.8, looks.icarus, 'stand');
    },
    'ika-birds': function (ctx, time) {
      drawCreteHillside(ctx, time);
      [[560, 150], [700, 110], [820, 180], [980, 250]].forEach(function (spot, index) {
        drawGull(ctx, spot[0] + Math.sin(time + index) * 20, spot[1] + Math.cos(time * 1.3 + index) * 10, 1.4, time);
      });
      person(ctx, 300, 470, 2.4, looks.daedalus, 'point');
      person(ctx, 150, 470, 1.8, looks.icarus, 'stand');
    },
    'ika-workshop': function (ctx, time) {
      LM.workshopArt.drawWorkshop(ctx, time);
      drawPairOfWings(ctx, 650, 340, 1.4, { flap: 0.2 }, time);
      drawWorkbench(ctx, time);
      person(ctx, 330, 490, 2.4, looks.daedalus, 'offer');
      drawFallingFeathers(ctx, { x: 920, y: 150, width: 170, height: 220 }, 4, time);
      person(ctx, 1000, 490, 1.9, looks.icarus, 'cheer');
    },
    'ika-first-flight': function (ctx, time) {
      drawCreteHillside(ctx, time);
      drawFlyer(ctx, 780, 210 + Math.sin(time * 1.5) * 12, 1.6, looks.daedalus, { flap: flapAt(time, 3), tilt: 0.15 }, time);
      drawWingedPerson(ctx, 330, 470, 1.8, looks.icarus, restingWings('cheer'), time);
    },
    'ika-warning': function (ctx, time) {
      drawFlightSky(ctx, time, Object.assign({}, DAY_SKY, { sunX: 960 }));
      drawLabelledSkyBand(ctx, 56, 190, 'rgba(255, 110, 40, 0.22)', 'za wysoko');
      drawLabelledSkyBand(ctx, 190, 330, 'rgba(70, 200, 90, 0.22)', 'środkiem');
      drawLabelledSkyBand(ctx, 330, 440, 'rgba(30, 90, 220, 0.22)', 'za nisko');
      D.drawOutlinedPolygon(ctx, [[0, 720], [0, 470], [600, 450], [740, 500], [760, 720]], P.grassDark, 3);
      drawWingedPerson(ctx, 240, 480, 2.0, looks.daedalus, restingWings('point'), time);
      drawWingedPerson(ctx, 560, 480, 1.6, looks.icarus, restingWings('stand'), time);
    },
    'ika-takeoff': function (ctx, time) {
      drawFlightSky(ctx, time, DAY_SKY);
      S.drawIsland(ctx, 170, 470, 420, 150);
      drawPlaceLabel(ctx, 'Kreta', 160, 300);
      drawMiddlePath(ctx, 300, 330, 1280, 250);
      drawFlyer(ctx, 820, 270 + Math.sin(time * 1.4) * 8, 1.3, looks.daedalus, { flap: flapAt(time, 3), tilt: 0.3 }, time);
      drawFlyer(ctx, 560, 300 + Math.sin(time * 1.4 + 1) * 8, 1.1, looks.icarus, { flap: flapAt(time + 0.5, 3.4), tilt: 0.3 }, time);
    },
    'ika-islands': function (ctx, time) {
      drawFlightSky(ctx, time, Object.assign({}, DAY_SKY, { horizonY: 370 }));
      [['Samos', 230, 300, 90], ['Paros', 650, 230, 66], ['Delos', 1050, 180, 52]].forEach(function (island) {
        S.drawIsland(ctx, island[1], 400, island[2], island[3]);
        drawPlaceLabel(ctx, island[0], island[1], 380 - island[3]);
      });
      drawFlyer(ctx, 700, 185 + Math.sin(time * 1.4) * 8, 0.9, looks.daedalus, { flap: flapAt(time, 3), tilt: 0.3 }, time);
      drawFlyer(ctx, 530, 205 + Math.sin(time * 1.4 + 1) * 8, 0.75, looks.icarus, { flap: flapAt(time + 0.5, 3.4), tilt: 0.3 }, time);
    },
    'ika-joy': function (ctx, time) {
      drawFlightSky(ctx, time, DAY_SKY);
      drawFlyer(ctx, 1000, 360, 0.8, looks.daedalus, { flap: flapAt(time, 3), tilt: 0.3 }, time);
      drawFlyer(ctx, 540, 285 + Math.sin(time * 2) * 12, 1.9, looks.icarus, { flap: flapAt(time, 4.5), tilt: 0.2, pose: 'cheer' }, time);
    },
    'ika-higher': function (ctx, time) {
      drawFlightSky(ctx, time, HOT_SKY);
      drawMiddlePath(ctx, 0, 380, 1280, 330);
      drawFlyer(ctx, 330, 340 + Math.sin(time * 1.4) * 8, 1.0, looks.daedalus, { flap: flapAt(time, 3), tilt: 0.25 }, time);
      drawFlyer(ctx, 790, 190 + Math.sin(time * 2) * 10, 1.3, looks.icarus, { flap: flapAt(time, 4.5), tilt: -0.3, pose: 'cheer', isMelting: true }, time);
    },
    'ika-fall': function (ctx, time) {
      drawFlightSky(ctx, time, HOT_SKY);
      drawFallingFeathers(ctx, { x: 420, y: 80, width: 520, height: 360 }, 9, time);
      drawFlyer(ctx, 640, 270, 1.4, looks.icarus, { flap: 0.9 + Math.sin(time * 7) * 0.3, tilt: 2.6 + Math.sin(time * 2) * 0.15, pose: 'cheer', featherCount: 2 }, time);
      drawFlyer(ctx, 200, 330, 0.9, looks.daedalus, { flap: flapAt(time, 3), tilt: 0.2 }, time);
    },
    'ika-burial': function (ctx, time) {
      drawIkariaShore(ctx, time);
      drawGrave(ctx, 980, 460);
      person(ctx, 800, 470, 2.2, looks.daedalus, 'mourn');
      LM.props.drawFeather(ctx, 1110, 452, 2.4, 0.3);
      LM.props.drawFeather(ctx, 690, 456, 2.4, -0.4);
    },
    'ika-sicily': function (ctx, time) {
      drawSicily(ctx, time);
      S.drawTemple(ctx, 1110, 420, 1.1);
      person(ctx, 680, 480, 2.3, looks.daedalus, 'offer');
      person(ctx, 900, 480, 2.5, sicilianKing, 'stand');
    },
    'ika-dream': function (ctx, time) {
      B.drawCliff(ctx, time);
      S.drawSun(ctx, 880, 320, 50, time);
      [[560, 200], [660, 160], [760, 230], [880, 190]].forEach(function (spot, index) {
        drawGull(ctx, spot[0] + ((time * 25) % 120), spot[1] + Math.sin(time + index) * 10, 1.2, time);
      });
      drawWingedPerson(ctx, 230, 304, 1.3, looks.daedalus, restingWings('stand'), time);
    },
    'ika-player-wings': function (ctx, time) {
      drawFlightSky(ctx, time, DAY_SKY);
      drawSkyBand(ctx, 190, 330, 'rgba(70, 200, 90, 0.22)');
      D.fillCircle(ctx, 640, 250, 130, 'rgba(255, 220, 90, 0.4)');
      drawPairOfWings(ctx, 640, 440, 2.4, { flap: flapAt(time, 2) }, time);
      D.drawStar(ctx, 640, 262, 38, 17, P.gold, 3);
      drawFallingFeathers(ctx, { x: 300, y: 70, width: 680, height: 380 }, 7, time);
    },
  };

  Object.keys(PICTURES).forEach(function (id) { LM.illustrations[id] = PICTURES[id]; });
}(window.LM = window.LM || {}));

</script>
<script>
// Story pictures for the myth of Orpheus and Eurydice. Each draws the whole 1280×720 frame.
// The underworld is painted in purples and teals instead of black, so the dark scenes stay readable.
(function (LM) {
  'use strict';

  const B = LM.backdrops;
  const S = LM.scenery;
  const D = LM.draw;
  const P = LM.palette;
  const person = LM.characters.drawPerson;
  const looks = LM.characters.looks;
  const STYX_WATER = { top: '#2a9a9a', bottom: '#123a5a', foam: '#9ae8d8', wave: '#4ab8b0' };
  const CAVERN_ROCK = '#3a2d62';
  const CHARON_HOOD = '#2e2840';
  const DAY_LEAVES = { dark: '#3f8a3a', light: '#4fa04a', shine: '#7ac86a' };
  const DUSK_LEAVES = { dark: '#2f5a4a', light: '#3a6a56', shine: '#5a8a6a' };
  const SAD_NOTE = '#8ad0ff';
  const charonLook = Object.assign({}, looks.hades, { robe: '#3d3452', trim: '#6a8aa8', cape: CHARON_HOOD, hair: '#b8b8c0', beard: '#b8b8c0', headwear: null });
  const aristaeusLook = Object.assign({}, looks.youth, { robe: '#f0a830', trim: '#8a4a10', hairStyle: 'curly' });
  const erinysLook = Object.assign({}, looks.eurydice, { robe: '#7a1d3d', trim: '#e05a7a', hair: '#2a2438', skin: '#ecc8c4', headwear: null });
  const eurydiceShade = Object.assign({}, looks.eurydice, { robe: '#e4f4f2', trim: '#7ac8c8', skin: '#e2eeea', hair: '#d8cca8' });
  const museLooks = ['#f08ab0', '#8ab8f0', '#f0c850'].map(function (robe) {
    return Object.assign({}, looks.eurydice, { robe: robe, trim: P.gold, hair: '#6a3a1a' });
  });

  function withAlpha(ctx, alpha, drawFn) {
    ctx.save();
    ctx.globalAlpha = alpha;
    drawFn();
    ctx.restore();
  }

  // Rotates a drawing around its base point: leaning runners, bowing trees, a nymph lying in the grass.
  function withLean(ctx, x, y, lean, drawFn) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(lean);
    drawFn();
    ctx.restore();
  }

  function strokePolyline(ctx, points, color, width) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    points.slice(1).forEach(function (point) { ctx.lineTo(point[0], point[1]); });
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  // A range of hills or mountains; the shape closes along the bottom edge of the picture.
  function drawRidge(ctx, points, color) {
    D.drawOutlinedPolygon(ctx, [[0, 720]].concat(points, [[1280, 720]]), color, 3);
  }

  function drawGround(ctx, top, topColor, bottomColor) {
    D.drawBandedGradient(ctx, { x: 0, y: top, width: 1280, height: 720 - top }, topColor, bottomColor, 7);
    ctx.fillStyle = P.outline;
    ctx.fillRect(0, top, 1280, 3);
  }

  function drawHalo(ctx, x, y, radius, rgb) {
    [[1, 0.12], [0.75, 0.18], [0.5, 0.26]].forEach(function (ring) {
      D.fillCircle(ctx, x, y, radius * ring[0], 'rgba(' + rgb + ', ' + ring[1] + ')');
    });
  }

  // ---- Music, sparkles and other small magic ----

  function drawMusicNote(ctx, x, y, size, color) {
    const stemX = x + size * 0.55;
    D.drawLine(ctx, stemX, y, stemX, y - size * 2, P.outline, 5);
    D.drawLine(ctx, stemX, y, stemX, y - size * 2, color, 2.5);
    D.drawOutlinedPolygon(ctx, [[stemX, y - size * 2], [stemX + size * 0.9, y - size * 1.3], [stemX, y - size * 1.5]], color, 1.5);
    D.drawOutlinedEllipse(ctx, x, y, size * 0.65, size * 0.48, color, 2);
  }

  // Notes rise from (x, y) and fade out, so the song seems to float through the picture.
  function drawRisingNotes(ctx, x, y, time, color) {
    for (let note = 0; note < 4; note += 1) {
      const rise = (time * 0.3 + note / 4) % 1;
      withAlpha(ctx, 1 - rise, function () {
        drawMusicNote(ctx, x + note * 30 + Math.sin(time * 2 + note) * 16, y - rise * 170, 13, color);
      });
    }
  }

  // Notes carried by the waves from one point to another, fading in and out on the way.
  function drawDriftingNotes(ctx, fromX, toX, y, time) {
    for (let note = 0; note < 5; note += 1) {
      const progress = (time * 0.08 + note / 5) % 1;
      withAlpha(ctx, Math.sin(progress * Math.PI), function () {
        drawMusicNote(ctx, fromX + (toX - fromX) * progress, y + Math.sin(time * 2 + note) * 10, 14, P.gold);
      });
    }
  }

  // Pale sparkles drifting upwards: the gentle sign of a soul.
  function drawSparkles(ctx, x, y, time) {
    for (let sparkle = 0; sparkle < 6; sparkle += 1) {
      const rise = (time * 0.25 + sparkle / 6) % 1;
      withAlpha(ctx, 1 - rise, function () {
        D.drawStar(ctx, x + Math.sin(sparkle * 2.1 + time) * 60, y - rise * 200, 9, 4, '#e8fff8', 1.2);
      });
    }
  }

  function drawSleepyZs(ctx, x, y, time) {
    for (let letter = 0; letter < 3; letter += 1) {
      const rise = (time * 0.4 + letter / 3) % 1;
      withAlpha(ctx, 1 - rise, function () {
        LM.text.drawTextLine(ctx, 'z', x + rise * 50, y - rise * 90, { font: LM.text.boldFont(24 + letter * 6), color: '#efe8ff', shadowColor: P.textShadow });
      });
    }
  }

  function drawPlaceLabel(ctx, name, x, y) {
    LM.text.drawTextLine(ctx, name, x, y, { font: LM.text.boldFont(30), color: P.white, align: 'center', shadowColor: P.textShadow });
  }

  // ---- Nature: trees, flowers, grass and animals ----

  // A round cartoon tree; (x, baseY) is the foot of the trunk, ~170 px tall at scale 1. lean bows it sideways.
  function drawTree(ctx, x, baseY, scale, lean, leaves) {
    withLean(ctx, x, baseY, lean, function () {
      ctx.scale(scale, scale);
      D.drawOutlinedRoundRect(ctx, { x: -10, y: -90, width: 20, height: 90 }, 4, '#7a4a20', 2.5);
      D.drawOutlinedCircle(ctx, -28, -98, 32, leaves.dark, 2.5);
      D.drawOutlinedCircle(ctx, 28, -98, 32, leaves.dark, 2.5);
      D.drawOutlinedCircle(ctx, 0, -130, 40, leaves.light, 2.5);
      D.fillCircle(ctx, -12, -144, 13, leaves.shine);
    });
  }

  function drawFlower(ctx, x, y, color) {
    D.drawLine(ctx, x, y, x, y - 18, '#3a7a2a', 3);
    for (let petal = 0; petal < 5; petal += 1) {
      const angle = petal * Math.PI * 0.4;
      D.drawOutlinedCircle(ctx, x + Math.cos(angle) * 6, y - 22 + Math.sin(angle) * 6, 5, color, 1.2);
    }
    D.drawOutlinedCircle(ctx, x, y - 22, 4, P.gold, 1.2);
  }

  // flowers: [[x, y, colour], …]
  function drawFlowers(ctx, flowers) {
    flowers.forEach(function (flower) { drawFlower(ctx, flower[0], flower[1], flower[2]); });
  }

  function drawGrassTufts(ctx, y, color, seed) {
    const rng = LM.random.createRng(seed);
    for (let tuft = 0; tuft < 24; tuft += 1) {
      const x = rng() * 1280;
      D.drawOutlinedPolygon(ctx, [[x - 14, y], [x - 7, y - 30], [x, y - 10], [x + 6, y - 34], [x + 14, y]], color, 1.5);
    }
  }

  function drawClosedEyes(ctx, x, y, spread) {
    ctx.strokeStyle = P.outline;
    ctx.lineWidth = 2;
    [-spread, spread].forEach(function (eyeX) {
      ctx.beginPath();
      ctx.arc(x + eyeX, y, 4, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();
    });
  }

  // Animals resting peacefully at the singer's feet; (x, y) is where they lie.
  function drawRestingBear(ctx, x, y, scale) {
    D.withTransform(ctx, x, y, scale, function () {
      D.drawOutlinedEllipse(ctx, 10, -26, 58, 26, '#7a4a2a', 2.5);
      [-26, 2].forEach(function (pawX) { D.drawOutlinedEllipse(ctx, pawX, -6, 14, 7, '#6a3a1a', 2); });
      [-64, -36].forEach(function (earX) { D.drawOutlinedCircle(ctx, earX, -58, 8, '#7a4a2a', 2); });
      D.drawOutlinedCircle(ctx, -50, -38, 22, '#7a4a2a', 2.5);
      D.drawOutlinedEllipse(ctx, -54, -28, 11, 8, '#c89a6a', 2);
      D.fillCircle(ctx, -54, -31, 3, P.outline);
      drawClosedEyes(ctx, -50, -44, 8);
    });
  }

  function drawAntlers(ctx, x, y) {
    [-1, 1].forEach(function (side) {
      D.drawLine(ctx, x + side * 4, y + 6, x + side * 14, y - 18, '#7a4a20', 3.5);
      D.drawLine(ctx, x + side * 9, y - 6, x + side * 20, y - 8, '#7a4a20', 3);
    });
  }

  function drawRestingDeer(ctx, x, y, scale) {
    D.withTransform(ctx, x, y, scale, function () {
      D.drawOutlinedEllipse(ctx, 0, -24, 50, 22, '#c8803a', 2.5);
      [[-20, -30], [2, -22], [20, -32]].forEach(function (spot) { D.fillCircle(ctx, spot[0], spot[1], 4, '#f4e0c0'); });
      D.drawOutlinedPolygon(ctx, [[26, -38], [46, -38], [58, -74], [42, -76]], '#c8803a', 2.5);
      drawAntlers(ctx, 50, -96);
      D.drawOutlinedEllipse(ctx, 52, -82, 15, 12, '#c8803a', 2.5);
      D.drawOutlinedEllipse(ctx, 64, -77, 7, 5, '#e8c8a0', 1.5);
      D.fillCircle(ctx, 68, -78, 2.2, P.outline);
      drawClosedEyes(ctx, 50, -86, 5);
    });
  }

  function drawRestingRabbit(ctx, x, y, scale) {
    D.withTransform(ctx, x, y, scale, function () {
      D.drawOutlinedEllipse(ctx, 0, -16, 26, 16, '#e8e4dc', 2.5);
      D.drawOutlinedEllipse(ctx, -14, -58, 5, 16, '#e8e4dc', 2);
      D.drawOutlinedEllipse(ctx, -2, -60, 5, 16, '#e8e4dc', 2);
      D.drawOutlinedCircle(ctx, -8, -34, 13, '#e8e4dc', 2.5);
      D.fillCircle(ctx, -8, -29, 2.5, '#e87a8a');
      drawClosedEyes(ctx, -8, -37, 5);
      D.drawOutlinedCircle(ctx, 25, -14, 6, P.white, 1.5);
    });
  }

  // A small viper slithering away through the grass, head to the right.
  function drawViper(ctx, x, y, scale, time) {
    const body = [];
    for (let step = 0; step <= 16; step += 1) {
      body.push([-step * 6, Math.sin(time * 5 - step * 0.6) * 6]);
    }
    D.withTransform(ctx, x, y, scale, function () {
      strokePolyline(ctx, body, P.outline, 14);
      strokePolyline(ctx, body, '#9a8a3a', 9);
      body.filter(function (point, index) { return index % 3 === 1; }).forEach(function (point) {
        D.fillCircle(ctx, point[0], point[1], 2.5, '#4a3a1a');
      });
      D.drawOutlinedEllipse(ctx, 6, body[0][1], 11, 8, '#9a8a3a', 2);
      D.fillCircle(ctx, 10, body[0][1] - 3, 2, P.outline);
    });
  }

  // ---- People on the run and at rest ----

  function drawLeaningPerson(ctx, x, y, scale, look, pose, lean) {
    withLean(ctx, x, y, lean, function () { person(ctx, 0, 0, scale, look, pose); });
  }

  // Eurydice lying still in the grass with her eyes closed, as if asleep; her head is on the left.
  // drawPerson puts the eyes at (±6, -97); they are painted over with skin and drawn shut.
  function drawSleepingNymph(ctx, x, y, scale) {
    withLean(ctx, x, y, -Math.PI / 2, function () {
      person(ctx, 0, 0, scale, looks.eurydice, 'stand');
      ctx.scale(scale, scale);
      [-6, 6].forEach(function (eyeX) { D.fillCircle(ctx, eyeX, -97, 3.6, looks.eurydice.skin); });
      drawClosedEyes(ctx, 0, -98, 6);
    });
  }

  function drawSpeedLines(ctx, x, y) {
    [[0, 0, 60], [10, 34, 44], [-6, 68, 52]].forEach(function (line) {
      D.drawLine(ctx, x + line[0] - line[2], y + line[1], x + line[0], y + line[1], P.white, 4);
    });
  }

  // ---- Landscapes of the upper world ----

  function drawThraceValley(ctx) {
    S.drawSky(ctx, { x: 0, y: 0, width: 1280, height: 400 }, '#4a90e8', '#dff4ff');
    S.drawCloud(ctx, 980, 100, 0.8);
    drawRidge(ctx, [[0, 230], [160, 140], [330, 210], [520, 110], [700, 220], [880, 130], [1080, 200], [1280, 150]], '#8a9ac8');
    drawRidge(ctx, [[0, 330], [300, 280], [640, 330], [980, 270], [1280, 320]], '#5a9a4a');
    drawGround(ctx, 380, '#8ad06a', '#4a9a3a');
    // The river stands still to listen, so it has no waves.
    D.drawOutlinedPolygon(ctx, [[0, 352], [1280, 340], [1280, 372], [0, 388]], '#6ac0f0', 2.5);
    ctx.fillStyle = '#c8ecff';
    ctx.fillRect(140, 362, 260, 3);
    ctx.fillRect(820, 354, 220, 3);
  }

  function drawValleyOfTempe(ctx) {
    S.drawSky(ctx, { x: 0, y: 0, width: 1280, height: 420 }, '#4a90e8', '#dff4ff');
    S.drawCloud(ctx, 560, 110, 0.8);
    drawRidge(ctx, [[0, 100], [210, 150], [440, 330], [640, 410], [850, 320], [1070, 140], [1280, 90]], '#4a8a3a');
    drawGround(ctx, 400, '#8ad06a', '#4a9a3a');
    D.drawOutlinedPolygon(ctx, [[610, 402], [670, 402], [800, 720], [480, 720]], '#5ab0e8', 2.5);
  }

  function drawCaveAtDusk(ctx) {
    S.drawSky(ctx, { x: 0, y: 0, width: 1280, height: 460 }, '#3a2a6a', '#f0a070');
    drawRidge(ctx, [[0, 300], [220, 240], [420, 290], [560, 250]], '#6a5a8a');
    D.drawOutlinedPolygon(ctx, [[560, 470], [760, 170], [1000, 110], [1280, 190], [1280, 470]], '#7a6a72', 3);
    drawArchOpening(ctx, 960, 470, 110, 110, '#241c46');
    D.fillCircle(ctx, 960, 400, 70, 'rgba(160, 110, 255, 0.25)');
    drawGround(ctx, 460, '#8a7a5a', '#5a4a3a');
  }

  function drawThraceDusk(ctx) {
    S.drawSky(ctx, { x: 0, y: 0, width: 1280, height: 420 }, '#2e2a6a', '#f0a070');
    B.drawStars(ctx, 30, 5);
    D.fillCircle(ctx, 1090, 120, 34, '#fff6d8');
    drawRidge(ctx, [[0, 250], [200, 170], [420, 240], [640, 160], [900, 250], [1100, 190], [1280, 240]], '#4a3a7a');
    drawRidge(ctx, [[0, 380], [360, 330], [640, 400], [960, 340], [1280, 380]], '#3a5a4a');
    drawGround(ctx, 450, '#4a6a50', '#2a4a3a');
  }

  function drawSunsetSea(ctx, time) {
    S.drawSky(ctx, { x: 0, y: 0, width: 1280, height: 400 }, '#5a4aa8', '#f8b878');
    S.drawSun(ctx, 260, 380, 50, time);
    S.drawSea(ctx, { x: 0, y: 400, width: 1280, height: 320 }, time);
  }

  function drawMountOlympus(ctx, time) {
    S.drawSky(ctx, { x: 0, y: 0, width: 1280, height: 440 }, '#5aa0f0', '#e8f6ff');
    D.drawOutlinedPolygon(ctx, [[200, 460], [480, 220], [570, 250], [680, 110], [800, 230], [900, 190], [1180, 460]], '#8a8aa8', 3);
    D.drawOutlinedPolygon(ctx, [[620, 186], [680, 110], [742, 186], [712, 170], [682, 192], [652, 172]], P.white, 2.5);
    S.drawTemple(ctx, 680, 116, 0.45);
    S.drawCloud(ctx, 470 + Math.sin(time * 0.3) * 10, 220, 0.9);
    S.drawCloud(ctx, 820 - Math.sin(time * 0.3) * 10, 196, 0.7);
    drawPlaceLabel(ctx, 'Olimp', 860, 120);
    drawGround(ctx, 430, '#8ad06a', '#4a9a3a');
  }

  // A grassy mound with flowers and a lute where the Muses buried the singer.
  function drawGraveMound(ctx, x, y) {
    D.drawOutlinedEllipse(ctx, x, y, 140, 50, '#5aa04a', 3);
    D.withTransform(ctx, x, y - 10, 2.2, function () { LM.props.drawLute(ctx, 0, 0); });
    drawFlowers(ctx, [[x - 100, y - 4, '#f08ab0'], [x - 60, y - 22, '#ffffff'], [x + 60, y - 22, '#8ab8f0'], [x + 100, y - 4, '#f0c850']]);
  }

  // ---- The underworld ----

  // An opening with straight sides and a round top, like a cave mouth or a gateway. (x, y) is the bottom centre.
  function drawArchOpening(ctx, x, y, halfWidth, sideHeight, color) {
    ctx.beginPath();
    ctx.moveTo(x - halfWidth, y);
    ctx.lineTo(x - halfWidth, y - sideHeight);
    ctx.arc(x, y - sideHeight, halfWidth, Math.PI, Math.PI * 2);
    ctx.lineTo(x + halfWidth, y);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = P.outline;
    ctx.stroke();
  }

  function drawStalactites(ctx) {
    for (let index = 0; index < 12; index += 1) {
      const x = 40 + index * 110;
      const length = 40 + (index * 47) % 70;
      D.drawOutlinedPolygon(ctx, [[x - 34, 54], [x + 34, 54], [x + 4, 54 + length]], CAVERN_ROCK, 2.5);
    }
  }

  // Teal motes of light floating in the dark keep the underworld readable and a little magical.
  function drawFloatingMotes(ctx, time) {
    const rng = LM.random.createRng(11);
    for (let mote = 0; mote < 24; mote += 1) {
      const x = rng() * 1280;
      const y = 90 + rng() * 360 + Math.sin(time + mote) * 6;
      const glow = 0.35 + 0.3 * Math.sin(time * 2 + mote);
      D.fillCircle(ctx, x, y, 3, 'rgba(140, 240, 220, ' + glow.toFixed(2) + ')');
    }
  }

  function drawCavern(ctx, time) {
    D.drawBandedGradient(ctx, { x: 0, y: 0, width: 1280, height: 720 }, '#1f1844', '#4a3c80', 12);
    drawStalactites(ctx);
    drawFloatingMotes(ctx, time);
  }

  function drawUnderworldFloor(ctx, top) {
    drawGround(ctx, top, '#5a4c88', '#2c2650');
  }

  // The slow, dark river; its waves drift at less than half the speed of the sea.
  function drawStyx(ctx, top, time) {
    S.drawSea(ctx, { x: 0, y: top, width: 1280, height: 720 - top }, time * 0.4, STYX_WATER);
  }

  function drawFarShore(ctx, waterTop) {
    D.drawOutlinedPolygon(ctx, [[0, waterTop], [0, waterTop - 50], [260, waterTop - 80], [520, waterTop - 40], [800, waterTop - 90], [1080, waterTop - 50], [1280, waterTop - 70], [1280, waterTop]], CAVERN_ROCK, 3);
  }

  // A waiting soul: a pale, friendly wisp with two dot eyes. (x, y) is the tip of its tail.
  function drawSoul(ctx, x, y, time) {
    D.withTransform(ctx, x, y + Math.sin(time * 2 + x) * 5, 1, function () {
      withAlpha(ctx, 0.75, function () {
        D.drawOutlinedPolygon(ctx, [[-22, -50], [22, -50], [12, -6], [0, -16], [-8, 0], [-16, -14]], '#d8e8f8', 0);
        D.fillCircle(ctx, 0, -60, 24, '#d8e8f8');
      });
      D.fillCircle(ctx, -8, -62, 3, '#3a3a6a');
      D.fillCircle(ctx, 8, -62, 3, '#3a3a6a');
    });
  }

  function drawLantern(ctx, x, y, time) {
    const flicker = Math.sin(time * 9) * 3;
    D.fillCircle(ctx, x, y + 16, 32 + flicker, 'rgba(255, 210, 110, 0.25)');
    D.drawLine(ctx, x, y, x, y + 6, P.outline, 2);
    D.drawOutlinedRoundRect(ctx, { x: x - 9, y: y + 6, width: 18, height: 22 }, 5, '#ffd870', 2);
  }

  // Charon's long, low boat; (x, y) is the waterline centre, ~300 px long at scale 1. drawCrew paints
  // whoever stands in it, in the boat's own coordinates, before the hull hides their feet.
  function drawFerry(ctx, x, y, scale, time, drawCrew) {
    D.withTransform(ctx, x, y + Math.sin(time * 1.5) * 3, scale, function () {
      drawCrew();
      D.drawOutlinedPolygon(ctx, [[-150, -42], [150, -42], [118, 8], [-118, 8]], '#5a3e30', 3);
      ctx.fillStyle = '#3a281e';
      ctx.fillRect(-136, -30, 266, 5);
      D.drawOutlinedPolygon(ctx, [[-150, -42], [-176, -80], [-164, -84], [-138, -42]], '#5a3e30', 3);
      drawLantern(ctx, -172, -82, time);
    });
  }

  // The brim of Charon's hood covers his hair and frames the face; drawn over the head.
  function drawHoodBrim(ctx) {
    ctx.beginPath();
    ctx.arc(0, -96, 25, Math.PI, Math.PI * 2);
    ctx.arc(0, -90, 18, Math.PI * 2, Math.PI, true);
    ctx.closePath();
    ctx.fillStyle = CHARON_HOOD;
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = P.outline;
    ctx.stroke();
  }

  // The hooded ferryman: an old man in a dark cloak holding a long oar. (x, y) is between his feet.
  function drawCharon(ctx, x, y, scale) {
    D.withTransform(ctx, x, y, scale, function () { D.drawOutlinedEllipse(ctx, 0, -92, 30, 34, CHARON_HOOD, 2.5); });
    person(ctx, x, y, scale, charonLook, 'offer');
    D.withTransform(ctx, x, y, scale, function () {
      drawHoodBrim(ctx);
      D.drawLine(ctx, 44, -150, -12, 70, P.outline, 8);
      D.drawLine(ctx, 44, -150, -12, 70, '#9a6a3a', 5);
    });
  }

  function drawGateStones(ctx, x, y) {
    ctx.strokeStyle = '#4a4470';
    ctx.lineWidth = 2;
    for (let row = 1; row < 7; row += 1) {
      ctx.beginPath();
      ctx.moveTo(x - 226, y - row * 54);
      ctx.lineTo(x - 146, y - row * 54);
      ctx.moveTo(x + 146, y - row * 54);
      ctx.lineTo(x + 226, y - row * 54);
      ctx.stroke();
    }
  }

  // The stone gate of the underworld: a tall arch with a glowing purple passage. (x, y) is the bottom centre.
  function drawUnderworldGate(ctx, x, y, time) {
    D.drawOutlinedRoundRect(ctx, { x: x - 230, y: y - 380, width: 460, height: 380 }, 26, '#6a6290', 3);
    drawGateStones(ctx, x, y);
    drawArchOpening(ctx, x, y, 140, 190, '#2a1f52');
    D.fillCircle(ctx, x, y - 140, 100 + Math.sin(time * 2) * 6, 'rgba(160, 110, 255, 0.22)');
    B.drawTorch(ctx, x - 186, y - 250, time);
    B.drawTorch(ctx, x + 186, y - 250, time);
  }

  // Hades's throne of dark stone with gold trim; (x, y) is the bottom centre, ~330 px tall at scale 1.
  function drawThrone(ctx, x, y, scale) {
    D.withTransform(ctx, x, y, scale, function () {
      D.drawOutlinedRoundRect(ctx, { x: -80, y: -330, width: 160, height: 330 }, 18, '#4a3a72', 3);
      D.drawOutlinedRoundRect(ctx, { x: -62, y: -312, width: 124, height: 150 }, 12, '#5e4a8c', 2.5);
      D.drawOutlinedCircle(ctx, 0, -300, 16, P.gold, 2.5);
      [-1, 1].forEach(function (side) {
        D.drawOutlinedRoundRect(ctx, { x: side * 104 - 22, y: -150, width: 44, height: 150 }, 8, '#3c2e60', 3);
      });
    });
  }

  function drawThroneHall(ctx, time) {
    drawCavern(ctx, time);
    drawUnderworldFloor(ctx, 440);
    [70, 1210].forEach(function (pillarX) {
      D.drawOutlinedRoundRect(ctx, { x: pillarX - 30, y: 110, width: 60, height: 340 }, 6, '#5a5288', 3);
      B.drawTorch(ctx, pillarX, 190, time);
    });
    drawThrone(ctx, 700, 450, 1);
  }

  function drawErinysWings(ctx) {
    [-1, 1].forEach(function (side) {
      D.drawOutlinedPolygon(ctx, [[side * 12, -76], [side * 62, -118], [side * 56, -84], [side * 70, -66], [side * 50, -58], [side * 14, -52]], '#584a78', 2);
    });
  }

  function drawTears(ctx, time) {
    [-6, 6].forEach(function (eyeX, index) {
      const fall = (time * 28 + index * 11) % 30;
      D.fillCircle(ctx, eyeX, -92 + fall, 2.6, '#8ad8ff');
    });
  }

  // An Erinys, a stern winged goddess of vengeance, weeping at Orpheus's song.
  function drawWeepingErinys(ctx, x, y, scale, time) {
    D.withTransform(ctx, x, y, scale, function () { drawErinysWings(ctx); });
    person(ctx, x, y, scale, erinysLook, 'mourn');
    D.withTransform(ctx, x, y, scale, function () { drawTears(ctx, time + x); });
  }

  // Eurydice as a soul: pale colours, a soft teal glow and sparkles. fade (0..1) veils her in mist as she vanishes.
  function drawEurydiceShade(ctx, x, y, scale, pose, fade, time) {
    drawHalo(ctx, x, y - 60 * scale, 80 * scale, '150, 240, 230');
    person(ctx, x, y, scale, eurydiceShade, pose);
    const mist = { x: x - 36 * scale, y: y - 132 * scale, width: 72 * scale, height: 134 * scale };
    D.fillRoundRect(ctx, mist, 34 * scale, 'rgba(210, 250, 245, ' + fade.toFixed(2) + ')');
    drawSparkles(ctx, x, y - 40 * scale, time);
  }

  // The way out of the underworld: a warm, softly pulsing light.
  function drawDaylight(ctx, x, y, radius, time) {
    const pulse = Math.sin(time * 1.5) * radius * 0.06;
    [[2.4, 0.1], [1.8, 0.16], [1.35, 0.26]].forEach(function (ring) {
      D.fillCircle(ctx, x, y, radius * ring[0] + pulse, 'rgba(255, 236, 170, ' + ring[1] + ')');
    });
    D.drawOutlinedEllipse(ctx, x, y, radius, radius * 1.2, '#fff4c0', 3);
  }

  // A steep path winding up from the bottom left towards the daylight in the top right.
  function drawAscentTunnel(ctx, time) {
    D.drawBandedGradient(ctx, { x: 0, y: 0, width: 1280, height: 720 }, '#2a2050', '#3c5878', 12);
    drawDaylight(ctx, 1040, 150, 46, time);
    D.drawOutlinedPolygon(ctx, [[0, 56], [700, 56], [600, 150], [380, 250], [0, 320]], CAVERN_ROCK, 3);
    D.drawOutlinedPolygon(ctx, [[1280, 250], [1100, 320], [860, 470], [760, 720], [1280, 720]], CAVERN_ROCK, 3);
    D.drawOutlinedPolygon(ctx, [[0, 470], [500, 400], [860, 270], [1020, 180], [1060, 190], [900, 300], [560, 480], [0, 570]], '#6a6898', 3);
    drawFloatingMotes(ctx, time);
  }

  // The last stretch: the exit glows close by on the right.
  function drawCaveMouth(ctx, time) {
    D.drawBandedGradient(ctx, { x: 0, y: 0, width: 1280, height: 720 }, '#2a2050', '#3c5878', 12);
    drawStalactites(ctx);
    drawDaylight(ctx, 1080, 260, 110, time);
    drawUnderworldFloor(ctx, 440);
    drawFloatingMotes(ctx, time);
  }

  // ---- The pictures ----

  const PICTURES = {
    'thrace-forest': function (ctx, time) {
      const bow = 0.12 + Math.sin(time) * 0.02;
      drawThraceValley(ctx);
      drawTree(ctx, 110, 420, 1.3, bow, DAY_LEAVES);
      drawTree(ctx, 260, 400, 1.0, bow, DAY_LEAVES);
      drawTree(ctx, 1030, 400, 1.0, -bow, DAY_LEAVES);
      drawTree(ctx, 1170, 420, 1.3, -bow, DAY_LEAVES);
      person(ctx, 640, 440, 2.3, looks.orpheus, 'offer');
      drawRisingNotes(ctx, 480, 250, time, P.gold);
      drawRestingRabbit(ctx, 340, 470, 1.1);
      drawRestingBear(ctx, 480, 474, 1.0);
      drawRestingDeer(ctx, 840, 474, 1.1);
    },
    'orpheus-eurydice': function (ctx, time) {
      drawThraceValley(ctx);
      drawTree(ctx, 220, 440, 1.6, 0, DAY_LEAVES);
      drawTree(ctx, 1120, 420, 1.1, 0, DAY_LEAVES);
      person(ctx, 560, 460, 2.3, looks.orpheus, 'offer');
      person(ctx, 790, 460, 2.3, looks.eurydice, 'stand');
      drawRisingNotes(ctx, 625, 250, time, '#f05a9a');
      drawFlowers(ctx, [[380, 470, '#f08ab0'], [430, 462, '#ffffff'], [950, 466, '#f0c850'], [1000, 474, '#f08ab0']]);
    },
    'tempe-meadow': function (ctx, time) {
      const stride = Math.sin(time * 8) * 0.04;
      drawValleyOfTempe(ctx);
      drawSpeedLines(ctx, 220, 250);
      drawLeaningPerson(ctx, 330, 450, 1.9, aristaeusLook, 'point', 0.06 + stride);
      drawSpeedLines(ctx, 770, 240);
      drawLeaningPerson(ctx, 860, 460, 2.1, looks.eurydice, 'mourn', 0.08 - stride);
      drawGrassTufts(ctx, 470, '#5aa84a', 3);
    },
    viper: function (ctx, time) {
      drawValleyOfTempe(ctx);
      drawSparkles(ctx, 420, 380, time);
      drawSleepingNymph(ctx, 560, 426, 1.7);
      drawViper(ctx, 930, 452, 1.5, time);
      drawFlowers(ctx, [[230, 470, '#f08ab0'], [300, 462, '#ffffff'], [780, 474, '#f0c850'], [1120, 466, '#f08ab0']]);
      drawGrassTufts(ctx, 482, '#5aa84a', 8);
    },
    'orpheus-decision': function (ctx, time) {
      drawCaveAtDusk(ctx);
      person(ctx, 420, 470, 2.4, looks.orpheus, 'point');
    },
    'styx-shore': function (ctx, time) {
      drawCavern(ctx, time);
      drawFarShore(ctx, 290);
      drawStyx(ctx, 290, time);
      drawFerry(ctx, 800, 352, 0.45, time, function () { drawCharon(ctx, 60, -14, 1); });
      drawUnderworldFloor(ctx, 410);
      [900, 1010, 1120].forEach(function (soulX) { drawSoul(ctx, soulX, 450, time); });
      person(ctx, 330, 455, 2.2, looks.orpheus, 'stand');
    },
    'charon-boat': function (ctx, time) {
      drawCavern(ctx, time);
      drawFarShore(ctx, 330);
      drawStyx(ctx, 330, time);

<script>
(function (LM) {
  'use strict';

  function isEnabled(item) {
    return item.isEnabled !== false;
  }

  function silence() {}

  // A vertical list of buttons driven by arrows + Enter or the mouse.
  // items: [{ id, label, isEnabled? }]
  // layout: { x, y, width, itemHeight, gap, fontSize?, playSound?, renderItem?(ctx, item, rect, state) }
  function createMenu(items, layout) {
    const playSound = layout.playSound || silence;
    let selectedIndex = Math.max(0, items.findIndex(isEnabled));

    function itemRect(index) {
      return {
        x: layout.x,
        y: layout.y + index * (layout.itemHeight + layout.gap),
        width: layout.width,
        height: layout.itemHeight,
      };
    }

    function indexAtPointer(pointer) {
      return items.findIndex(function (item, index) {
        return isEnabled(item) && LM.ui.isPointInRect(pointer, itemRect(index));
      });
    }

    function moveSelection(step) {
      let candidate = selectedIndex;
      for (let tries = 0; tries < items.length; tries += 1) {
        candidate = (candidate + step + items.length) % items.length;
        if (isEnabled(items[candidate])) {
          selectedIndex = candidate;
          playSound('move');
          return;
        }
      }
    }

    function selectHoveredItem(pointer) {
      const hovered = indexAtPointer(pointer);
      if (pointer.hasMoved && hovered >= 0 && hovered !== selectedIndex) {
        selectedIndex = hovered;
        playSound('move');
      }
      return hovered;
    }

    // Returns the chosen item, or null when nothing was chosen this update.
    function update(input) {
      if (input.wasPressed('up')) {
        moveSelection(-1);
      }
      if (input.wasPressed('down')) {
        moveSelection(1);
      }
      const hovered = selectHoveredItem(input.pointer);
      const clickedItem = input.pointer.wasPressed && hovered >= 0;
      const confirmedItem = input.wasPressed('confirm') && isEnabled(items[selectedIndex]);
      if (clickedItem || confirmedItem) {
        playSound('choose');
        return items[selectedIndex];
      }
      return null;
    }

    function stateOf(item, index) {
      if (!isEnabled(item)) {
        return 'disabled';
      }
      return index === selectedIndex ? 'selected' : 'normal';
    }

    function drawPlainButton(ctx, item, rect, state) {
      LM.ui.drawButton(ctx, rect, item.label, state, layout.fontSize);
    }

    function render(ctx) {
      const drawItem = layout.renderItem || drawPlainButton;
      items.forEach(function (item, index) {
        drawItem(ctx, item, itemRect(index), stateOf(item, index));
      });
    }

    return {
      update,
      render,
      selectedItem: function () { return items[selectedIndex]; },
    };
  }

  LM.menu = { createMenu };
}(window.LM = window.LM || {}));

</script>

// Owns the AudioContext and the mixing buses: music (ducked under narration), sfx and voice.
(function (LM) {
  'use strict';

  const DUCKED_MUSIC_LEVEL = 0.35;

  function createAudioHub() {
    const volumes = { music: 0.55, sfx: 0.8, voice: 1 };
    const buses = {};
    let context = null;
    let master = null;
    let musicDuck = null;
    let isMuted = false;

    function createBus(name, destination) {
      const bus = context.createGain();
      bus.gain.value = volumes[name];
      bus.connect(destination);
      buses[name] = bus;
    }

    function buildGraph() {
      master = context.createGain();
      master.gain.value = isMuted ? 0 : 1;
      master.connect(context.destination);
      musicDuck = context.createGain();
      musicDuck.connect(master);
      createBus('music', musicDuck);
      createBus('sfx', master);
      createBus('voice', master);
    }

    function suspendWhenHidden() {
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          context.suspend();
        } else {
          context.resume();
        }
      });
    }

    // Browsers only allow audio after a user gesture, so this runs on the first key press or click.
    function unlock() {
      if (context) {
        context.resume();
        return;
      }
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) {
        return;
      }
      context = new AudioContextClass();
      buildGraph();
      suspendWhenHidden();
    }

    function setVolume(busName, value) {
      volumes[busName] = value;
      if (buses[busName]) {
        buses[busName].gain.setTargetAtTime(value, context.currentTime, 0.05);
      }
    }

    function setMuted(shouldMute) {
      isMuted = shouldMute;
      if (master) {
        master.gain.setTargetAtTime(shouldMute ? 0 : 1, context.currentTime, 0.05);
      }
    }

    function duckMusic() {
      if (musicDuck) {
        musicDuck.gain.setTargetAtTime(DUCKED_MUSIC_LEVEL, context.currentTime, 0.15);
      }
    }

    function restoreMusic() {
      if (musicDuck) {
        musicDuck.gain.setTargetAtTime(1, context.currentTime, 0.3);
      }
    }

    return {
      unlock,
      setVolume,
      setMuted,
      duckMusic,
      restoreMusic,
      context: function () { return context; },
      bus: function (name) { return buses[name]; },
      isReady: function () { return context !== null; },
      volume: function (name) { return volumes[name]; },
    };
  }

  LM.audioHub = { createAudioHub };
}(window.LM = window.LM || {}));

// "Polyphonic ringtone" instruments built from oscillators. Each schedules one note:
// instrument(context, destination, frequency, startTime, durationSeconds, velocity 0..1).
(function (LM) {
  'use strict';

  const SILENT = 0.0001;
  const noiseBuffers = new WeakMap();
  const pulseWaves = new WeakMap();

  function noiseBuffer(context) {
    if (!noiseBuffers.has(context)) {
      const buffer = context.createBuffer(1, context.sampleRate, context.sampleRate);
      const samples = buffer.getChannelData(0);
      for (let index = 0; index < samples.length; index += 1) {
        samples[index] = Math.random() * 2 - 1;
      }
      noiseBuffers.set(context, buffer);
    }
    return noiseBuffers.get(context);
  }

  // Fourier series of a 25% pulse wave: the classic "chip" lead colour.
  function pulseWave(context) {
    if (!pulseWaves.has(context)) {
      const harmonics = 32;
      const real = new Float32Array(harmonics);
      const imaginary = new Float32Array(harmonics);
      for (let n = 1; n < harmonics; n += 1) {
        real[n] = (2 / (n * Math.PI)) * Math.sin(Math.PI * n * 0.25);
      }
      pulseWaves.set(context, context.createPeriodicWave(real, imaginary));

    return pulseWaves.get(context);

  function applyEnvelope(gainParam, startTime, duration, shape) {
    const decayEnd = startTime + shape.attack + shape.decay;
    const sustainLevel = Math.max(shape.peak * shape.sustain, SILENT);
    const releaseStart = Math.max(startTime + duration, decayEnd);
    gainParam.setValueAtTime(SILENT, startTime);
    gainParam.linearRampToValueAtTime(shape.peak, startTime + shape.attack);
    gainParam.exponentialRampToValueAtTime(sustainLevel, decayEnd);
    gainParam.setValueAtTime(sustainLevel, releaseStart);
    gainParam.exponentialRampToValueAtTime(SILENT, releaseStart + shape.release);
    return releaseStart + shape.release;

<script>
// Plays music themes: { id, bpm, loop, tracks: [{ instrument, notes, velocity? }] }.
(function (LM) {
  'use strict';

  const LOOKAHEAD_SECONDS = 0.6;
  const SCHEDULER_TICK_MS = 100;
  const LATE_NOTE_TOLERANCE_SECONDS = 0.05;
  const DEFAULT_VELOCITY = 0.8;
  const timelineCache = new WeakMap();

  function secondsPerBeat(theme) {
    return 60 / theme.bpm;
  }

  function themeLengthBeats(theme) {
    return Math.max.apply(null, theme.tracks.map(function (track) {
      return LM.notes.totalBeats(LM.notes.parseNoteString(track.notes));
    }));
  }

  function trackNotes(track) {
    const notes = [];
    let beat = 0;
    LM.notes.parseNoteString(track.notes).forEach(function (note) {
      if (note.midi !== null) {
        notes.push({ beat: beat, beats: note.beats, frequency: LM.notes.midiToFrequency(note.midi), instrument: track.instrument, velocity: track.velocity || DEFAULT_VELOCITY });
      }
      beat += note.beats;
    });
    return notes;
  }

  // All notes of all tracks, sorted by when they start (worked out once per theme).
  function themeTimeline(theme) {
    if (!timelineCache.has(theme)) {
      const notes = theme.tracks.reduce(function (all, track) { return all.concat(trackNotes(track)); }, []);
      notes.sort(function (first, second) { return first.beat - second.beat; });
      timelineCache.set(theme, notes);
    }
    return timelineCache.get(theme);
  }

  function playNote(context, destination, note, startTime, beatSeconds) {
    LM.instruments[note.instrument](context, destination, note.frequency, startTime + note.beat * beatSeconds, note.beats * beatSeconds, note.velocity);
  }

  // Schedules one whole pass at once; returns when it ends. Used for jingles, ballads and offline rendering.
  function scheduleThemeOnce(context, destination, theme, startTime) {
    const beatSeconds = secondsPerBeat(theme);
    themeTimeline(theme).forEach(function (note) { playNote(context, destination, note, startTime, beatSeconds); });
    return startTime + themeLengthBeats(theme) * beatSeconds;
  }

  // Background music is scheduled a little ahead at a time, so a long loop never creates hundreds of nodes at once.
  function createMusicPlayer(hub) {
    let current = null;

    // Notes already late (after the page stalled) are skipped; playing them now would sound as one burst.
    function scheduleDueNotes(playing) {
      const now = hub.context().currentTime;
      while (playing.timeline.length > 0) {
        if (playing.cursor >= playing.timeline.length) {
          if (!playing.theme.loop) {
            return;
          }
          playing.passStart += playing.passSeconds;
          playing.cursor = 0;
        }
        const note = playing.timeline[playing.cursor];
        const noteStart = playing.passStart + note.beat * playing.beatSeconds;
        if (noteStart > now + LOOKAHEAD_SECONDS) {
          return;
        }
        if (noteStart >= now - LATE_NOTE_TOLERANCE_SECONDS) {
          playNote(hub.context(), playing.gain, note, playing.passStart, playing.beatSeconds);
        }
        playing.cursor += 1;
      }
    }

    function stop(fadeSeconds) {
      if (!current) {
        return;
      }
      const playing = current;
      current = null;
      window.clearInterval(playing.timer);
      playing.gain.gain.setTargetAtTime(0, hub.context().currentTime, Math.max(fadeSeconds, 0.01) / 3);
      window.setTimeout(function () { playing.gain.disconnect(); }, fadeSeconds * 1000 + 300);
    }

    function play(theme) {
      if (!hub.isReady() || (current && current.theme === theme)) {
        return;
      }
      stop(0.4);
      const context = hub.context();
      const gain = context.createGain();
      gain.connect(hub.bus('music'));
      const beatSeconds = secondsPerBeat(theme);
      const playing = {
        theme: theme, gain: gain, timeline: themeTimeline(theme), cursor: 0,
        beatSeconds: beatSeconds, passSeconds: themeLengthBeats(theme) * beatSeconds, passStart: context.currentTime + 0.1,
      };
      scheduleDueNotes(playing);
      playing.timer = window.setInterval(function () { scheduleDueNotes(playing); }, SCHEDULER_TICK_MS);
      current = playing;
    }

    return {
      play,
      stop,
      currentThemeId: function () { return current ? current.theme.id : null; },
    };
  }

  LM.music = { scheduleThemeOnce, createMusicPlayer };
}(window.LM = window.LM || {}));

<script>
// The narrator: the browser's own speech synthesis with Polish voices. Without voices the game is simply text-only.
(function (LM) {
  'use strict';

  const MAX_CHUNK_LENGTH = 180;

  // Chrome stops long utterances half-way, so text is spoken sentence by sentence (long ones split at commas).
  function splitIntoChunks(text) {
    const chunks = [];
    text.split(/(?<=[.!?…:])\s+/).forEach(function (sentence) {
      if (sentence.length <= MAX_CHUNK_LENGTH) {
        chunks.push(sentence);
        return;
      }
      sentence.split(/(?<=,)\s+/).forEach(function (part) { chunks.push(part); });
    });
    return chunks.filter(function (chunk) { return chunk.trim().length > 0; });
  }

  // Offline voices first: the game must also work without internet.
  function pickVoice(polishVoices, wantedName) {
    const byPreference = polishVoices.slice().sort(function (first, second) {
      return Number(second.localService) - Number(first.localService);
    });
    return byPreference.find(function (voice) { return voice.name.indexOf(wantedName) >= 0; }) || byPreference[0] || null;
  }

  function createSpeech(hub) {
    const synth = window.speechSynthesis || null;
    let polishVoices = [];
    let speaking = [];

    function loadVoices() {
      polishVoices = synth.getVoices().filter(function (voice) { return /^pl/i.test(voice.lang); });
    }

    if (synth) {
      loadVoices();
      synth.addEventListener('voiceschanged', loadVoices);
    }

    function isAvailable() {
      return synth !== null && polishVoices.length > 0;
    }

    function cancel() {
      if (synth) {
        synth.cancel();
      }
      speaking = [];
      hub.restoreMusic();
    }

    function createUtterance(chunk, speaker) {
      const utterance = new SpeechSynthesisUtterance(chunk);
      utterance.lang = 'pl-PL';
      utterance.voice = pickVoice(polishVoices, speaker.voiceName);
      utterance.pitch = speaker.pitch;
      utterance.rate = speaker.rate;
      utterance.volume = hub.volume('voice');
      return utterance;
    }

    // The music comes back when the narration ends or fails. Cancelled utterances report late,
    // possibly during newer narration, so only the current narration's last utterance counts.
    function restoreMusicAfter(lastUtterance) {
      function restoreIfCurrent() {
        if (speaking[speaking.length - 1] === lastUtterance) {
          hub.restoreMusic();
        }
      }
      lastUtterance.onend = restoreIfCurrent;
      lastUtterance.onerror = restoreIfCurrent;
    }

    function speak(text, speakerId) {
      cancel();
      const chunks = splitIntoChunks(text);
      if (!isAvailable() || chunks.length === 0) {
        return;
      }
      const speaker = LM.data.voices[speakerId] || LM.data.voices.narrator;
      hub.duckMusic();
      // Utterances are kept in an array: Chrome garbage-collects them otherwise and never fires onend.
      speaking = chunks.map(function (chunk) { return createUtterance(chunk, speaker); });
      restoreMusicAfter(speaking[speaking.length - 1]);
      speaking.forEach(function (utterance) { synth.speak(utterance); });
    }

    return { speak, cancel, isAvailable };
  }

  LM.speech = { createSpeech, splitIntoChunks };
}(window.LM = window.LM || {}));

<script>
// Polish spelling → phoneme symbols. Polish orthography is nearly phonetic, so a few ordered rules are enough:
// digraphs first, then softening by "i", then voicing assimilation and final devoicing.
(function (LM) {
  'use strict';

  const VOWELS = new Set(['a', 'e', 'i', 'o', 'u', 'y']);
  const DIGRAPHS = [
    ['dzi', 'dzj'], ['dź', 'dzj'], ['dż', 'dzh'], ['dz', 'dz'],
    ['ch', 'x'], ['cz', 'ch'], ['sz', 'sh'], ['rz', 'zh'],
    ['ci', 'cj'], ['si', 'sj'], ['zi', 'zj'], ['ni', 'nj'],
  ];
  const SINGLE_LETTERS = {
    a: 'a', e: 'e', i: 'i', o: 'o', u: 'u', y: 'y', ó: 'u',
    b: 'b', c: 'c', d: 'd', f: 'f', g: 'g', h: 'x', j: 'j', k: 'k', l: 'l', ł: 'w',
    m: 'm', n: 'n', p: 'p', r: 'r', s: 's', t: 't', w: 'v', z: 'z', v: 'v',
    ś: 'sj', ć: 'cj', ź: 'zj', ż: 'zh', ń: 'nj',
  };
  const DEVOICED = { b: 'p', d: 't', g: 'k', v: 'f', z: 's', zh: 'sh', zj: 'sj', dz: 'c', dzh: 'ch', dzj: 'cj' };
  const VOICELESS = new Set(['p', 't', 'k', 'f', 's', 'sh', 'sj', 'x', 'c', 'ch', 'cj']);
  const SOFT_FROM_DIGRAPH = new Set(['dzj', 'cj', 'sj', 'zj', 'nj']);
  const PUNCTUATION = /[.,!?;:„”"'()«»…–—]/g;

  function isVowelLetter(letter) {
    return VOWELS.has(letter) || letter === 'ó' || letter === 'ą' || letter === 'ę';
  }

  function matchDigraph(word, index) {
    return DIGRAPHS.find(function (pair) { return word.startsWith(pair[0], index); }) || null;
  }

  // "si", "ci", "ni"… before a vowel only soften the consonant; before a consonant the "i" is also sung.
  function readSoftDigraph(word, index, digraph, output) {
    const iIndex = index + digraph[0].length - 1;
    output.push({ symbol: digraph[1], letterIndex: index });
    const nextLetter = word[iIndex + 1];
    if (!nextLetter || !isVowelLetter(nextLetter)) {
      output.push({ symbol: 'i', letterIndex: iIndex });
    }
    return digraph[0].length;
  }

  function readNasalVowel(word, index, output) {
    const isWordFinalE = word[index] === 'ę' && index === word.length - 1;
    output.push({ symbol: word[index] === 'ą' ? 'o' : 'e', letterIndex: index });
    if (!isWordFinalE) {
      output.push({ symbol: 'n~', letterIndex: index });
    }
    return 1;
  }

  // Any other consonant + "i" + vowel: the "i" becomes the glide j ("pióra" → p j u r a).
  function readLetter(word, index, output) {
    const letter = word[index];
    const symbol = SINGLE_LETTERS[letter];
    if (!symbol) {
      return 1;
    }
    output.push({ symbol: symbol, letterIndex: index });
    const isConsonant = !isVowelLetter(letter);
    if (isConsonant && word[index + 1] === 'i' && isVowelLetter(word[index + 2] || '')) {
      output.push({ symbol: 'j', letterIndex: index + 1 });
      return 2;
    }
    return 1;
  }

  function spellOut(word) {
    const output = [];
    let index = 0;
    while (index < word.length) {
      const digraph = matchDigraph(word, index);
      if (digraph && SOFT_FROM_DIGRAPH.has(digraph[1]) && digraph[0].endsWith('i')) {
        index += readSoftDigraph(word, index, digraph, output);
      } else if (digraph) {
        output.push({ symbol: digraph[1], letterIndex: index });
        index += digraph[0].length;
      } else if (word[index] === 'ą' || word[index] === 'ę') {
        index += readNasalVowel(word, index, output);
      } else {
        index += readLetter(word, index, output);
      }
    }
    return output;
  }

  // "przy" is said "pszy", "kwiat" is said "kfiat": rz and w lose voice after a voiceless consonant.
  function assimilateAfterVoiceless(phonemes) {
    for (let index = 1; index < phonemes.length; index += 1) {
      const previous = phonemes[index - 1].symbol;
      const current = phonemes[index].symbol;
      if (VOICELESS.has(previous) && (current === 'zh' || current === 'v')) {
        phonemes[index].symbol = DEVOICED[current];
      }
    }
  }

  // "dziewczyna" is said "dziefczyna": a voiced consonant loses voice before a voiceless one.
  function assimilateBeforeVoiceless(phonemes) {
    for (let index = phonemes.length - 2; index >= 0; index -= 1) {
      const current = phonemes[index].symbol;
      if (DEVOICED[current] && VOICELESS.has(phonemes[index + 1].symbol)) {
        phonemes[index].symbol = DEVOICED[current];
      }
    }
  }

  function devoiceWordEnd(phonemes) {
    const last = phonemes[phonemes.length - 1];
    if (last && DEVOICED[last.symbol]) {
      last.symbol = DEVOICED[last.symbol];
    }
  }

  function normalizeWord(word) {
    return word.toLowerCase().replace(PUNCTUATION, '');
  }

  // Returns [{ symbol, letterIndex }]; letterIndex points into the word without hyphens.
  function isVowelSymbol(symbol) {
    return VOWELS.has(symbol);
  }

  // Vowel-less prepositions ("w", "z") take the voicing of the next word, so they are not devoiced.
  function wordToPhonemes(word) {
    const phonemes = spellOut(normalizeWord(word));
    assimilateAfterVoiceless(phonemes);
    assimilateBeforeVoiceless(phonemes);
    if (phonemes.some(function (phoneme) { return isVowelSymbol(phoneme.symbol); })) {
      devoiceWordEnd(phonemes);
    }
    return phonemes;
  }

  // "dzie-wczy-na" → [['dzj','e'], ['f','ch','y'], ['n','a']] (one array of symbols per written syllable).
  function hyphenatedWordToSyllables(hyphenatedWord) {
    const parts = normalizeWord(hyphenatedWord).split('-');
    const syllableOfLetter = [];
    parts.forEach(function (part, syllableIndex) {
      Array.from(part).forEach(function () { syllableOfLetter.push(syllableIndex); });
    });
    const syllables = parts.map(function () { return []; });
    wordToPhonemes(parts.join('')).forEach(function (phoneme) {
      syllables[syllableOfLetter[phoneme.letterIndex]].push(phoneme.symbol);
    });
    return syllables;
  }

  // Inside one sung syllable only the first vowel is the nucleus: "tau" is sung "taw".
  function turnTrailingVowelsIntoGlides(symbols) {
    const nucleus = symbols.findIndex(isVowelSymbol);
    return symbols.map(function (symbol, index) {
      if (index > nucleus && symbol === 'u') {
        return 'w';
      }
      if (index > nucleus && symbol === 'i') {
        return 'j';
      }
      return symbol;
    });
  }

  // A sung line: "Na Kre-cie w głę-bi _" → [{ text, symbols, isHold }]. A vowel-less word ("w", "z")
  // is sung together with the next syllable; "_" holds the previous vowel on the next note.
  function lineToSyllables(line) {
    const result = [];
    let pending = { text: '', symbols: [] };
    line.split(/\s+/).filter(Boolean).forEach(function (word) {
      if (word === '_') {
        result.push({ text: '', symbols: [], isHold: true });
        return;
      }
      const texts = word.split('-');
      hyphenatedWordToSyllables(word).forEach(function (symbols, index) {
        const text = texts[index] + (index === texts.length - 1 ? ' ' : '');
        if (!symbols.some(isVowelSymbol)) {
          pending = { text: pending.text + text, symbols: pending.symbols.concat(symbols) };
          return;
        }
        result.push({
          text: pending.text + text,
          symbols: turnTrailingVowelsIntoGlides(pending.symbols.concat(symbols)),
          isHold: false,
        });
        pending = { text: '', symbols: [] };
      });
    });
    return result;
  }

  LM.phonemes = { wordToPhonemes, hyphenatedWordToSyllables, lineToSyllables, isVowelSymbol };
}(window.LM = window.LM || {}));

</script>

// Splits one sung syllable's time between its consonants and its vowel.
(function (LM) {
  'use strict';

  const MAX_CONSONANT_SHARE = 0.5;
  const MIN_CONSONANT_SCALE = 0.4;
  const MIN_VOWEL_SECONDS = 0.04;

  function consonantSeconds(symbols) {
    return symbols.reduce(function (sum, symbol) { return sum + LM.phonemeTable.phonemeInfo(symbol).duration; }, 0);
  }

  // Consonants keep their natural length unless they would take over half the note; then they shrink (to 40% at most).
  function consonantScale(totalConsonantSeconds, syllableSeconds) {
    if (totalConsonantSeconds === 0) {
      return 1;
    }
    const scale = syllableSeconds * MAX_CONSONANT_SHARE / totalConsonantSeconds;
    return Math.min(1, Math.max(MIN_CONSONANT_SCALE, scale));
  }

  function appendSegments(segments, symbols, startTime, scale) {
    let time = startTime;
    symbols.forEach(function (symbol) {
      const duration = LM.phonemeTable.phonemeInfo(symbol).duration * scale;
      segments.push({ symbol: symbol, start: time, duration: duration });
      time += duration;
    });
    return time;
  }

  // Returns [{ symbol, start, duration }]: onset consonants, the vowel filling the middle, then the coda.
  function planSyllableSegments(symbols, start, end) {
    const nucleus = symbols.findIndex(LM.phonemes.isVowelSymbol);
    const onset = symbols.slice(0, nucleus);
    const coda = symbols.slice(nucleus + 1);
    const scale = consonantScale(consonantSeconds(onset) + consonantSeconds(coda), end - start);
    const segments = [];
    const vowelStart = appendSegments(segments, onset, start, scale);
    const codaSeconds = consonantSeconds(coda) * scale;
    const vowelDuration = Math.max(MIN_VOWEL_SECONDS, end - codaSeconds - vowelStart);
    segments.push({ symbol: symbols[nucleus], start: vowelStart, duration: vowelDuration });
    appendSegments(segments, coda, vowelStart + vowelDuration, scale);
    return segments;
  }

  LM.phonemeTiming = { planSyllableSegments };
}(window.LM = window.LM || {}));

// Turns a song (lyrics + melody) into plain parameter events for the formant voice, plus a karaoke timeline.
// Pure data in, pure data out, so it is unit-tested without Web Audio.
(function (LM) {
  'use strict';

  const FORMANT_PARAMS = ['f1', 'f2', 'f3'];
  const BANDWIDTH_PARAMS = ['b1', 'b2', 'b3'];

  function setAt(time, param, value) {
    return { time: time, param: param, value: value, timeConstant: 0 };
  }

  function glideTo(time, param, value, timeConstant) {
    return { time: time, param: param, value: value, timeConstant: timeConstant };
  }

  function formantEvents(time, info, timeConstant) {
    const frequencies = info.formants.map(function (frequency, index) {
      return glideTo(time, FORMANT_PARAMS[index], frequency, timeConstant);
    });
    const bandwidths = info.bandwidths.map(function (bandwidth, index) {
      return glideTo(time, BANDWIDTH_PARAMS[index], bandwidth, timeConstant);
    });
    return frequencies.concat(bandwidths, [glideTo(time, 'nasalZero', info.nasalZero, timeConstant)]);
  }

  function noiseOnEvents(time, noise, level) {
    return [
      setAt(time, 'noiseFrequency', noise.frequency),
      setAt(time, 'noiseQ', noise.q),
      glideTo(time, 'noiseGain', level, 0.006),
    ];
  }

  function sonorantEvents(segment, info) {
    return [
      glideTo(segment.start, 'voicing', info.voicing, 0.015),
      glideTo(segment.start, 'noiseGain', 0, 0.01),
      glideTo(segment.start, 'aspiration', 0, 0.01),
    ].concat(formantEvents(segment.start, info, 0.022));
  }

  // A Polish rolled r: the voice dips quickly two or three times.
  function trillEvents(segment, info) {
    const events = sonorantEvents(segment, info);
    for (let tap = 0; tap < 3; tap += 1) {
      const tapTime = segment.start + segment.duration * (0.15 + tap * 0.28);
      events.push(glideTo(tapTime, 'voicing', 0.12, 0.004));
      events.push(glideTo(tapTime + segment.duration * 0.12, 'voicing', info.voicing, 0.004));
    }
    return events;
  }

  function fricativeEvents(segment, info) {
    return [
      glideTo(segment.start, 'voicing', info.voicing, 0.01),
      glideTo(segment.start, 'aspiration', info.aspiration, 0.01),
    ].concat(formantEvents(segment.start, info, 0.015), noiseOnEvents(segment.start, info.noise, info.noise.level));
  }

  // Closure (silence or a voice bar) with the formants moving to the consonant's locus, then a short burst.
  function plosiveEvents(segment, info) {
    const burstTime = segment.start + segment.duration * 0.7;
    return [
      glideTo(segment.start, 'voicing', info.voicing, 0.006),
      glideTo(segment.start, 'noiseGain', 0, 0.004),
      glideTo(segment.start, 'aspiration', 0, 0.004),
    ].concat(formantEvents(segment.start, info, 0.01), noiseOnEvents(burstTime, info.noise, info.noise.level), [
      glideTo(burstTime, 'aspiration', info.aspiration, 0.003),
      glideTo(burstTime + segment.duration * 0.15, 'noiseGain', 0, 0.008),
    ]);
  }

  function affricateEvents(segment, info) {
    const frictionTime = segment.start + segment.duration * 0.35;
    return [
      glideTo(segment.start, 'voicing', info.voicing, 0.006),
      glideTo(segment.start, 'noiseGain', 0, 0.004),
      glideTo(segment.start, 'aspiration', 0, 0.004),
    ].concat(formantEvents(segment.start, info, 0.01), noiseOnEvents(frictionTime, info.noise, info.noise.level));
  }

  const EVENT_BUILDERS = {
    vowel: sonorantEvents,
    nasal: sonorantEvents,
    liquid: sonorantEvents,
    glide: sonorantEvents,
    trill: trillEvents,
    fricative: fricativeEvents,
    plosive: plosiveEvents,
    affricate: affricateEvents,
  };

  function segmentEvents(segment) {
    const info = LM.phonemeTable.phonemeInfo(segment.symbol);
    return EVENT_BUILDERS[info.kind](segment, info);
  }

  function silenceEvents(time) {
    return [glideTo(time, 'voicing', 0, 0.03), glideTo(time, 'noiseGain', 0, 0.02), glideTo(time, 'aspiration', 0, 0.02)];
  }

  function singableNoteCount(line) {
    return LM.notes.parseNoteString(line.notes).filter(function (note) { return note.midi !== null; }).length;
  }

  // Returns a description of the problem, or null when every sung note has exactly one syllable or "_".
  function lineAlignmentProblem(line) {
    const syllableCount = LM.phonemes.lineToSyllables(line.lyrics).length;
    const noteCount = singableNoteCount(line);
    if (syllableCount === noteCount) {
      return null;
    }
    return '"' + line.lyrics + '": ' + syllableCount + ' syllables for ' + noteCount + ' notes';
  }

  // Walks the melody note by note and pairs every sung note with a syllable (or extends the previous one on "_").
  function placeLine(line, verseIndex, startTime, beatSeconds, syllablePlans) {
    const syllables = LM.phonemes.lineToSyllables(line.lyrics);
    const karaokeLine = { verseIndex: verseIndex, syllables: [] };
    let time = startTime;
    let cursor = 0;
    LM.notes.parseNoteString(line.notes).forEach(function (note) {
      const noteStart = time;
      time += note.beats * beatSeconds;
      if (note.midi === null) {
        return;
      }
      const syllable = syllables[cursor];
      cursor += 1;
      if (syllable.isHold) {
        const held = syllablePlans[syllablePlans.length - 1];
        held.end = time;
        held.pitches.push({ time: noteStart, midi: note.midi });
        karaokeLine.syllables[karaokeLine.syllables.length - 1].end = time;
        return;
      }
      syllablePlans.push({ symbols: syllable.symbols, start: noteStart, end: time, pitches: [{ time: noteStart, midi: note.midi }] });
      karaokeLine.syllables.push({ text: syllable.text, start: noteStart, end: time });
    });
    return { karaokeLine: karaokeLine, endTime: time };
  }

  // Appends the events of one sung syllable to `events`.
  function addSyllableEvents(events, plan, nextPlan) {
    plan.pitches.forEach(function (pitch) {
      events.push(glideTo(pitch.time, 'pitch', LM.notes.midiToFrequency(pitch.midi), 0.012));
    });
    LM.phonemeTiming.planSyllableSegments(plan.symbols, plan.start, plan.end).forEach(function (segment) {
      events.push.apply(events, segmentEvents(segment));
    });
    const isFollowedByRest = !nextPlan || nextPlan.start > plan.end + 0.001;
    if (isFollowedByRest) {
      events.push.apply(events, silenceEvents(plan.end));
    }
  }

  // song: { bpm, introBeats, verses: [{ lines: [{ lyrics, notes }] }] }
  function planSong(song, startTime) {
    const beatSeconds = 60 / song.bpm;
    const syllablePlans = [];
    const karaoke = [];
    let time = startTime + (song.introBeats || 0) * beatSeconds;
    song.verses.forEach(function (verse, verseIndex) {
      verse.lines.forEach(function (line) {
        const placed = placeLine(line, verseIndex, time, beatSeconds, syllablePlans);
        karaoke.push(placed.karaokeLine);
        time = placed.endTime;
      });
    });
    const events = silenceEvents(startTime);
    syllablePlans.forEach(function (plan, index) {
      addSyllableEvents(events, plan, syllablePlans[index + 1]);
    });
    events.sort(function (first, second) { return first.time - second.time; });
    return { events: events, karaoke: karaoke, endTime: time };
  }

  LM.voiceAutomation = { planSong, lineAlignmentProblem };
}(window.LM = window.LM || {}));

// A Klatt-style cascade formant synthesizer, sample by sample.
// createKlattSynth is turned into AudioWorklet code with Function.toString(), so it must stay
// self-contained: no references to anything outside its own body.
(function (LM) {
  'use strict';

  function createKlattSynth(sampleRate, events) {
    const TWO_PI = Math.PI * 2;
    const VIBRATO_HZ = 5.2;
    const VIBRATO_CENTS = 16;
    const OPEN_QUOTIENT = 0.6;
    const VOICE_GAIN = 0.15;
    const FRICATION_GAIN = 0.6;
    const FILTER_UPDATE_SAMPLES = 8;
    const FIXED_FORMANTS = [[3300, 250], [3900, 300]];
    const NASAL_POLE = [270, 100];

    // nasalZero equal to the nasal pole frequency cancels it (oral sounds); m, n move it up to colour the murmur.
    const params = {
      pitch: 150, voicing: 0, aspiration: 0,
      f1: 500, f2: 1500, f3: 2500, b1: 90, b2: 110, b3: 170, nasalZero: NASAL_POLE[0],
      noiseGain: 0, noiseFrequency: 4000, noiseQ: 1,
    };
    // Loudness and pitch change every sample; filter settings only every FILTER_UPDATE_SAMPLES samples.
    const AUDIO_RATE_PARAMS = ['pitch', 'voicing', 'aspiration', 'noiseGain'];
    const CONTROL_RATE_PARAMS = Object.keys(params).filter(function (name) { return AUDIO_RATE_PARAMS.indexOf(name) < 0; });
    const targets = Object.assign({}, params);
    const smoothing = {};
    Object.keys(params).forEach(function (name) { smoothing[name] = 0; });

    const resonators = [0, 1, 2, 3, 4].map(function () { return { a: 0, b: 0, c: 0, y1: 0, y2: 0 }; });
    const nasalPole = { a: 0, b: 0, c: 0, y1: 0, y2: 0 };
    const nasalZero = { a: 0, b: 0, c: 0, x1: 0, x2: 0 };
    const fricationFilter = { b0: 0, b2: 0, a1: 0, a2: 0, x1: 0, x2: 0, y1: 0, y2: 0 };
    let eventIndex = 0;
    let glottalPhase = 0;
    let tiltState = 0;
    let sampleCounter = 0;
    let vibrato = 1;

    function tuneResonator(resonator, frequency, bandwidth) {
      const period = 1 / sampleRate;
      resonator.c = -Math.exp(-TWO_PI * bandwidth * period);
      resonator.b = 2 * Math.exp(-Math.PI * bandwidth * period) * Math.cos(TWO_PI * frequency * period);
      resonator.a = 1 - resonator.b - resonator.c;
    }

    function runResonator(resonator, input) {
      const output = resonator.a * input + resonator.b * resonator.y1 + resonator.c * resonator.y2;
      resonator.y2 = resonator.y1;
      resonator.y1 = output;
      return output;
    }

    // The inverse of a resonator: a notch that removes energy around its frequency.
    function tuneAntiResonator(antiResonator, frequency, bandwidth) {
      tuneResonator(antiResonator, frequency, bandwidth);
      antiResonator.b = -antiResonator.b / antiResonator.a;
      antiResonator.c = -antiResonator.c / antiResonator.a;
      antiResonator.a = 1 / antiResonator.a;
    }

    function runAntiResonator(antiResonator, input) {
      const output = antiResonator.a * input + antiResonator.b * antiResonator.x1 + antiResonator.c * antiResonator.x2;
      antiResonator.x2 = antiResonator.x1;
      antiResonator.x1 = input;
      return output;
    }

    // RBJ band-pass with 0 dB peak, used for the hiss of s, sz, ś, f, ch.
    function tuneFricationFilter(frequency, q) {
      const omega = TWO_PI * Math.min(frequency, sampleRate * 0.45) / sampleRate;
      const alpha = Math.sin(omega) / (2 * q);
      const a0 = 1 + alpha;
      fricationFilter.b0 = alpha / a0;
      fricationFilter.b2 = -alpha / a0;
      fricationFilter.a1 = -2 * Math.cos(omega) / a0;
      fricationFilter.a2 = (1 - alpha) / a0;
    }

    function runFricationFilter(input) {
      const f = fricationFilter;
      const output = f.b0 * input + f.b2 * f.x2 - f.a1 * f.y1 - f.a2 * f.y2;
      f.x2 = f.x1;
      f.x1 = input;
      f.y2 = f.y1;
      f.y1 = output;
      return output;
    }

    function updateFilters() {
      tuneResonator(resonators[0], params.f1, params.b1);
      tuneResonator(resonators[1], params.f2, params.b2);
      tuneResonator(resonators[2], params.f3, params.b3);
      tuneAntiResonator(nasalZero, params.nasalZero, NASAL_POLE[1]);
      tuneFricationFilter(params.noiseFrequency, params.noiseQ);
    }

    // Events follow AudioParam semantics: timeConstant 0 jumps, otherwise approach exponentially.
    function applyDueEvents(now) {
      while (eventIndex < events.length && events[eventIndex].time <= now) {
        const event = events[eventIndex];
        eventIndex += 1;
        targets[event.param] = event.value;
        if (event.timeConstant > 0) {
          smoothing[event.param] = Math.exp(-1 / (event.timeConstant * sampleRate));
        } else {
          params[event.param] = event.value;
          smoothing[event.param] = 0;
        }
      }
    }

    // stepsPerCall: how many samples one call stands for (1 per sample, FILTER_UPDATE_SAMPLES per block).
    function smoothParams(names, stepsPerCall) {
      for (let index = 0; index < names.length; index += 1) {
        const name = names[index];
        const keep = stepsPerCall === 1 ? smoothing[name] : Math.pow(smoothing[name], stepsPerCall);
        params[name] = targets[name] + (params[name] - targets[name]) * keep;
      }
    }

    function updateControlRate(now) {
      smoothParams(CONTROL_RATE_PARAMS, FILTER_UPDATE_SAMPLES);
      updateFilters();
      vibrato = Math.pow(2, VIBRATO_CENTS * Math.sin(TWO_PI * VIBRATO_HZ * now) / 1200);
    }

    // Derivative of the KLGLOTT88 glottal flow: smooth opening, sharp closure (rich in harmonics).
    function glottalSource() {
      glottalPhase += params.pitch * vibrato / sampleRate;
      if (glottalPhase >= 1) {
        glottalPhase -= 1;
      }
      if (glottalPhase >= OPEN_QUOTIENT) {
        return 0;
      }
      const x = glottalPhase / OPEN_QUOTIENT;
      return 2 * x - 3 * x * x;
    }

    function nextSample(now) {
      applyDueEvents(now);
      smoothParams(AUDIO_RATE_PARAMS, 1);
      if (sampleCounter % FILTER_UPDATE_SAMPLES === 0) {
        updateControlRate(now);
      }
      sampleCounter += 1;
      const noise = Math.random() * 2 - 1;
      const excitation = glottalSource() * params.voicing + noise * params.aspiration;
      tiltState += 0.5 * (excitation - tiltState);
      let voice = runAntiResonator(nasalZero, runResonator(nasalPole, tiltState));
      for (let index = 0; index < resonators.length; index += 1) {
        voice = runResonator(resonators[index], voice);
      }
      const frication = runFricationFilter(noise) * params.noiseGain;
      return Math.tanh(voice * VOICE_GAIN + frication * FRICATION_GAIN);
    }

    tuneResonator(nasalPole, NASAL_POLE[0], NASAL_POLE[1]);
    tuneResonator(resonators[3], FIXED_FORMANTS[0][0], FIXED_FORMANTS[0][1]);
    tuneResonator(resonators[4], FIXED_FORMANTS[1][0], FIXED_FORMANTS[1][1]);

    function render(output, blockStartTime) {
      for (let index = 0; index < output.length; index += 1) {
        output[index] = nextSample(blockStartTime + index / sampleRate);
      }
    }

    return { render: render };
  }

  LM.klattCore = { createKlattSynth };
}(window.LM = window.LM || {}));
