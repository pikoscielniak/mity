<script>
// Hosts one mini-game stage: hearts, questions, pause, and the return to the last checkpoint after losing all hearts.
// A stage (LM.stageFactories[type](context)) provides: update, render, hud(), keyHints(), restoreCheckpoint(), debugAdvance().
// Its update is not called while an overlay (question, pause, hint) is open or while the hero is fainted.
(function (LM) {
  'use strict';

  const MAX_HEARTS = 3;
  const FAINT_SECONDS = 2.2;
  const GRACE_SECONDS = 1.6;

  function createStageScene(game, params) {
    const runner = params.runner;
    let heartsLeft = MAX_HEARTS;
    let faintTimer = 0;
    let graceSeconds = 0;
    let stage = null;

    function askQuestion(slot, options, onAnswered) {
      const question = runner.nextQuestion(slot);
      if (!question) {
        onAnswered(true);
        return;
      }
      game.scenes.pushOverlay(LM.questionOverlay.createQuestionOverlay(game, {
        question: question,
        header: options.header,
        attemptPolicy: options.attemptPolicy || 'retryUntilCorrect',
        run: runner.run,
        rng: runner.rng,
        onClosed: function (result) { onAnswered(result.isFirstAttemptCorrect); },
      }));
    }

    // After a lost heart the hero is safe for a moment (and blinks), so one obstacle never costs two hearts.
    function loseHeart() {
      if (faintTimer > 0 || graceSeconds > 0) {
        return;
      }
      heartsLeft -= 1;
      graceSeconds = GRACE_SECONDS;
      LM.missionRun.recordHeartLost(runner.run);
      game.sfx('heartLost');
      if (heartsLeft <= 0) {
        faintTimer = FAINT_SECONDS;
      }
    }

    function recoverAtCheckpoint() {
      heartsLeft = MAX_HEARTS;
      graceSeconds = GRACE_SECONDS;
      stage.restoreCheckpoint();
    }

    const context = {
      game: game,
      runner: runner,
      rng: runner.rng,
      run: runner.run,
      askQuestion: askQuestion,
      remainingQuestions: runner.remainingQuestions,
      loseHeart: loseHeart,
      isRecovering: function () { return graceSeconds > 0; },
      isBlinking: function () { return graceSeconds > 0 && Math.floor(graceSeconds * 10) % 2 === 0; },
      completeStage: function () { runner.completeStage(); },
    };

    function update(dt, input) {
      graceSeconds = Math.max(0, graceSeconds - dt);
      if (faintTimer > 0) {
        faintTimer -= dt;
        if (faintTimer <= 0) {
          recoverAtCheckpoint();
        }
        return;
      }
      if (input.wasPressed('back')) {
        game.scenes.pushOverlay(LM.pauseOverlay.createPauseOverlay(game));
        return;
      }
      stage.update(dt, input);
    }

    function drawFaintBanner(ctx) {
      LM.ui.drawDimmer(ctx);
      const rect = { x: 290, y: 260, width: 700, height: 170 };
      LM.ui.drawTitledPanel(ctx, rect, 'Ojej!');
      LM.text.drawWrappedText(ctx, game.say('Stracił{eś|aś} wszystkie serca. Wracasz do ostatniego punktu kontrolnego, a odpowiedzi zostają zapisane.'), 640, 354, 620, {
        font: LM.text.boldFont(22), color: LM.palette.ink, lineHeight: 30, align: 'center',
      });
    }

    function render(ctx) {
      stage.render(ctx);
      const hud = stage.hud();
      LM.ui.drawHud(ctx, { title: hud.title, heartsLeft: heartsLeft, heartsMax: MAX_HEARTS, rightText: hud.rightText });
      LM.ui.drawKeyHintBar(ctx, stage.keyHints().concat([{ keys: ['Esc'], label: 'pauza' }]), hud.bottomText);
      if (faintTimer > 0) {
        drawFaintBanner(ctx);
      }
    }

    stage = LM.stageFactories[params.stageType](context);

    return {
      update: update,
      render: render,
      stageType: params.stageType,
      stage: function () { return stage; },
    };
  }

  LM.sceneFactories.stage = createStageScene;
}(window.LM = window.LM || {}));

</script>
<script>
// After a mission or the exam: the score, new achievements, the mistakes with corrections, and "Warto zapamiętać".
(function (LM) {
  'use strict';

  const P = LM.palette;
  const PANEL = { x: 90, y: 74, width: 1100, height: 572 };
  const ITEM_GAP = 18;

  function questionText(question) {
    return question.type === 'truefalse' ? '„' + question.statement + '”' : question.prompt;
  }

  function drawScoreBar(ctx, percent, x, y, width) {
    const thresholdPercent = Math.round(LM.missionRun.PASS_THRESHOLD * 100);
    LM.ui.drawMeter(ctx, { x: x, y: y, width: width, height: 34 }, percent / 100, percent >= thresholdPercent ? P.correct : P.wrong);
    const thresholdX = x + width * LM.missionRun.PASS_THRESHOLD;
    LM.draw.drawLine(ctx, thresholdX, y - 8, thresholdX, y + 42, P.ink, 3);
    LM.text.drawTextLine(ctx, 'próg ' + thresholdPercent + '%', thresholdX, y + 64, { font: LM.text.boldFont(16), color: P.inkSoft, align: 'center' });
  }

  function attemptDetails(run) {
    const hearts = 'Utracone serca: ' + run.heartsLost;
    return run.hintBudget > 0 ? 'Użyte zwoje: ' + run.hintsUsed + ' z ' + run.hintBudget + '     ' + hearts : hearts;
  }

  // params: { scoreTitle, run, isPassed, newAchievements, concepts, backgroundIllustration, choices: [{ label, onChoose() }] }
  function createSummaryScene(game, params) {
    const run = params.run;
    const mistakes = LM.missionRun.wrongAnswers(run);
    const pages = ['score'].concat(mistakes.length > 0 ? ['mistakes'] : [], params.concepts.length > 0 ? ['concepts'] : []);
    let pageIndex = 0;
    let scroll = 0;
    let maxScroll = 0;
    let elapsed = 0;
    let finalMenu = null;

    function drawScorePage(ctx, content) {
      const percent = LM.missionRun.scorePercent(run);
      const title = params.isPassed ? 'Zaliczone! Brawo, ' + game.profile().name + '!' : 'Tym razem się nie udało, ale spróbuj jeszcze raz!';
      LM.text.drawWrappedText(ctx, title, 640, content.y + 30, content.width, { font: LM.text.boldFont(30), color: params.isPassed ? P.correct : P.wrong, lineHeight: 36, align: 'center' });
      LM.text.drawTextLine(ctx, 'Dobre odpowiedzi za pierwszym razem: ' + LM.missionRun.correctCount(run) + ' z ' + run.answers.length + ' (' + percent + '%)', 640, content.y + 100, { font: LM.text.boldFont(22), color: P.ink, align: 'center' });
      drawScoreBar(ctx, percent, 290, content.y + 124, 700);
      LM.text.drawTextLine(ctx, attemptDetails(run), 640, content.y + 236, { font: LM.text.regularFont(20), color: P.inkSoft, align: 'center' });
      drawNewAchievements(ctx, content.y + 280);
    }

    // Up to three rows in two columns, so the list never reaches the button below.
    function drawNewAchievements(ctx, top) {
      if (params.newAchievements.length > 0) {
        LM.text.drawTextLine(ctx, 'Nowe osiągnięcia:', 640, top, { font: LM.text.boldFont(21), color: P.ink, align: 'center' });
      }
      params.newAchievements.forEach(function (achievement, index) {
        const x = 170 + (index % 2) * 480;
        const y = top + 22 + Math.floor(index / 2) * 44;
        LM.draw.drawStar(ctx, x, y + 14, 17, 7.5, P.gold, 2.5);
        LM.text.drawTextLine(ctx, game.say(achievement.title), x + 28, y + 22, { font: LM.text.boldFont(20), color: P.ink });
      });
    }

    // The list is measured while it is drawn, so the scroll stops once its end is in view.
    function drawList(ctx, content, entries) {
      const visibleHeight = content.height - 70;
      ctx.save();
      ctx.beginPath();
      ctx.rect(content.x, content.y, content.width, visibleHeight);
      ctx.clip();
      let y = content.y + 24 - scroll;
      entries.forEach(function (entry) {
        y += LM.text.drawWrappedText(ctx, entry.title, content.x, y, content.width, { font: LM.text.boldFont(20), color: P.ink, lineHeight: 26 });
        y += LM.text.drawWrappedText(ctx, entry.body, content.x + 20, y, content.width - 20, { font: LM.text.regularFont(19), color: entry.bodyColor || P.inkSoft, lineHeight: 25 }) + ITEM_GAP;
      });
      ctx.restore();
      maxScroll = Math.max(0, y + scroll - (content.y + visibleHeight));
    }

    function mistakeEntries() {
      return mistakes.map(function (question) {
        return {
          title: game.say(questionText(question)),
          body: '✔ ' + LM.answerCheck.correctAnswerText(question) + ' — ' + game.say(question.explanation),
          bodyColor: '#2a6a2a',
        };
      });
    }

    function conceptEntries() {
      return params.concepts.map(function (concept) { return { title: concept.term, body: concept.definition }; });
    }

    const PAGE_TITLES = { score: params.scoreTitle, mistakes: 'Twoje błędy i poprawne odpowiedzi', concepts: 'Warto zapamiętać' };

    function isLastPage() {
      return pageIndex === pages.length - 1;
    }

    function buildFinalMenu() {
      const width = 380;
      const left = 640 - (params.choices.length * (width + 20) - 20) / 2;
      return params.choices.map(function (choice, index) {
        return Object.assign({ rect: { x: left + index * (width + 20), y: 578, width: width, height: 54 } }, choice);
      });
    }

    function updateFinalMenu(input) {
      if (input.wasPressed('left') || input.wasPressed('right')) {
        finalMenu.selected = (finalMenu.selected + 1) % finalMenu.items.length;
      }
      const clicked = finalMenu.items.find(function (item) { return input.pointer.wasPressed && LM.ui.isPointInRect(input.pointer, item.rect); });
      if (clicked || input.wasPressed('confirm')) {
        (clicked || finalMenu.items[finalMenu.selected]).onChoose();
      }
    }

    function update(dt, input) {
      elapsed += dt;
      if (input.isHeld('down')) {
        scroll = Math.min(maxScroll, scroll + dt * 300);
      }
      if (input.isHeld('up')) {
        scroll = Math.max(0, scroll - dt * 300);
      }
      if (finalMenu) {
        updateFinalMenu(input);
      } else if (input.wasPressed('confirm') || input.pointer.wasPressed) {
        game.sfx('page');
        if (isLastPage()) {
          finalMenu = { items: buildFinalMenu(), selected: 0 };
        } else {
          pageIndex += 1;
          scroll = 0;
          maxScroll = 0;
        }
      }
    }

    function drawFooter(ctx) {
      if (!finalMenu) {
        LM.ui.drawButton(ctx, { x: 450, y: 578, width: 380, height: 54 }, 'Dalej', 'selected', 24);
        return;
      }
      finalMenu.items.forEach(function (item, index) {
        LM.ui.drawButton(ctx, item.rect, item.label, index === finalMenu.selected ? 'selected' : 'normal', 22);
      });
    }

    function render(ctx) {
      LM.illustrations[params.backgroundIllustration](ctx, elapsed);
      LM.ui.drawDimmer(ctx);
      const content = LM.ui.drawTitledPanel(ctx, PANEL, PAGE_TITLES[pages[pageIndex]] + '  (' + (pageIndex + 1) + '/' + pages.length + ')');
      if (pages[pageIndex] === 'score') {
        drawScorePage(ctx, content);
      } else {
        drawList(ctx, content, pages[pageIndex] === 'mistakes' ? mistakeEntries() : conceptEntries());
      }
      drawFooter(ctx);
      LM.ui.drawKeyHintBar(ctx, [{ keys: ['Enter'], label: 'dalej' }, { keys: ['↑', '↓'], label: 'przewijanie' }]);
    }

    return { update: update, render: render };
  }

  LM.sceneFactories.summary = createSummaryScene;
}(window.LM = window.LM || {}));

</script>
<script>
// A ballad with karaoke over a picture from its myth. Enter skips; a song heard to the end counts for an achievement.
(function (LM) {
  'use strict';

  const P = LM.palette;
  const SKIP_ALLOWED_AFTER_SECONDS = 1;

  function backgroundIllustration(song) {
    const myth = LM.data.myths[song.myth];
    return myth.endingPages[myth.endingPages.length - 1].illustration;
  }

  // params: { songId, onFinished() }
  function createSongScene(game, params) {
    const song = LM.data.songs[params.songId];
    let playback = null;
    let elapsed = 0;
    let wasHeardToTheEnd = false;
    let isOnScreen = true;
    let earnedAchievements = [];

    function startSinging() {
      game.music.stop(0.4);
      // The worklet may still be loading; if the player has left by then, the song must not start.
      LM.klattVoice.prepare(game.audio.context()).then(function () {
        if (isOnScreen) {
          playback = LM.songPlayer.playSong(game.audio, song);
        }
      });
    }

    function recordHeardToTheEnd() {
      const profile = game.profile();
      LM.profiles.recordBalladHeard(profile, params.songId);
      earnedAchievements = LM.achievements.awardAchievements(profile, null, false);
      game.persist();
    }

    function update(dt, input) {
      elapsed += dt;
      const isOver = playback !== null && playback.currentTime() > playback.endTime;
      if (isOver && !wasHeardToTheEnd) {
        wasHeardToTheEnd = true;
        recordHeardToTheEnd();
      }
      const wantsToLeave = input.wasPressed('confirm') || input.wasPressed('back') || input.pointer.wasPressed;
      if (wantsToLeave && elapsed > SKIP_ALLOWED_AFTER_SECONDS) {
        params.onFinished();
      }
    }

    function render(ctx) {
      LM.illustrations[backgroundIllustration(song)](ctx, elapsed);
      LM.ui.drawDimmer(ctx);
      LM.ui.drawTitleText(ctx, song.title, 640, 150, 60);
      LM.ui.drawMeanderBand(ctx, { x: 290, y: 172, width: 700, height: 20 }, P.gold);
      LM.draw.fillRoundRect(ctx, { x: 80, y: 290, width: 1120, height: 190 }, 18, 'rgba(5, 10, 30, 0.6)');
      if (playback) {
        LM.karaokeView.drawKaraoke(ctx, playback.karaoke, playback.currentTime(), 640, 380);
      }
      earnedAchievements.forEach(function (achievement, index) {
        LM.ui.drawShadowText(ctx, '★ Nowe osiągnięcie: ' + game.say(achievement.title), 640, 560 + index * 34, 22, P.gold, 'center');
      });
      LM.ui.drawKeyHintBar(ctx, [{ keys: ['Enter'], label: 'dalej' }], 'Śpiewa robotyczny aojda, czyli grecki pieśniarz');
    }

    return {
      enter: startSinging,
      update: update,
      render: render,
      exit: function () {
        isOnScreen = false;
        if (playback) {
          playback.stop();
        }
      },
    };
  }

  LM.sceneFactories.song = createSongScene;
}(window.LM = window.LM || {}));

</script>
<script>
// The final exam: the Pythia at Delphi asks 15 questions drawn from all three myths, without hints.
(function (LM) {
  'use strict';

  function requiredCorrect(questionCount) {
    return Math.ceil(questionCount * LM.missionRun.PASS_THRESHOLD);
  }

  function drawExam(rng) {
    const pools = LM.data.missions.map(function (mission) { return LM.data.questions[mission.id]; });
    return LM.questionDraw.drawExamQuestions(pools, LM.data.crossQuestions, LM.data.exam.questionCount, rng);
  }

  function createExamScene(game) {
    const rng = LM.random.createRng(game.newSeed());
    const run = LM.missionRun.createMissionRun(LM.data.exam.id, 0);
    const questions = drawExam(rng);
    const introText = game.say('Witaj w Delfach, ' + game.profile().name + '! Jestem Pytia, kapłanka wyroczni. Zadam ci ' +
      questions.length + ' pytań o trzech mitach, bez zwojów z podpowiedziami. Aby zdać, odpowiedz dobrze na ' +
      requiredCorrect(questions.length) + '. Naciśnij Enter, gdy będziesz gotow{y|a}.');
    let questionIndex = 0;
    let phase = 'intro';
    let elapsed = 0;

    function finish() {
      LM.missionRunner.finishRun(game, run, {
        scoreTitle: 'Wynik egzaminu',
        concepts: [],
        backgroundIllustration: 'delphi',
        choiceWhenPassed: { label: 'Zobacz zakończenie!', onChoose: function () { game.show('ending'); } },
        retry: game.startExam,
      });
    }

    function askNext() {
      if (questionIndex >= questions.length) {
        finish();
        return;
      }
      game.scenes.pushOverlay(LM.questionOverlay.createQuestionOverlay(game, {
        question: questions[questionIndex],
        header: 'Wyrocznia w Delfach · pytanie ' + (questionIndex + 1) + '/' + questions.length,
        attemptPolicy: 'singleAttempt',
        run: run,
        rng: rng,
        onClosed: function () {
          questionIndex += 1;
          askNext();
        },
      }));
    }

    function update(dt, input) {
      elapsed += dt;
      if (phase === 'intro' && input.wasPressed('back')) {
        game.show('map');
      } else if (phase === 'intro' && (input.wasPressed('confirm') || input.pointer.wasPressed)) {
        phase = 'asking';
        game.speech.cancel();
        askNext();
      }
    }

    function render(ctx) {
      LM.illustrations.delphi(ctx, elapsed);
      LM.ui.drawHud(ctx, { title: LM.data.exam.title, rightText: 'Pytanie ' + Math.min(questionIndex + 1, questions.length) + '/' + questions.length });
      if (phase === 'intro') {
        LM.ui.drawParchmentPanel(ctx, { x: 120, y: 500, width: 1040, height: 150 });
        LM.text.drawWrappedText(ctx, introText, 150, 540, 980, { font: LM.text.boldFont(21), color: LM.palette.ink, lineHeight: 28 });
        LM.ui.drawKeyHintBar(ctx, [{ keys: ['Enter'], label: 'zaczynamy' }, { keys: ['Esc'], label: 'wróć na mapę' }]);
      }
    }

    return {
      enter: function () {
        game.playTheme('exam');
        game.narrate(introText, 'pythia');
      },
      update: update,
      render: render,
    };
  }

  LM.sceneFactories.exam = createExamScene;
}(window.LM = window.LM || {}));

</script>

<script>
// All achievements: earned ones shine gold with the date, the others show what to do to earn them.
(function (LM) {
  'use strict';

  const P = LM.palette;
  const CARD_WIDTH = 520;
  const CARD_HEIGHT = 82;
  const CARDS_TOP = 72;

  function formatDate(iso) {
    const date = new Date(iso);
    return date.getDate() + '.' + (date.getMonth() + 1) + '.' + date.getFullYear();
  }

  function createAchievementsScene(game) {
    const profile = game.profile();
    let elapsed = 0;

    function drawCard(ctx, achievement, index) {
      const x = 90 + (index % 2) * (CARD_WIDTH + 60);
      const y = CARDS_TOP + Math.floor(index / 2) * (CARD_HEIGHT + 14);
      const earnedAt = profile.achievements[achievement.id];
      LM.ui.drawButton(ctx, { x: x, y: y, width: CARD_WIDTH, height: CARD_HEIGHT }, '', earnedAt ? 'normal' : 'disabled');
      LM.draw.drawStar(ctx, x + 40, y + CARD_HEIGHT / 2, 24, 10, earnedAt ? P.gold : '#a8a29a', 2.5);
      LM.text.drawTextLine(ctx, game.say(achievement.title), x + 78, y + 28, { font: LM.text.boldFont(19), color: earnedAt ? P.ink : '#6a645a' });
      const detail = earnedAt ? 'Zdobyte ' + formatDate(earnedAt) : achievement.description;
      LM.text.drawWrappedText(ctx, game.say(detail), x + 78, y + 50, CARD_WIDTH - 96, { font: LM.text.regularFont(15), color: earnedAt ? '#2a6a2a' : '#6a645a', lineHeight: 18 });
    }

    return {
      update: function (dt, input) {
        elapsed += dt;
        if (input.wasPressed('back') || input.wasPressed('confirm') || input.pointer.wasPressed) {
          game.show('map');
        }
      },
      render: function (ctx) {
        LM.mapPainter.drawMapBase(ctx, elapsed);
        LM.ui.drawDimmer(ctx);
        LM.data.achievements.forEach(function (achievement, index) { drawCard(ctx, achievement, index); });
        const earned = Object.keys(profile.achievements).length;
        LM.ui.drawHud(ctx, { title: 'Osiągnięcia', rightText: '★ ' + earned + '/' + LM.data.achievements.length });
        LM.ui.drawKeyHintBar(ctx, [{ keys: ['Esc'], label: 'wróć na mapę' }]);
      },
    };
  }

  LM.sceneFactories.achievements = createAchievementsScene;
}(window.LM = window.LM || {}));

</script>
<script>
// Every attempt of the current player, newest first: date, mission, score and whether it passed.
(function (LM) {
  'use strict';

  const P = LM.palette;
  const ROW_HEIGHT = 40;
  const LIST_TOP = 196;
  const VISIBLE_ROWS = 10;
  const COLUMNS = [{ x: 150, title: 'Data' }, { x: 380, title: 'Wyprawa' }, { x: 860, title: 'Wynik' }, { x: 1010, title: 'Zaliczona' }];

  function pad(number) {
    return String(number).padStart(2, '0');
  }

  function formatDateTime(iso) {
    const date = new Date(iso);
    return pad(date.getDate()) + '.' + pad(date.getMonth() + 1) + '.' + date.getFullYear() + ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes());
  }

  function missionTitle(missionId) {
    if (missionId === LM.data.exam.id) {
      return LM.data.exam.title;
    }
    return LM.missions.byId(missionId).title;
  }

  function createHistoryScene(game) {
    const entries = game.profile().history.slice().reverse();
    let firstRow = 0;
    let elapsed = 0;

    function drawRow(ctx, entry, row) {
      const y = LIST_TOP + row * ROW_HEIGHT;
      const style = { font: LM.text.regularFont(19), color: P.ink };
      LM.text.drawTextLine(ctx, formatDateTime(entry.dateIso), COLUMNS[0].x, y, style);
      LM.text.drawTextLine(ctx, missionTitle(entry.missionId), COLUMNS[1].x, y, style);
      LM.text.drawTextLine(ctx, entry.percent + '%', COLUMNS[2].x, y, style);
      LM.text.drawTextLine(ctx, entry.isPassed ? '✔ tak' : '✘ nie', COLUMNS[3].x, y, { font: LM.text.boldFont(19), color: entry.isPassed ? P.correct : P.wrong });
    }

    function render(ctx) {
      LM.mapPainter.drawMapBase(ctx, elapsed);
      LM.ui.drawDimmer(ctx);
      LM.ui.drawTitledPanel(ctx, { x: 110, y: 90, width: 1060, height: 560 }, 'Historia wyników: ' + game.profile().name);
      COLUMNS.forEach(function (column) {
        LM.text.drawTextLine(ctx, column.title, column.x, 166, { font: LM.text.boldFont(19), color: P.inkSoft });
      });
      if (entries.length === 0) {
        LM.text.drawTextLine(ctx, 'Jeszcze nic tu nie ma. Wypłyń na pierwszą wyprawę!', 640, 300, { font: LM.text.boldFont(22), color: P.ink, align: 'center' });
      }
      entries.slice(firstRow, firstRow + VISIBLE_ROWS).forEach(function (entry, row) { drawRow(ctx, entry, row); });
      LM.ui.drawHud(ctx, { title: 'Historia wyników', rightText: entries.length + ' podejść' });
      LM.ui.drawKeyHintBar(ctx, [{ keys: ['↑', '↓'], label: 'przewijanie' }, { keys: ['Esc'], label: 'wróć na mapę' }]);
    }

    return {
      update: function (dt, input) {
        elapsed += dt;
        const maxFirstRow = Math.max(0, entries.length - VISIBLE_ROWS);
        if (input.wasPressed('down')) {
          firstRow = Math.min(maxFirstRow, firstRow + 1);
        }
        if (input.wasPressed('up')) {
          firstRow = Math.max(0, firstRow - 1);
        }
        if (input.wasPressed('back') || input.wasPressed('confirm')) {
          game.show('map');
        }
      },
      render: render,
    };
  }

  LM.sceneFactories.history = createHistoryScene;
}(window.LM = window.LM || {}));

</script>
<script>
// "Szafa grająca": replay the ballads unlocked by passing missions.
(function (LM) {
  'use strict';

  function createJukeboxScene(game) {
    const profile = game.profile();
    let elapsed = 0;
    const items = LM.data.missions.map(function (mission) {
      const song = LM.data.songs[mission.songId];
      const isUnlocked = profile.unlockedSongs.indexOf(mission.songId) >= 0;
      const label = isUnlocked ? song.title : 'Zalicz misję „' + mission.title + '”';
      return { id: 'song', songId: mission.songId, label: label, isEnabled: isUnlocked };
    });
    items.push({ id: 'back', label: 'Wróć na mapę' });
    const menu = LM.menu.createMenu(items, { x: 340, y: 230, width: 600, itemHeight: 58, gap: 14, fontSize: 22, playSound: game.sfx });

    function update(dt, input) {
      elapsed += dt;
      const chosen = menu.update(input);
      if ((chosen && chosen.id === 'back') || input.wasPressed('back')) {
        game.show('map');
      } else if (chosen) {
        game.show('song', { songId: chosen.songId, onFinished: function () { game.show('jukebox'); } });
      }
    }

    function render(ctx) {
      LM.mapPainter.drawMapBase(ctx, elapsed);
      LM.ui.drawDimmer(ctx);
      LM.ui.drawTitledPanel(ctx, { x: 300, y: 120, width: 680, height: 470 }, 'Szafa grająca');
      LM.text.drawWrappedText(ctx, 'Ballady śpiewa robotyczny aojda. Zaśpiewaj razem z nim!', 640, 196, 600, {
        font: LM.text.regularFont(19), color: LM.palette.inkSoft, lineHeight: 24, align: 'center',
      });
      menu.render(ctx);
      LM.ui.drawHud(ctx, { title: 'Szafa grająca' });
      LM.ui.drawKeyHintBar(ctx, [{ keys: ['↑', '↓'], label: 'wybierz' }, { keys: ['Enter'], label: 'zagraj' }, { keys: ['Esc'], label: 'wróć' }]);
    }

    return { update: update, render: render };
  }

  LM.sceneFactories.jukebox = createJukeboxScene;
}(window.LM = window.LM || {}));

</script>
<script>
// Test hook, active only with ?debug=1: lets automated tests answer questions and skip mini-game action.
(function (LM) {
  'use strict';

  if (!/[?&]debug=1/.test(window.location.search)) {
    return;
  }

  function correctPairs(question) {
    const pairs = {};
    question.pairs.forEach(function (pair) { pairs[pair.left] = pair.right; });
    return pairs;
  }

  function correctResponse(question) {
    const byType = {
      choice: function () { return { optionIndex: question.correctIndex }; },
      truefalse: function () { return { value: question.statementIsTrue }; },
      order: function () { return { items: question.itemsInOrder.slice() }; },
      match: function () { return { pairs: correctPairs(question) }; },
      typed: function () { return { text: question.acceptedAnswers[0] }; },
    };
    return byType[question.type]();
  }

  function wrongResponse(question) {
    const byType = {
      choice: function () { return { optionIndex: (question.correctIndex + 1) % question.options.length }; },
      truefalse: function () { return { value: !question.statementIsTrue }; },
      order: function () { return { items: question.itemsInOrder.slice().reverse() }; },
      match: function () { return { pairs: {} }; },
      typed: function () { return { text: 'qqq' }; },
    };
    return byType[question.type]();
  }

  window.LM_DEBUG = {
    describe: function () {
      const scenes = LM.game.scenes;
      const base = scenes.currentScene();
      const top = scenes.topLayer();
      return {
        scene: base.sceneName,
        stageType: base.stageType || null,
        overlay: top === base ? null : (top.kind || 'other'),
        questionId: top.question ? top.question.id : null,
        isShowingFeedback: Boolean(top.isShowingFeedback && top.isShowingFeedback()),
      };
    },
    answer: function (isCorrect) {
      const overlay = LM.game.scenes.topLayer();
      overlay.answerWith(isCorrect ? correctResponse(overlay.question) : wrongResponse(overlay.question));
    },
    // The number keys that answer the current choice question right and wrong, as the options are shown.
    choiceKeys: function () {
      const overlay = LM.game.scenes.topLayer();
      const correctIndex = overlay.question.correctIndex;
      return {
        correct: 'Digit' + overlay.shownOptionNumber(correctIndex),
        wrong: 'Digit' + overlay.shownOptionNumber((correctIndex + 1) % overlay.question.options.length),
      };
    },
    continueFeedback: function () {
      LM.game.scenes.topLayer().continueAfterFeedback();
    },
    advanceStage: function () {
      LM.game.scenes.currentScene().stage().debugAdvance();
    },
    startStage: function (missionId, stageType, seed) {
      const runner = LM.missionRunner.createMissionRunner(LM.game, missionId, seed || 1);
      LM.game.currentMission = runner;
      LM.game.show('stage', { runner: runner, stageType: stageType });
    },
  };
}(window.LM = window.LM || {}));

</script>
<script>
(function (LM) {
  'use strict';

  function readUrlOptions() {
    const params = new URLSearchParams(window.location.search);
    return {
      isDebug: params.get('debug') === '1',
      startSceneName: params.get('scene'),
      seed: params.get('seed'),
      sceneParams: Object.fromEntries(params.entries()),
    };
  }

  // Reading window.localStorage itself throws in some privacy modes.
  function browserStorage() {
    try {
      return window.localStorage;
    } catch (error) {
      return null;
    }
  }

  function addAudioServices(game) {
    game.audio = LM.audioHub.createAudioHub();
    game.music = LM.music.createMusicPlayer(game.audio);
    game.speech = LM.speech.createSpeech(game.audio);
    game.sfx = function (name) {
      LM.sfx.playSfx(game.audio, name);
    };
    game.playTheme = function (themeId) {
      game.music.play(LM.data.themes[themeId]);
    };
    game.narrate = function (text, speakerId) {
      const settings = game.profile().settings;
      if (settings.isNarrationEnabled && !settings.isMuted) {
        game.speech.speak(text, speakerId);
      }
    };
    game.onFirstGesture = function () {
      game.audio.unlock();
      if (game.audio.isReady()) {
        LM.klattVoice.prepare(game.audio.context());
      }
      game.playTheme('title');
    };
  }

  function addProfileServices(game) {
    game.saveStore = LM.storage.createSaveStore(browserStorage());
    game.save = game.saveStore.load();
    game.persist = function () {
      game.saveStore.save(game.save);
    };
    const guest = LM.profiles.createDetachedProfile(0, 'Gość', 'boy', new Date().toISOString());
    game.profile = function () {
      return LM.profiles.activeProfile(game.save) || guest;
    };
    game.say = function (text) {
      return LM.genderForms.applyGenderForms(text, game.profile().gender);
    };
    game.applySettings = function () {
      const settings = game.profile().settings;
      game.audio.setVolume('music', settings.musicVolume);
      game.audio.setVolume('sfx', settings.sfxVolume);
      game.audio.setVolume('voice', settings.voiceVolume);
      game.audio.setMuted(Boolean(settings.isMuted));
    };
  }

  function createGame() {
    const canvas = document.getElementById('game');
    const view = LM.view.createCanvasView(canvas, window);
    const game = {
      view: view,
      input: LM.input.createInput(view, window),
      textInput: LM.textInput.createTextInputOverlay(view, document.getElementById('answer-input'), window),
      options: readUrlOptions(),
    };
    game.scenes = LM.sceneManager.createSceneManager(game);
    // Leaving a scene silences its narration, which also brings the ducked music back.
    game.show = function (sceneName, params) {
      game.speech.cancel();
      const scene = LM.sceneFactories[sceneName](game, params || {});
      scene.sceneName = sceneName;
      game.scenes.replaceScene(scene);
    };
    // ?seed= replays the same question draw (debugging and tests); otherwise every attempt draws anew.
    game.newSeed = function () {
      return game.options.seed ? Number(game.options.seed) : LM.random.randomSeed();
    };
    game.startMission = function (missionId) {
      game.currentMission = LM.missionRunner.createMissionRunner(game, missionId, game.newSeed());
      game.currentMission.start();
    };
    game.startExam = function () {
      game.show('exam');
    };
    addAudioServices(game);
    addProfileServices(game);
    return game;
  }

  function updateGame(game, dt) {
    game.scenes.update(dt, game.input);
    game.input.endUpdate();
  }

  function renderGame(game) {
    game.view.beginFrame();
    game.scenes.render(game.view.ctx);
  }

  function start() {
    const game = createGame();
    LM.game = game;
    const startSceneName = LM.sceneFactories[game.options.startSceneName] ? game.options.startSceneName : 'title';
    game.show(startSceneName, game.options.sceneParams);
    LM.loop.startGameLoop(
      function (dt) { updateGame(game, dt); },
      function () { renderGame(game); }
    );
  }

  window.addEventListener('load', start);
}(window.LM = window.LM || {}));

</script>
