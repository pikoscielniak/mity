// Runs the Klatt core inside an AudioWorklet. The module is passed as a data: URL, which (unlike blob: URLs)
// also loads when the game is opened straight from disk.
(function (LM) {
  'use strict';

  const PROCESSOR_NAME = 'klatt-singer';
  const modulePromises = new WeakMap();
  const readyContexts = new WeakSet();

  // Runs inside the AudioWorkletGlobalScope (sampleRate, currentTime and registerProcessor are its globals).
  function registerKlattSingerProcessor(createKlattSynth) {
    class KlattSingerProcessor extends AudioWorkletProcessor {
      constructor(options) {
        super();
        this.synth = createKlattSynth(sampleRate, options.processorOptions.events);
        this.endTime = options.processorOptions.endTime;
        this.isStopped = false;
        this.port.onmessage = () => { this.isStopped = true; };
      }

      process(inputs, outputs) {
        this.synth.render(outputs[0][0], currentTime);
        return !this.isStopped && currentTime < this.endTime;
      }
    }
    registerProcessor('klatt-singer', KlattSingerProcessor);
  }

  function workletSource() {
    return '(' + registerKlattSingerProcessor.toString() + ')(' + LM.klattCore.createKlattSynth.toString() + ');';
  }

  // Resolves to true when the singer can run in this context's audio thread.
  function prepare(context) {
    if (!context.audioWorklet) {
      return Promise.resolve(false);
    }
    if (!modulePromises.has(context)) {
      const url = 'data:application/javascript,' + encodeURIComponent(workletSource());
      const loading = context.audioWorklet.addModule(url).then(function () {
        readyContexts.add(context);
        return true;
      }, function () { return false; });
      modulePromises.set(context, loading);
    }
    return modulePromises.get(context);
  }

  function isReady(context) {
    return readyContexts.has(context);
  }

  function startKlattVoice(context, destination, plan) {
    const node = new AudioWorkletNode(context, PROCESSOR_NAME, {
      numberOfInputs: 0,
      outputChannelCount: [1],
      processorOptions: { events: plan.events, endTime: plan.endTime + 0.6 },
    });
    node.connect(destination);
    return {
      stop: function () {
        node.port.postMessage('stop');
        node.disconnect();
      },
    };
  }

  LM.klattVoice = { prepare, isReady, startKlattVoice };
}(window.LM = window.LM || {}));

// The robot singer: a buzzing source through three formant filters (vowels), plus filtered noise (s, sz, f…).
(function (LM) {
  'use strict';

  const FORMANT_Q = [4, 8, 10];
  const FORMANT_LEVELS = [1, 0.7, 0.35];
  const OUTPUT_LEVEL = 1.6;
  const VIBRATO_HZ = 5.2;
  const VIBRATO_CENTS = 18;

  function createFormantBank(context, input, output) {
    return FORMANT_Q.map(function (q, index) {
      const filter = context.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = q;
      filter.frequency.value = [500, 1500, 2500][index];
      const level = context.createGain();
      level.gain.value = FORMANT_LEVELS[index];
      input.connect(filter);
      filter.connect(level);
      level.connect(output);
      return filter;
    });
  }

  function createVibrato(context, source) {
    const lfo = context.createOscillator();
    lfo.frequency.value = VIBRATO_HZ;
    const depth = context.createGain();
    depth.gain.value = VIBRATO_CENTS;
    lfo.connect(depth);
    depth.connect(source.detune);
    return lfo;
  }

  function createNoise(context, output) {
    const source = context.createBufferSource();
    source.buffer = LM.instruments.noiseBuffer(context);
    source.loop = true;
    const filter = context.createBiquadFilter();
    filter.type = 'bandpass';
    const gain = context.createGain();
    gain.gain.value = 0;
    source.connect(filter);
    filter.connect(gain);
    gain.connect(output);
    return { source: source, filter: filter, gain: gain };
  }

  function createFormantVoice(context, destination) {
    const output = context.createGain();
    output.gain.value = OUTPUT_LEVEL;
    output.connect(destination);

    const source = context.createOscillator();
    source.type = 'sawtooth';
    source.frequency.value = 220;
    const softener = context.createBiquadFilter();
    softener.type = 'lowpass';
    softener.frequency.value = 4200;
    const voicing = context.createGain();
    voicing.gain.value = 0;
    source.connect(softener);
    softener.connect(voicing);

    const formants = createFormantBank(context, voicing, output);
    const vibrato = createVibrato(context, source);
    const noise = createNoise(context, output);

    const params = {
      pitch: source.frequency,
      voicing: voicing.gain,
      f1: formants[0].frequency,
      f2: formants[1].frequency,
      f3: formants[2].frequency,
      noiseGain: noise.gain.gain,
      noiseFrequency: noise.filter.frequency,
      noiseQ: noise.filter.Q,
    };

    // Parameters this simpler voice lacks (bandwidths, aspiration) are skipped.
    function apply(events) {
      events.forEach(function (event) {
        const param = params[event.param];
        if (!param) {
          return;

// Plays a ballad: the robot voice and the accompaniment start together; the karaoke follows audio time.
(function (LM) {
  'use strict';

  function accompanimentTheme(song) {
    return { bpm: song.bpm, loop: false, tracks: song.accompaniment };
  }

  // The Klatt worklet sounds far clearer; the plain filter voice is the fallback for browsers without worklets.
  function startVoice(context, destination, plan) {
    if (LM.klattVoice.isReady(context)) {
      return LM.klattVoice.startKlattVoice(context, destination, plan);
    }
    const voice = LM.formantVoice.createFormantVoice(context, destination);
    voice.apply(plan.events);
    voice.start(context.currentTime);
    voice.stop(plan.endTime + 0.6);
    return { stop: function () { voice.stop(context.currentTime + 0.05); } };
  }

  // Schedules everything on any AudioContext (live or offline). Returns the karaoke timeline and end time.
  function scheduleSong(context, voiceDestination, musicDestination, song, startTime) {
    const plan = LM.voiceAutomation.planSong(song, startTime);
    const voice = startVoice(context, voiceDestination, plan);
    const accompanimentEnd = LM.music.scheduleThemeOnce(context, musicDestination, accompanimentTheme(song), startTime);
    return { karaoke: plan.karaoke, endTime: Math.max(plan.endTime, accompanimentEnd), voice: voice };
  }

  function playSong(hub, song) {
    const context = hub.context();
    const startTime = context.currentTime + 0.3;
    const voiceGain = context.createGain();
    voiceGain.connect(hub.bus('voice'));
    const musicGain = context.createGain();
    musicGain.connect(hub.bus('music'));
    const scheduled = scheduleSong(context, voiceGain, musicGain, song, startTime);

    function stop() {
      const now = context.currentTime;
      voiceGain.gain.setTargetAtTime(0, now, 0.05);
      musicGain.gain.setTargetAtTime(0, now, 0.1);
      window.setTimeout(function () {
        scheduled.voice.stop();
        voiceGain.disconnect();
        musicGain.disconnect();
      }, 800);
    }

    return {
      karaoke: scheduled.karaoke,
      startTime: startTime,
      endTime: scheduled.endTime,
      currentTime: function () { return context.currentTime; },
      stop: stop,

  function strophicSong(spec) {

<script>
// Karaoke lyrics: the current line with sung syllables in gold and a ball bouncing over the syllable being sung.
(function (LM) {
  'use strict';

  const P = LM.palette;
  const CURRENT_FONT_SIZE = 40;
  const NEXT_FONT_SIZE = 28;

  function currentLineIndex(karaoke, now) {
    let index = 0;
    karaoke.forEach(function (line, lineIndex) {
      if (line.syllables.length > 0 && line.syllables[0].start - 0.4 <= now) {
        index = lineIndex;
      }
    });
    return index;
  }

  function syllableColor(syllable, now) {
    if (now >= syllable.end) {
      return P.gold;
    }
    if (now >= syllable.start) {
      return P.white;
    }
    return '#b8cdf0';
  }

  function lineText(line) {
    return line.syllables.map(function (syllable) { return syllable.text; }).join('');
  }

  // Returns the x positions of each syllable's left edge, with the line centred on centerX.
  function syllablePositions(ctx, line, centerX, font) {
    const widths = line.syllables.map(function (syllable) { return LM.text.measureTextWidth(ctx, syllable.text, font); });
    const total = widths.reduce(function (sum, width) { return sum + width; }, 0);
    let x = centerX - total / 2;
    return widths.map(function (width) {
      const left = x;
      x += width;
      return { left: left, width: width };
    });
  }

  function activeSyllableIndex(line, now) {
    const index = line.syllables.findIndex(function (syllable) { return now < syllable.end; });
    return index === -1 ? line.syllables.length - 1 : index;
  }

  function drawBall(ctx, position, syllable, baseline, now) {
    const span = Math.max(syllable.end - syllable.start, 0.05);
    const progress = Math.min(Math.max((now - syllable.start) / span, 0), 1);
    const height = Math.sin(progress * Math.PI) * 22;
    LM.draw.drawOutlinedCircle(ctx, position.left + position.width / 2, baseline - 52 - height, 10, P.gold, 2.5);
  }

  function drawCurrentLine(ctx, line, centerX, baseline, now) {
    const font = LM.text.boldFont(CURRENT_FONT_SIZE);
    const positions = syllablePositions(ctx, line, centerX, font);
    line.syllables.forEach(function (syllable, index) {
      LM.text.drawTextLine(ctx, syllable.text, positions[index].left, baseline, {
        font: font, color: syllableColor(syllable, now), align: 'left', shadowColor: P.textShadow,
      });
    });
    const active = activeSyllableIndex(line, now);
    drawBall(ctx, positions[active], line.syllables[active], baseline, now);
  }

  function drawKaraoke(ctx, karaoke, now, centerX, baseline) {
    const index = currentLineIndex(karaoke, now);
    drawCurrentLine(ctx, karaoke[index], centerX, baseline, now);
    const next = karaoke[index + 1];
    if (next) {
      LM.ui.drawShadowText(ctx, lineText(next), centerX, baseline + 62, NEXT_FONT_SIZE, '#9fb6dc', 'center');
    }

    choice: function (question, response) {

    order: function (question, response) {

    match: function (question, response) {

    Object.keys(slotCounts).forEach(function (slot) {

    let questions = LM.random.pickSome(crossPool, EXAM_CROSS_QUESTIONS, rng);
    mythPools.forEach(function (pool) {

// Decides which achievements a player has just earned. Each rule reads the finished attempt and the profile.
(function (LM) {
  'use strict';

  function isFlawless(run) {

  }

  function stat(run, name) {

  function hasAll(list, required) {

  }

  function missionIds() {
    return LM.data.missions.map(function (mission) { return mission.id; });

    return function (facts) { return passed(facts, missionId) && stat(facts.run, statName) === 0; };
  }

  // facts: { run (or null), isPassed, profile }
  const RULES = {
    flawlessMission: function (facts) { return facts.isPassed && facts.run.missionId !== 'exam' && isFlawless(facts.run); },
    noHints: function (facts) { return facts.isPassed && facts.run.hintBudget > 0 && facts.run.hintsUsed === 0; },
    untouchedByMinotaur: passedWithNone('theseus', 'minotaurTouches'),
    escapeWithoutLoss: passedWithNone('theseus', 'escapeHeartsLost'),
    stayedInGoldenMean: passedWithNone('icarus', 'secondsOutsideZone'),
    collectedAllFeathers: function (facts) {
      return passed(facts, 'icarus') && stat(facts.run, 'feathersMissed') === 0 && stat(facts.run, 'feathersCollected') > 0;
    },
    playedEveryNote: passedWithNone('orpheus', 'notesMissed'),
    neverLookedBack: passedWithNone('orpheus', 'lookBacks'),
    heardEveryStory: function (facts) { return hasAll(facts.profile.storiesHeard, missionIds()); },
    heardEveryBallad: function (facts) { return hasAll(facts.profile.balladsHeard, balladIds()); },
    passedExam: function (facts) { return passed(facts, 'exam'); },
    flawlessExam: function (facts) { return passed(facts, 'exam') && isFlawless(facts.run); },

// Drives one attempt at a mission: story → stages → ending → summary → ballad (when passed) → map.

    const run = LM.missionRun.createMissionRun(missionId);
    const questionQueues = LM.questionDraw.drawMissionQuestions(LM.data.questions[missionId], mission.questionSlots, rng);
    let stageIndex = 0;

    function showStage(index) {
      stageIndex = index;
      if (index >= mission.stages.length) {
        showEnding();
        return;
      }
      game.show('stage', { runner: runner, stageType: mission.stages[index] });
    }

    function showStory() {
      game.show('cutscene', {
        title: 'Misja ' + mission.number + ': ' + mission.title,
        pages: myth.storyPages,
        onFinished: function (wasSkipped) {
          if (!wasSkipped) {
            LM.profiles.recordStoryHeard(game.profile(), missionId);
          }
          showStage(0);
        },
      });
    }

    function showEnding() {
      game.show('cutscene', { title: mission.title, pages: myth.endingPages, onFinished: showSummary });
    }

    function showSummary() {
      finishRun(game, run, {
        scoreTitle: 'Wynik misji',
        concepts: myth.concepts,
        backgroundIllustration: myth.endingPages[myth.endingPages.length - 1].illustration,
        choiceWhenPassed: { label: 'Posłuchaj ballady!', onChoose: showBallad },
        retry: function () { game.startMission(missionId); },
      });
    }

    function showBallad() {
      game.show('song', { songId: mission.songId, onFinished: function () { game.show('map'); } });
    }

    const runner = {
      mission: mission,
      myth: myth,
      run: run,
      rng: rng,
      shared: {},
      start: function () {
        game.playTheme(mission.themeId);
        showStory();
      },
      nextQuestion: function (slot) {
        return questionQueues[slot] && questionQueues[slot].length > 0 ? questionQueues[slot].shift() : null;
      },

// A perfect maze (exactly one way between any two places) on a tile grid: rooms on odd coordinates, walls between.
// The entrance is on the left edge, the Minotaur's chamber near the centre; sealed doors sit on the only way there.
(function (LM) {
  'use strict';

  const WALL = 1;
  const FLOOR = 0;
  const STEPS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  function createWallGrid(width, height) {
    return Array.from({ length: height }, function () { return new Array(width).fill(WALL); });
  }

  function tileKey(tile) {
    return tile.x + ',' + tile.y;
  }

  function sameTile(first, second) {
    return first.x === second.x && first.y === second.y;
  }

  // Iterative recursive-backtracker: walk to a random unvisited neighbour room, knocking down the wall between.
  function carveRooms(tiles, cellColumns, cellRows, startCell, rng) {
    const visited = new Set([tileKey(startCell)]);
    const stack = [startCell];
    tiles[startCell.y * 2 + 1][startCell.x * 2 + 1] = FLOOR;
    while (stack.length > 0) {
      const cell = stack[stack.length - 1];
      const options = LM.random.shuffle(STEPS, rng).map(function (step) { return { x: cell.x + step[0], y: cell.y + step[1] }; })
        .filter(function (next) { return next.x >= 0 && next.y >= 0 && next.x < cellColumns && next.y < cellRows && !visited.has(tileKey(next)); });
      if (options.length === 0) {
        stack.pop();
        continue;
      }
      const next = options[0];
      visited.add(tileKey(next));
      tiles[next.y * 2 + 1][next.x * 2 + 1] = FLOOR;
      tiles[cell.y + next.y + 1][cell.x + next.x + 1] = FLOOR;
      stack.push(next);
    }
  }

  function isWalkable(maze, tile) {
    return tile.x >= 0 && tile.y >= 0 && tile.x < maze.width && tile.y < maze.height && maze.tiles[tile.y][tile.x] === FLOOR;
  }

  function neighbours(maze, tile) {
    return STEPS.map(function (step) { return { x: tile.x + step[0], y: tile.y + step[1] }; })
      .filter(function (next) { return isWalkable(maze, next); });
  }

  // Breadth-first search; returns the tiles from start to goal inclusive.
  function findPath(maze, start, goal) {
    const cameFrom = new Map([[tileKey(start), null]]);
    const queue = [start];
    while (queue.length > 0) {
      const tile = queue.shift();
      if (sameTile(tile, goal)) {
        break;
      }
      neighbours(maze, tile).forEach(function (next) {
        const key = tileKey(next);
        if (!cameFrom.has(key)) {
          cameFrom.set(key, tile);
          queue.push(next);
        }

    for (let tile = goal; tile; tile = cameFrom.get(tileKey(tile))) {

  function placeDoors(path, doorCount) {

    for (let door = 1; door <= doorCount; door += 1) {
      let index = Math.round(door * (path.length - 1) / (doorCount + 1));

      }
      doors.push(path[index]);

    const height = cellRows * 2 + 1;
    const entranceRow = Math.floor(cellRows / 2);
    const tiles = createWallGrid(width, height);
    carveRooms(tiles, cellColumns, cellRows, { x: 0, y: entranceRow }, rng);
    const entrance = { x: 0, y: entranceRow * 2 + 1 };
    tiles[entrance.y][entrance.x] = FLOOR;
    const goal = { x: Math.floor(cellColumns / 2) * 2 + 1, y: entranceRow * 2 + 1 };

// Where the roaming Minotaur steps next: wanders the corridors, never through sealed doors, rarely turns back.

    return walker.progress < 1;
  }

  function startStep(walker, target) {
    walker.from = walker.tile;
    walker.tile = target;
    walker.progress = 0;
    walker.facing = Math.atan2(target.y - walker.from.y, target.x - walker.from.x);
  }

  function advance(walker, dt) {
    walker.progress = Math.min(1, walker.progress + dt * walker.speed);
  }

  function placeAt(walker, tile) {
    walker.tile = tile;
    walker.from = tile;
    walker.progress = 1;
  }

  // Position in tile units, between the previous and the current tile while walking.
  function position(walker) {
    return {
      x: walker.from.x + (walker.tile.x - walker.from.x) * walker.progress,
      y: walker.from.y + (walker.tile.y - walker.from.y) * walker.progress,
    };
  }

  function neighbourInDirection(tile, direction) {
    return { x: tile.x + DIRECTIONS[direction].x, y: tile.y + DIRECTIONS[direction].y };
  }

  // The direction of a neighbouring tile.
  function directionTowards(from, to) {
    return Object.keys(DIRECTIONS).find(function (direction) {
      return from.x + DIRECTIONS[direction].x === to.x && from.y + DIRECTIONS[direction].y === to.y;
    });
  }

  // The arrow pressed most recently wins while several are held, which feels natural at corridor corners.
  function createDirectionReader() {
    let latest = null;
    return function readDirection(input) {
      Object.keys(DIRECTIONS).forEach(function (direction) {
        if (input.wasPressed(direction)) {
          latest = direction;
        }
      });
      if (latest && input.isHeld(latest)) {
        return latest;
      }
      return Object.keys(DIRECTIONS).find(function (direction) { return input.isHeld(direction); }) || null;
    };
  }

  LM.tileWalker = { createWalker, isMoving, startStep, advance, placeAt, position, neighbourInDirection, directionTowards, createDirectionReader };
}(window.LM = window.LM || {}));

</script>
<script>
// Drawing the labyrinth from above: sandstone floor, stone walls, sealed doors, Ariadne's thread and torchlight.
(function (LM) {
  'use strict';

  const P = LM.palette;
  const D = LM.draw;
  const TILE = 44;
  const PLAY_TOP = 56;
  const PLAY_HEIGHT = 608;

  function layoutFor(maze) {
    return {
      tile: TILE,
      left: Math.round((1280 - maze.width * TILE) / 2),
      top: PLAY_TOP + Math.round((PLAY_HEIGHT - maze.height * TILE) / 2),
    };
  }

  // position: a tile, or a point between tiles while walking ({ x, y } in tile units).
  function tileCenter(layout, position) {
    return { x: layout.left + position.x * TILE + TILE / 2, y: layout.top + position.y * TILE + TILE / 2 };
  }

  function drawWallTile(ctx, x, y) {
    ctx.fillStyle = '#4a3c30';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#6e5c48';
    ctx.fillRect(x, y, TILE, 8);
    ctx.fillStyle = '#3a2e24';
    ctx.fillRect(x + TILE / 2 - 1, y + 12, 2, TILE - 16);
  }

  function drawMaze(ctx, maze, layout) {
    D.drawBandedGradient(ctx, { x: 0, y: PLAY_TOP, width: 1280, height: PLAY_HEIGHT }, '#2a2018', '#140e0a', 6);
    for (let y = 0; y < maze.height; y += 1) {
      for (let x = 0; x < maze.width; x += 1) {
        const left = layout.left + x * TILE;
        const top = layout.top + y * TILE;
        if (maze.tiles[y][x] === LM.maze.WALL) {
          drawWallTile(ctx, left, top);
        } else {
          ctx.fillStyle = (x + y) % 2 === 0 ? '#c8a878' : '#bf9e6e';
          ctx.fillRect(left, top, TILE, TILE);
        }
      }
    }
  }

  function drawThread(ctx, layout, tiles, extraPoint) {
    const points = tiles.map(function (tile) { return tileCenter(layout, tile); });
    if (extraPoint) {
      points.push(extraPoint);
    }
    if (points.length < 2) {
      return;
    }
    [[10, 'rgba(255, 80, 60, 0.25)'], [4, '#e8282a']].forEach(function (stroke) {
      ctx.beginPath();
      ctx.moveTo(points[0].x - TILE / 2, points[0].y);
      points.forEach(function (point) { ctx.lineTo(point.x, point.y); });
      ctx.lineWidth = stroke[0];
      ctx.strokeStyle = stroke[1];
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();
    });
  }

  function drawSealedDoor(ctx, layout, tile, time) {
    const center = tileCenter(layout, tile);
    D.drawOutlinedRoundRect(ctx, { x: center.x - TILE / 2 + 3, y: center.y - TILE / 2 + 3, width: TILE - 6, height: TILE - 6 }, 5, '#8a5a2a', 2.5);
    const glow = 0.3 + 0.2 * Math.sin(time * 4);
    D.fillCircle(ctx, center.x, center.y, 18, 'rgba(255, 216, 74, ' + glow + ')');
    D.drawOutlinedCircle(ctx, center.x, center.y, 12, P.gold, 2.5);
    LM.text.drawTextLine(ctx, '?', center.x, center.y + 7, { font: LM.text.boldFont(18), color: '#7a3a10', align: 'center' });
  }

  function drawBullEmblem(ctx, layout, tile, time) {
    const center = tileCenter(layout, tile);
    D.fillCircle(ctx, center.x, center.y, 24 + Math.sin(time * 3) * 2, 'rgba(200, 40, 26, 0.35)');
    D.drawOutlinedCircle(ctx, center.x, center.y + 4, 11, '#a82a1a', 2);
    D.drawOutlinedPolygon(ctx, [[center.x - 9, center.y - 2], [center.x - 18, center.y - 16], [center.x - 4, center.y - 8]], '#f2e6c8', 2);
    D.drawOutlinedPolygon(ctx, [[center.x + 9, center.y - 2], [center.x + 18, center.y - 16], [center.x + 4, center.y - 8]], '#f2e6c8', 2);
  }

  function drawHeroFromAbove(ctx, point, facingAngle) {
    ctx.save();
    ctx.translate(point.x, point.y);
    ctx.rotate(facingAngle);
    D.drawOutlinedPolygon(ctx, [[-14, -10], [-14, 10], [-2, 14], [-2, -14]], '#7a1a12', 2);
    D.drawOutlinedEllipse(ctx, 0, 0, 10, 14, '#d8382a', 2);
    D.drawLine(ctx, 6, 10, 20, 12, '#dfe6ee', 4);
    D.drawOutlinedCircle(ctx, 2, 0, 9, P.skin, 2);
    [-4, 0, 4].forEach(function (curlY) { D.drawOutlinedCircle(ctx, -2, curlY, 4, '#6b3e17', 1); });
    ctx.restore();
  }

  function drawMinotaurFromAbove(ctx, point, facingAngle) {
    ctx.save();
    ctx.translate(point.x, point.y);
    ctx.rotate(facingAngle);
    D.drawOutlinedEllipse(ctx, -2, 0, 14, 18, '#6a3a1a', 2.5);
    D.drawOutlinedCircle(ctx, 6, 0, 10, '#8a5a2a', 2);
    D.drawOutlinedPolygon(ctx, [[8, -8], [14, -22], [4, -10]], '#f2e6c8', 2);
    D.drawOutlinedPolygon(ctx, [[8, 8], [14, 22], [4, 10]], '#f2e6c8', 2);
    ctx.restore();
  }

  // Everything outside the torchlight sinks into darkness; radius in pixels.
  function drawDarkness(ctx, light, radius) {
    const gradient = ctx.createRadialGradient(light.x, light.y, radius * 0.35, light.x, light.y, radius);
    gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
    gradient.addColorStop(0.7, 'rgba(8, 6, 12, 0.55)');
    gradient.addColorStop(1, 'rgba(8, 6, 12, 0.94)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, PLAY_TOP, 1280, PLAY_HEIGHT);
  }

  function drawGlowingEyes(ctx, point, time) {
    const pulse = 0.7 + 0.3 * Math.sin(time * 6);
    [-6, 6].forEach(function (offset) {
      D.fillCircle(ctx, point.x + offset, point.y - 4, 6, 'rgba(255, 40, 20, ' + (0.3 * pulse) + ')');
      D.fillCircle(ctx, point.x + offset, point.y - 4, 2.5, '#ff4a2a');
    });
  }

  LM.labyrinthRender = {
    TILE,
    layoutFor,
    tileCenter,
    drawMaze,
    drawThread,
    drawSealedDoor,
    drawBullEmblem,
    drawHeroFromAbove,
    drawMinotaurFromAbove,
    drawDarkness,
    drawGlowingEyes,
  };
}(window.LM = window.LM || {}));

</script>
<script>
// Stage 1 of mission 1: find the way through the dark labyrinth to the Minotaur's chamber.
// Sealed doors open with a right answer; the roaming Minotaur costs a heart when it touches Theseus.
(function (LM) {
  'use strict';

  const W = LM.tileWalker;
  const MAZE_OPTIONS = { cellColumns: 10, cellRows: 6, doorCount: 5, minPathLength: 22 };
  const HERO_SPEED = 5.5;
  const MINOTAUR_SPEED = 1.9;
  const TOUCH_DISTANCE = 0.7;
  const LIGHT_RADIUS = 175;
  const FOOTSTEP_HEARING_TILES = 6;

  function sharedLabyrinth(runner) {
    if (!runner.shared.labyrinth) {
      runner.shared.labyrinth = LM.maze.generateLabyrinth(runner.rng, MAZE_OPTIONS);
    }
    return runner.shared.labyrinth;
  }

  function distance(first, second) {
    return Math.hypot(first.x - second.x, first.y - second.y);
  }

  function createLabyrinthStage(context) {
    const game = context.game;
    const maze = sharedLabyrinth(context.runner);
    const layout = LM.labyrinthRender.layoutFor(maze);
    const sealedDoors = new Set(maze.doors.map(LM.maze.tileKey));
    const closedToMinotaur = new Set(Array.from(sealedDoors).concat([LM.maze.tileKey(maze.entrance)]));
    const hero = W.createWalker(maze.entrance, HERO_SPEED);
    const minotaur = W.createWalker(LM.minotaurBrain.pickDistantRoom(maze, maze.entrance, context.rng), MINOTAUR_SPEED);
    const readDirection = W.createDirectionReader();
    let thread = [maze.entrance];
    let checkpoint = { tile: maze.entrance, thread: thread.slice() };
    let minotaurPrevious = null;
    let elapsed = 0;

    function isSealed(tile) {
      return sealedDoors.has(LM.maze.tileKey(tile));
    }

    function windThread(target) {
      const previous = thread[thread.length - 2];
      if (previous && LM.maze.sameTile(previous, target)) {
        thread.pop();
      } else {
        thread.push(target);
      }
    }

    function openDoor(doorKey) {
      sealedDoors.delete(doorKey);
      closedToMinotaur.delete(doorKey);
      game.sfx('door');
      checkpoint = { tile: hero.tile, thread: thread.slice() };
    }

    function askDoorQuestion(doorKey) {
      const doorNumber = maze.doors.length - sealedDoors.size + 1;
      context.askQuestion('door', { header: 'Pieczęć Minosa ' + doorNumber + '/' + maze.doors.length }, function () { openDoor(doorKey); });
    }

    function reachChamber() {
      context.runner.shared.thread = thread.slice();
      context.completeStage();
    }

    function tryStep(direction) {
      const target = W.neighbourInDirection(hero.tile, direction);
      const targetKey = LM.maze.tileKey(target);
      if (sealedDoors.has(targetKey)) {
        askDoorQuestion(targetKey);
      } else if (LM.maze.isWalkable(maze, target)) {
        W.startStep(hero, target);
        windThread(target);
      }
    }

    function moveMinotaur(dt) {
      W.advance(minotaur, dt);
      if (W.isMoving(minotaur)) {
        return;
      }
      const next = LM.minotaurBrain.chooseNextTile(maze, minotaur.tile, minotaurPrevious, closedToMinotaur, context.rng);
      minotaurPrevious = minotaur.tile;
      W.startStep(minotaur, next);
      if (distance(minotaur.tile, hero.tile) < FOOTSTEP_HEARING_TILES) {
        game.sfx('minotaurStep');
      }
    }

    function sendMinotaurAway() {
      W.placeAt(minotaur, LM.minotaurBrain.pickDistantRoom(maze, hero.tile, context.rng));
      minotaurPrevious = null;
    }

    function checkTouch() {
      if (context.isRecovering() || distance(W.position(hero), W.position(minotaur)) > TOUCH_DISTANCE) {
        return;
      }
      LM.missionRun.addToStat(context.run, 'minotaurTouches', 1);
      context.loseHeart();
      sendMinotaurAway();
    }

    function update(dt, input) {
      elapsed += dt;
      W.advance(hero, dt);
      if (!W.isMoving(hero) && LM.maze.sameTile(hero.tile, maze.goal)) {
        reachChamber();
        return;
      }
      const direction = readDirection(input);
      if (!W.isMoving(hero) && direction) {
        tryStep(direction);
      }
      moveMinotaur(dt);
      checkTouch();
    }

    function render(ctx) {
      const R = LM.labyrinthRender;
      R.drawMaze(ctx, maze, layout);
      R.drawBullEmblem(ctx, layout, maze.goal, elapsed);
      const heroPoint = R.tileCenter(layout, W.position(hero));
      const minotaurPoint = R.tileCenter(layout, W.position(minotaur));
      R.drawMinotaurFromAbove(ctx, minotaurPoint, minotaur.facing);
      if (!context.isBlinking()) {
        R.drawHeroFromAbove(ctx, heroPoint, hero.facing);
      }
      R.drawDarkness(ctx, heroPoint, LIGHT_RADIUS + Math.sin(elapsed * 9) * 4);
      R.drawThread(ctx, layout, thread.slice(0, -1), heroPoint);
      maze.doors.filter(isSealed).forEach(function (door) { R.drawSealedDoor(ctx, layout, door, elapsed); });
      R.drawGlowingEyes(ctx, minotaurPoint, elapsed);
    }

    function restoreCheckpoint() {
      W.placeAt(hero, checkpoint.tile);
      thread = checkpoint.thread.slice();
      sendMinotaurAway();
    }

    // Developer shortcut: walk straight to the next sealed door (or the chamber).
    function debugAdvance() {
      const nextDoorIndex = maze.path.findIndex(isSealed);
      if (nextDoorIndex < 0) {
        thread = maze.path.slice();
        W.placeAt(hero, maze.goal);
        return;
      }
      W.placeAt(hero, maze.path[nextDoorIndex - 1]);
      thread = maze.path.slice(0, nextDoorIndex);
      tryStep(LM.tileWalker.directionTowards(hero.tile, maze.path[nextDoorIndex]));
    }

    return {
      update: update,
      render: render,
      hud: function () {
        return { title: 'Labirynt Minotaura', rightText: 'Pieczęcie: ' + (maze.doors.length - sealedDoors.size) + '/' + maze.doors.length };
      },
      keyHints: function () { return [{ keys: ['←', '↑', '↓', '→'], label: 'idź (nić rozwija się za tobą)' }]; },
      restoreCheckpoint: restoreCheckpoint,
      debugAdvance: debugAdvance,
      heroTile: function () { return hero.tile; },
    };
  }

  LM.stageFactories.labyrinth = createLabyrinthStage;
}(window.LM = window.LM || {}));

</script>
<script>
// Stage 2 of mission 1: the duel in the heart of the labyrinth. Each round the Minotaur charges (dodge with the
// shown arrow), then a question: a right answer is a strike, a wrong one is blocked. After the last round Theseus wins.
(function (LM) {
  'use strict';

  const P = LM.palette;
  const MAX_ROUNDS = 5;
  const INTRO_SECONDS = 2.2;
  const DODGE_WINDOW_SECONDS = 1.8;
  const ANIMATION_SECONDS = 0.9;
  const FINALE_SECONDS = 2.6;

  function createDuelStage(context) {
    const game = context.game;
    const rounds = Math.min(MAX_ROUNDS, context.remainingQuestions('duel'));
    let round = 1;
    let minotaurHealth = rounds;
    let phase = 'intro';
    let phaseTime = 0;
    let dodgeDirection = 'left';
    let heroOffset = 0;
    let message = 'W samym środku labiryntu czeka Minotaur!';
    let elapsed = 0;

    function enterPhase(nextPhase, nextMessage) {
      phase = nextPhase;
      phaseTime = 0;
      message = nextMessage;
    }

    function startCharge() {
      dodgeDirection = context.rng() < 0.5 ? 'left' : 'right';
      heroOffset = 0;
      enterPhase('charge', 'Minotaur szarżuje! Uskocz w bok!');
    }

    function onAnswered(isCorrect) {
      if (isCorrect) {
        minotaurHealth -= 1;
        game.sfx('strike');
        enterPhase('strike', 'Celny cios!');
      } else {
        enterPhase('block', 'Minotaur odparł cios…');
      }
    }

    function askRoundQuestion() {
      enterPhase('question', '');
      context.askQuestion('duel', { header: 'Pojedynek z Minotaurem · runda ' + round + '/' + rounds, attemptPolicy: 'singleAttempt' }, onAnswered);
    }

    function dodge() {
      heroOffset = dodgeDirection === 'left' ? -150 : 150;
      game.sfx('choose');
      enterPhase('afterCharge', 'Unik!');
    }

    function takeChargeHit() {
      context.loseHeart();
      enterPhase('afterCharge', 'Ała! Minotaur cię trącił.');
    }

    function updateCharge(input) {
      const pressedSide = ['left', 'right'].find(function (side) { return input.wasPressed(side); });
      if (pressedSide === dodgeDirection) {
        dodge();
      } else if (pressedSide || phaseTime > DODGE_WINDOW_SECONDS) {
        takeChargeHit();
      }
    }

    function nextRound() {
      if (round >= rounds) {
        game.sfx('strike');
        enterPhase('finale', 'Tezeusz pokonał Minotaura!');
        return;
      }
      round += 1;
      startCharge();
    }

    function update(dt, input) {
      elapsed += dt;
      phaseTime += dt;
      if (phase === 'intro' && phaseTime > INTRO_SECONDS) {
        startCharge();
      } else if (phase === 'charge') {
        updateCharge(input);
      } else if (phase === 'afterCharge' && phaseTime > ANIMATION_SECONDS) {
        askRoundQuestion();
      } else if ((phase === 'strike' || phase === 'block') && phaseTime > ANIMATION_SECONDS) {
        nextRound();
      } else if (phase === 'finale' && phaseTime > FINALE_SECONDS) {
        context.completeStage();
      }
      heroOffset *= Math.pow(0.08, dt);
    }

    function minotaurPose() {
      if (phase === 'finale') {
        return { x: 900, y: 520, scale: 1.6, armRaise: 0, isAngry: false };
      }
      const lunge = phase === 'charge' ? Math.min(1, phaseTime / DODGE_WINDOW_SECONDS) * 220 : 0;
      const flinch = phase === 'strike' ? Math.sin(phaseTime * 30) * 8 : 0;
      return { x: 880 - lunge + flinch, y: 490, scale: 1.8, armRaise: phase === 'charge' ? 1 : 0.4, isAngry: true };
    }

    function drawHealthBar(ctx) {
      LM.ui.drawShadowText(ctx, 'Minotaur', 880, 92, 20, P.white, 'center');
      for (let segment = 0; segment < rounds; segment += 1) {
        const color = segment < minotaurHealth ? '#c8281a' : '#3a2a2a';
        LM.draw.drawOutlinedRoundRect(ctx, { x: 760 + segment * 50, y: 102, width: 42, height: 16 }, 4, color, 2);
      }
    }

    function drawDodgePrompt(ctx) {
      const pulse = 1 + 0.08 * Math.sin(elapsed * 14);
      LM.draw.withTransform(ctx, 640, 360, pulse, function () {
        LM.draw.drawOutlinedRoundRect(ctx, { x: -70, y: -60, width: 140, height: 120 }, 18, P.keyCap, 4);
        LM.text.drawTextLine(ctx, dodgeDirection === 'left' ? '←' : '→', 0, 30, { font: LM.text.boldFont(84), color: P.keyCapText, align: 'center' });
      });
      const timeLeft = Math.max(0, 1 - phaseTime / DODGE_WINDOW_SECONDS);
      LM.draw.drawOutlinedRoundRect(ctx, { x: 540, y: 440, width: 200 * timeLeft + 2, height: 12 }, 4, P.gold, 2);
    }

    function render(ctx) {
      LM.backdrops.drawLabyrinthHall(ctx, elapsed);
      const pose = minotaurPose();
      LM.creatures.drawMinotaur(ctx, pose.x, pose.y, pose.scale, pose.armRaise, pose.isAngry);
      const heroLook = LM.characters.looks.theseus;
      const heroPose = phase === 'strike' || phase === 'finale' ? 'point' : 'stand';
      LM.characters.drawPerson(ctx, 400 + heroOffset + (phase === 'strike' ? 120 : 0), 500, 2.2, heroLook, heroPose);
      drawHealthBar(ctx);
      if (message) {
        LM.ui.drawParchmentPanel(ctx, { x: 290, y: 566, width: 700, height: 70 });
        LM.text.drawTextLine(ctx, message, 640, 611, { font: LM.text.boldFont(28), color: phase === 'finale' ? '#a8500a' : P.ink, align: 'center' });
      }
      if (phase === 'charge') {
        drawDodgePrompt(ctx);
      }
    }

    function restoreCheckpoint() {
      startCharge();
    }

    function debugAdvance() {
      if (phase === 'charge') {
        dodge();
      } else if (phase === 'intro') {
        startCharge();
      } else if (phase === 'finale') {
        context.completeStage();
      }
    }

    return {
      update: update,
      render: render,
      hud: function () { return { title: 'Pojedynek z Minotaurem', rightText: 'Runda ' + round + '/' + rounds }; },
      keyHints: function () { return [{ keys: ['←', '→'], label: 'unik, gdy Minotaur szarżuje' }]; },
      restoreCheckpoint: restoreCheckpoint,
      debugAdvance: debugAdvance,
    };
  }

  LM.stageFactories.duel = createDuelStage;
}(window.LM = window.LM || {}));

</script>
<script>
// Stage 3 of mission 1: back to the entrance along Ariadne's thread before the torch burns out.
// The time is generous; a burnt-out torch costs a heart and is lit again.
(function (LM) {
  'use strict';

  const W = LM.tileWalker;
  const HERO_SPEED = 5.5;
  const SECONDS_PER_TILE_ALLOWED = 0.55;
  const EXTRA_SECONDS = 14;
  const RELIGHT_SHARE = 0.6;
  const MAX_LIGHT = 190;
  const MIN_LIGHT = 95;

  function createEscapeStage(context) {
    const game = context.game;
    const maze = context.runner.shared.labyrinth;
    const thread = context.runner.shared.thread || maze.path;
    const layout = LM.labyrinthRender.layoutFor(maze);
    const hero = W.createWalker(maze.goal, HERO_SPEED);
    const readDirection = W.createDirectionReader();
    const torchSeconds = thread.length * SECONDS_PER_TILE_ALLOWED + EXTRA_SECONDS;
    let torchLeft = torchSeconds;
    let elapsed = 0;

    function burnTorch(dt) {
      torchLeft -= dt;
      if (torchLeft > 0) {
        return;
      }
      LM.missionRun.addToStat(context.run, 'escapeHeartsLost', 1);
      context.loseHeart();
      torchLeft = torchSeconds * RELIGHT_SHARE;
    }

    function update(dt, input) {
      elapsed += dt;
      W.advance(hero, dt);
      if (!W.isMoving(hero) && LM.maze.sameTile(hero.tile, maze.entrance)) {
        game.sfx('door');
        context.completeStage();
        return;
      }
      const direction = readDirection(input);
      if (!W.isMoving(hero) && direction) {
        const target = W.neighbourInDirection(hero.tile, direction);
        if (LM.maze.isWalkable(maze, target)) {
          W.startStep(hero, target);
        }
      }
      burnTorch(dt);
    }

    function torchShare() {
      return Math.max(0, torchLeft / torchSeconds);
    }

    function lightRadius() {
      return MIN_LIGHT + (MAX_LIGHT - MIN_LIGHT) * torchShare();
    }

    function drawTorchMeter(ctx) {
      LM.ui.drawMeter(ctx, { x: 980, y: 70, width: 260, height: 22 }, torchShare(), '#ff9a2a');
      LM.ui.drawShadowText(ctx, 'Pochodnia', 970, 88, 18, LM.palette.white, 'right');
    }

    function render(ctx) {
      const R = LM.labyrinthRender;
      R.drawMaze(ctx, maze, layout);
      const heroPoint = R.tileCenter(layout, W.position(hero));
      R.drawHeroFromAbove(ctx, heroPoint, hero.facing);
      R.drawDarkness(ctx, heroPoint, lightRadius() + Math.sin(elapsed * 9) * 4);
      R.drawThread(ctx, layout, thread, null);
      drawTorchMeter(ctx);
    }

    function restoreCheckpoint() {
      W.placeAt(hero, maze.goal);
      torchLeft = torchSeconds;
    }

    function debugAdvance() {

    return {
      update: update,
      render: render,
      hud: function () { return { title: 'Ucieczka po nici Ariadny', rightText: '' }; },
      keyHints: function () { return [{ keys: ['←', '↑', '↓', '→'], label: 'idź po nici do wyjścia' }]; },
      restoreCheckpoint: restoreCheckpoint,
      debugAdvance: debugAdvance,

  }

</script>
<script>
// Stage 4 of mission 1: sailing home from Crete past Naxos to Athens under the black sail.
// ↑/↓ steer around rocks; at each island the voyage pauses for a question.
(function (LM) {
  'use strict';

  const D = LM.draw;
  const SEA_TOP = 400;
  const LANE_TOP = 450;
  const LANE_BOTTOM = 612;
  const SHIP_X = 280;
  const PROGRESS_PER_SECOND = 3.4;
  const STEER_SPEED = 260;
  const ROCK_SPEED = 250;
  const LANE_MIDDLE = (LANE_TOP + LANE_BOTTOM) / 2;
  const STOPS = [
    { at: 50, name: 'Naksos', header: 'Postój na wyspie Naksos', hasTemple: false },
    { at: 100, name: 'Ateny', header: 'Na horyzoncie Ateny', hasTemple: true },
  ];

  function createShipStage(context) {
    const game = context.game;
    let progress = 0;
    let shipY = LANE_MIDDLE;
    let rocks = [];
    let nextRockIn = 1.5;
    let stopIndex = 0;
    let phase = 'sailing';
    let checkpointProgress = 0;
    let elapsed = 0;

    function spawnRock() {
      rocks.push({ x: 1340, y: LANE_TOP + context.rng() * (LANE_BOTTOM - LANE_TOP), size: 26 + context.rng() * 14 });
      nextRockIn = 1.4 + context.rng() * 1.2;
    }

    function arriveAtStop() {
      const stop = STOPS[stopIndex];
      phase = 'docked';
      rocks = [];
      context.askQuestion('ship', { header: stop.header }, function () {
        checkpointProgress = stop.at;
        stopIndex += 1;
        phase = stopIndex < STOPS.length ? 'sailing' : 'home';
      });
    }

    function moveRocks(dt) {
      rocks.forEach(function (rock) { rock.x -= ROCK_SPEED * dt; });
      rocks = rocks.filter(function (rock) { return rock.x > -80; });
      const hit = rocks.find(function (rock) { return Math.abs(rock.x - SHIP_X) < 70 && Math.abs(rock.y - shipY) < rock.size + 12; });
      if (hit && !context.isRecovering()) {
        rocks = rocks.filter(function (rock) { return rock !== hit; });
        game.sfx('splash');
        context.loseHeart();
      }
    }

    function sail(dt, input) {
      progress = Math.min(STOPS[stopIndex].at, progress + PROGRESS_PER_SECOND * dt);
      const steer = input.heldStep('up', 'down');
      shipY = Math.min(LANE_BOTTOM, Math.max(LANE_TOP, shipY + steer * STEER_SPEED * dt));
      nextRockIn -= dt;
      if (nextRockIn <= 0 && STOPS[stopIndex].at - progress > 6) {
        spawnRock();
      }
      moveRocks(dt);
      if (progress >= STOPS[stopIndex].at) {
        arriveAtStop();
      }
    }

    function update(dt, input) {
      elapsed += dt;
      if (phase === 'sailing') {
        sail(dt, input);
      } else if (phase === 'home') {
        context.completeStage();
      }
    }

    function drawRock(ctx, rock) {
      const s = rock.size;
      D.drawOutlinedPolygon(ctx, [[rock.x - s, rock.y + 10], [rock.x - s * 0.6, rock.y - s * 0.8], [rock.x + s * 0.2, rock.y - s], [rock.x + s, rock.y + 10]], '#7a7a86', 3);
      D.fillCircle(ctx, rock.x - s * 0.2, rock.y - s * 0.5, s * 0.2, '#9a9aa6');
      ctx.fillStyle = LM.palette.foam;
      ctx.fillRect(rock.x - s - 6, rock.y + 8, s * 2 + 12, 4);
    }

    function drawStopIsland(ctx, stop) {
      const x = 760 + (stop.at - progress) * 34;
      if (x > 1500) {
        return;
      }
      LM.scenery.drawIsland(ctx, x, SEA_TOP + 4, 380, 120);
      if (stop.hasTemple) {
        LM.scenery.drawTemple(ctx, x - 10, SEA_TOP - 104, 0.8);
      }
      LM.ui.drawShadowText(ctx, stop.name, x, SEA_TOP - 140, 26, LM.palette.white, 'center');
    }

    function drawRouteBar(ctx) {
      const left = 340;
      const width = 600;
      D.drawOutlinedRoundRect(ctx, { x: left, y: 76, width: width, height: 10 }, 5, '#e8dcc0', 2);
      [{ at: 0, name: 'Kreta' }].concat(STOPS).forEach(function (stop) {
        D.drawOutlinedCircle(ctx, left + width * stop.at / 100, 81, 9, '#c8642c', 2);
        LM.ui.drawShadowText(ctx, stop.name, left + width * stop.at / 100, 116, 17, LM.palette.white, 'center');
      });
      D.drawOutlinedCircle(ctx, left + width * progress / 100, 81, 7, LM.palette.gold, 2);
    }

    function render(ctx) {
      LM.scenery.drawSky(ctx, { x: 0, y: 56, width: 1280, height: SEA_TOP - 56 }, '#3a7fe0', '#d8f0ff');
      LM.scenery.drawSun(ctx, 1080, 150, 44, elapsed);
      LM.scenery.drawCloud(ctx, 1280 - ((elapsed * 30) % 1500), 170, 0.8);
      STOPS.forEach(function (stop) { drawStopIsland(ctx, stop); });
      LM.scenery.drawSea(ctx, { x: 0, y: SEA_TOP, width: 1280, height: 720 - SEA_TOP }, elapsed * 3);
      rocks.forEach(function (rock) { drawRock(ctx, rock); });
      if (!context.isBlinking()) {
        LM.scenery.drawShip(ctx, SHIP_X, shipY + 20, 0.85, '#1a1a1a', elapsed);
      }
      drawRouteBar(ctx);
    }

    function restoreCheckpoint() {
      progress = checkpointProgress;
      rocks = [];
      shipY = LANE_MIDDLE;
    }

    function debugAdvance() {
      if (phase === 'sailing') {
        progress = STOPS[stopIndex].at;
        arriveAtStop();
      }
    }

    return {
      update: update,
      render: render,
      hud: function () { return { title: 'Powrót do Aten', rightText: '' }; },
      keyHints: function () { return [{ keys: ['↑', '↓'], label: 'steruj, omijaj skały' }]; },
      restoreCheckpoint: restoreCheckpoint,
      debugAdvance: debugAdvance,
    };
  }

  LM.stageFactories.ship = createShipStage;
}(window.LM = window.LM || {}));

</script>
<script>
// Flight physics for the Icarus mission: altitude, the golden-mean zone, melting wax and soaking feathers.
// Pure numbers (y in screen pixels, bigger = lower), so it is unit-tested with a simple autopilot.
(function (LM) {
  'use strict';

  const SKY_TOP = 90;
  const HOT_LIMIT = 210;
  const WET_LIMIT = 500;
  const SEA_LEVEL = 600;
  const SAFE_MIDDLE_Y = (HOT_LIMIT + WET_LIMIT) / 2;
  const CLIMB_SPEED = 230;
  const RESPONSIVENESS = 6;
  const SECONDS_TO_MELT = 2.6;
  const SECONDS_TO_SOAK = 2.6;
  const RECOVERY_RATE = 0.5;

  function createFlyer(y) {
    return { y: y, velocity: 0, wax: 0, wetness: 0 };
  }

  function altitudeZone(y) {
    if (y < HOT_LIMIT) {
      return 'tooHigh';
    }
    return y > WET_LIMIT ? 'tooLow' : 'safe';
  }

  // steer: -1 (up) … 1 (down); the flyer eases towards the wanted speed.
  function steerFlyer(flyer, steer, dt) {
    const wanted = steer * CLIMB_SPEED;
    flyer.velocity += (wanted - flyer.velocity) * Math.min(1, RESPONSIVENESS * dt);
    flyer.y = Math.min(SEA_LEVEL - 20, Math.max(SKY_TOP, flyer.y + flyer.velocity * dt));
  }

  // Returns 'waxMelted', 'feathersSoaked' or null. A danger meter fills in its zone and slowly drains outside it.
  function updateDangers(flyer, dt) {
    const zone = altitudeZone(flyer.y);
    flyer.wax = zone === 'tooHigh' ? flyer.wax + dt / SECONDS_TO_MELT : Math.max(0, flyer.wax - dt * RECOVERY_RATE);
    flyer.wetness = zone === 'tooLow' ? flyer.wetness + dt / SECONDS_TO_SOAK : Math.max(0, flyer.wetness - dt * RECOVERY_RATE);
    if (flyer.wax >= 1) {
      flyer.wax = 0;
      flyer.y = SAFE_MIDDLE_Y;
      return 'waxMelted';
    }
    if (flyer.wetness >= 1) {
      flyer.wetness = 0;
      flyer.y = SAFE_MIDDLE_Y;
      return 'feathersSoaked';
    }
    return null;
  }

  LM.flightModel = { SKY_TOP, HOT_LIMIT, WET_LIMIT, SEA_LEVEL, SAFE_MIDDLE_Y, createFlyer, altitudeZone, steerFlyer, updateDangers };
}(window.LM = window.LM || {}));

</script>
<script>
// Drawing the flight: sky split into the three zones of Daedalus's advice, the altimeter and the danger meters.
(function (LM) {
  'use strict';

  const P = LM.palette;
  const D = LM.draw;
  const F = LM.flightModel;
  const ZONE_LABEL_X = 1250;

  function drawZoneBand(ctx, top, bottom, color, label) {
    ctx.fillStyle = color;
    ctx.fillRect(0, top, 1280, bottom - top);
    LM.ui.drawShadowText(ctx, label, ZONE_LABEL_X, top + (bottom - top) / 2 + 7, 18, P.white, 'right');
  }

  function drawZoneEdge(ctx, y) {
    ctx.save();
    ctx.setLineDash([10, 14]);
    D.drawLine(ctx, 60, y, 1280, y, 'rgba(255, 255, 255, 0.55)', 3);
    ctx.restore();
  }

  // sky: 'day' or 'dusk' (the last part, Daedalus alone).
  function drawFlightSky(ctx, time, sky) {
    const colors = sky === 'dusk' ? ['#5a5aa8', '#f6b47a'] : ['#2b6cd4', '#d8f0ff'];
    LM.scenery.drawSky(ctx, { x: 0, y: 56, width: 1280, height: F.SEA_LEVEL - 56 }, colors[0], colors[1]);
    LM.scenery.drawSun(ctx, 1120, 120, 60, time);
    LM.scenery.drawCloud(ctx, 1400 - ((time * 40) % 1700), 330, 0.9);
    LM.scenery.drawCloud(ctx, 1400 - ((time * 26 + 800) % 1700), 250, 0.6);
  }

  function drawZones(ctx) {
    drawZoneBand(ctx, 56, F.HOT_LIMIT, 'rgba(255, 110, 30, 0.2)', 'za wysoko: słońce topi wosk');
    drawZoneBand(ctx, F.WET_LIMIT, F.SEA_LEVEL, 'rgba(30, 90, 220, 0.2)', 'za nisko: fale moczą pióra');
    drawZoneEdge(ctx, F.HOT_LIMIT);
    drawZoneEdge(ctx, F.WET_LIMIT);
  }

  function drawSeaBelow(ctx, time) {
    LM.scenery.drawSea(ctx, { x: 0, y: F.SEA_LEVEL, width: 1280, height: 664 - F.SEA_LEVEL }, time * 6);
  }

  function drawAltimeter(ctx, flyerY) {
    const left = 22;
    D.drawOutlinedRoundRect(ctx, { x: left - 4, y: 70, width: 34, height: F.SEA_LEVEL - 66 }, 10, '#1b1b2a', 2);
    D.drawBandedGradient(ctx, { x: left + 2, y: 76, width: 22, height: F.HOT_LIMIT - 76 }, '#ff4a2a', '#ff9a2a', 4);
    D.drawBandedGradient(ctx, { x: left + 2, y: F.HOT_LIMIT, width: 22, height: F.WET_LIMIT - F.HOT_LIMIT }, '#43d052', '#2a9a3a', 5);
    D.drawBandedGradient(ctx, { x: left + 2, y: F.WET_LIMIT, width: 22, height: F.SEA_LEVEL - F.WET_LIMIT - 6 }, '#3a8ae8', '#1a4aa8', 4);
    D.drawOutlinedPolygon(ctx, [[left + 34, flyerY], [left + 50, flyerY - 10], [left + 50, flyerY + 10]], P.white, 2);
  }

  // A small bar above the flyer that fills while it is in danger.
  function drawDangerMeter(ctx, x, y, fill, color, label) {
    if (fill <= 0.02) {
      return;
    }
    LM.ui.drawMeter(ctx, { x: x - 50, y: y, width: 100, height: 14 }, fill, color);
    LM.ui.drawShadowText(ctx, label, x, y - 6, 16, P.white, 'center');
  }

  function drawIslandOnHorizon(ctx, island) {
    LM.scenery.drawIsland(ctx, island.x, F.SEA_LEVEL + 4, island.width, island.height);
    if (island.hasTemple) {
      LM.scenery.drawTemple(ctx, island.x, F.SEA_LEVEL - island.height + 16, 0.6);
    }
    LM.ui.drawShadowText(ctx, island.name, island.x, F.SEA_LEVEL - island.height - 18, 24, P.white, 'center');
  }

  LM.flightRender = { drawFlightSky, drawZones, drawSeaBelow, drawAltimeter, drawDangerMeter, drawIslandOnHorizon };
}(window.LM = window.LM || {}));

</script>
<script>
// Stage 2 of mission 2: the flight from Crete. The player keeps Icarus in the middle of the sky (the father's
// advice), dodges gulls, gathers feathers and catches question scrolls. Then, as in the myth, Icarus climbs too
// high and falls; the player flies on as Daedalus to Sicily.
(function (LM) {
  'use strict';

  const F = LM.flightModel;
  const R = LM.flightRender;
  const FLYER_X = 330;
  const TOUCH_DISTANCE = 52;
  const SCROLL_INTERVAL = 7;
  const SCRIPTED_SECONDS = { climb: 4, fall: 3.2, arrive: 2.6 };
  const ICARUS_ISLANDS = [
    { afterScroll: 2, name: 'Samos', width: 300, height: 90 },
    { afterScroll: 4, name: 'Paros', width: 260, height: 80 },
    { afterScroll: 6, name: 'Delos', width: 220, height: 70 },
  ];
  const DAEDALUS_ISLANDS = [
    { afterScroll: 0, name: 'Ikaria', width: 280, height: 90 },
    { afterScroll: 2, name: 'Sycylia', width: 520, height: 150, hasTemple: true },
  ];
  const BANNERS = {
    climb: 'W micie Ikar, zachwycony lotem, zapomniał o radzie ojca i wzbijał się coraz wyżej…',
    fall: '…słońce stopiło wosk, pióra odpadły i Ikar spadł. Dedal leci dalej sam.',
    daedalus: 'Teraz prowadzisz Dedala na Sycylię. Trzymaj się środka nieba!',
  };

  function distance(firstX, firstY, secondX, secondY) {
    return Math.hypot(firstX - secondX, firstY - secondY);
  }

  function createFlightStage(context) {
    const game = context.game;
    const rng = context.rng;
    const flyer = F.createFlyer(F.SAFE_MIDDLE_Y);
    const legs = {
      icarus: { slot: 'flight', look: LM.characters.looks.icarus, islands: ICARUS_ISLANDS, total: Math.min(6, context.remainingQuestions('flight')) },
      daedalus: { slot: 'ending', look: LM.characters.looks.daedalus, islands: DAEDALUS_ISLANDS, total: Math.min(2, context.remainingQuestions('ending')) },
    };
    let phase = 'icarus';
    let phaseSeconds = 0;
    let scrollsCaught = 0;
    let gulls = [];
    let feathers = [];
    let islands = [];
    let scroll = null;
    let sinceScroll = 0;
    let nextGullIn = 3;
    let nextFeatherIn = 1.5;
    let warning = null;
    let elapsed = 0;

    function leg() {
      return legs[phase];
    }

    function isPlayerFlying() {
      return phase === 'icarus' || phase === 'daedalus';
    }

    function enterPhase(nextPhase) {
      phase = nextPhase;
      phaseSeconds = 0;
      if (isPlayerFlying()) {
        scrollsCaught = 0;
        sinceScroll = SCROLL_INTERVAL - 2;
        islands = [];
        flyer.y = F.SAFE_MIDDLE_Y;
        showIslandsAfter(0);
      }
    }

    function showIslandsAfter(scrollCount) {
      leg().islands.filter(function (island) { return island.afterScroll === scrollCount; }).forEach(function (island) {
        islands.push(Object.assign({ x: 1500 }, island));
      });
    }

    function hurt(message) {
      if (context.isRecovering()) {
        return;
      }
      warning = { text: message, seconds: 2 };
      context.loseHeart();
    }

    function spawnTraffic(dt) {
      nextGullIn -= dt;
      nextFeatherIn -= dt;
      if (nextGullIn <= 0) {
        gulls.push({ x: 1340, y: 160 + rng() * 380, speed: 190 + rng() * 70 });
        nextGullIn = 3.2 + rng() * 2;
      }
      if (nextFeatherIn <= 0 && phase === 'icarus') {
        feathers.push({ x: 1340, y: F.HOT_LIMIT + 30 + rng() * (F.WET_LIMIT - F.HOT_LIMIT - 60), isMissed: false });
        nextFeatherIn = 2.2 + rng();
      }
    }

    function moveTraffic(dt) {
      gulls.forEach(function (gull) { gull.x -= gull.speed * dt; });
      feathers.forEach(function (feather) { feather.x -= 170 * dt; });
      islands.forEach(function (island) { island.x -= 70 * dt; });
      gulls = gulls.filter(function (gull) { return gull.x > -60; });
      feathers = feathers.filter(function (feather) { return feather.x > -40; });
    }

    // A feather counts as missed once it has flown past the flyer; feathers still on their way when a leg ends do not.
    function recordMissedFeathers() {
      feathers.forEach(function (feather) {
        if (!feather.isMissed && feather.x < FLYER_X - TOUCH_DISTANCE) {
          feather.isMissed = true;
          LM.missionRun.addToStat(context.run, 'feathersMissed', 1);
        }
      });
    }

    function checkTouches() {
      const hitGull = gulls.find(function (gull) { return distance(gull.x, gull.y, FLYER_X, flyer.y) < TOUCH_DISTANCE; });
      if (hitGull) {
        gulls = gulls.filter(function (gull) { return gull !== hitGull; });
        hurt('Uwaga na mewy!');
      }
      const caught = feathers.filter(function (feather) { return distance(feather.x, feather.y, FLYER_X, flyer.y) < TOUCH_DISTANCE; });
      if (caught.length > 0) {
        feathers = feathers.filter(function (feather) { return caught.indexOf(feather) < 0; });
        LM.missionRun.addToStat(context.run, 'feathersCollected', caught.length);
        game.sfx('pickup');
      }
    }

    function catchScroll() {
      scroll = null;
      sinceScroll = 0;
      game.sfx('page');
      context.askQuestion(leg().slot, { header: 'Zwój ' + (scrollsCaught + 1) + '/' + leg().total }, function () {
        scrollsCaught += 1;
        showIslandsAfter(scrollsCaught);
      });
    }

    // Scrolls drift towards the flyer, so catching one never needs precise flying.
    function updateScroll(dt) {
      sinceScroll += dt;
      if (!scroll && scrollsCaught < leg().total && sinceScroll >= SCROLL_INTERVAL) {
        scroll = { x: 1340, y: F.SAFE_MIDDLE_Y };
      }
      if (!scroll) {
        return;
      }
      scroll.x -= 150 * dt;
      if (scroll.x < 900) {
        scroll.y += (flyer.y - scroll.y) * Math.min(1, 2.5 * dt);
      }
      if (distance(scroll.x, scroll.y, FLYER_X, flyer.y) < TOUCH_DISTANCE + 10) {
        catchScroll();
      }
    }

    function finishLegIfDone() {
      const isDone = scrollsCaught >= leg().total && !scroll && sinceScroll > 4;
      if (isDone) {
        gulls = [];
        feathers = [];
        enterPhase(phase === 'icarus' ? 'climb' : 'arrive');
      }
    }

    function fly(dt, input) {
      const steer = input.heldStep('up', 'down');
      F.steerFlyer(flyer, steer, dt);
      const danger = F.updateDangers(flyer, dt);
      if (danger === 'waxMelted') {
        hurt('Za blisko słońca! Wosk się topi.');
      } else if (danger === 'feathersSoaked') {
        hurt('Za nisko! Pióra nasiąkły wodą.');
      }
      if (F.altitudeZone(flyer.y) !== 'safe') {
        LM.missionRun.addToStat(context.run, 'secondsOutsideZone', dt);
      }
      spawnTraffic(dt);
      moveTraffic(dt);
      checkTouches();
      recordMissedFeathers();
      updateScroll(dt);
      finishLegIfDone();
    }

    function playScript(dt) {
      if (phase === 'climb') {
        flyer.y = Math.max(F.SKY_TOP, flyer.y - 70 * dt);
      } else if (phase === 'fall') {
        flyer.y += 260 * dt;
      }
      moveTraffic(dt);
      if (phaseSeconds < SCRIPTED_SECONDS[phase]) {
        return;
      }
      if (phase === 'climb') {
        enterPhase('fall');
      } else if (phase === 'fall') {
        enterPhase('daedalus');
      } else {
        context.completeStage();
      }
    }

    function update(dt, input) {
      elapsed += dt;
      phaseSeconds += dt;
      warning = LM.timed.tick(warning, dt);
      if (isPlayerFlying()) {
        fly(dt, input);
      } else {
        playScript(dt);
      }
    }

    function heroWings() {
      if (phase === 'fall') {
        return { flap: 0.9 + Math.sin(elapsed * 7) * 0.3, tilt: Math.min(2.6, phaseSeconds * 1.2), pose: 'cheer', featherCount: Math.max(0, 6 - Math.floor(phaseSeconds * 3)) };
      }
      const melting = phase === 'climb' || flyer.wax > 0.3;
      return { flap: LM.winged.flapAt(elapsed, 4), tilt: 0.3 + flyer.velocity * 0.0012, isMelting: melting, pose: phase === 'climb' ? 'cheer' : 'stand' };
    }

    function drawFlyers(ctx) {
      const heroLook = phase === 'daedalus' || phase === 'arrive' ? legs.daedalus.look : legs.icarus.look;
      if (phase === 'icarus' || phase === 'climb' || phase === 'fall') {
        LM.winged.drawFlyer(ctx, 700, 300 + Math.sin(elapsed * 1.5) * 18, 0.65, legs.daedalus.look, { flap: LM.winged.flapAt(elapsed, 3), tilt: 0.3 }, elapsed);
      }
      if (!context.isBlinking()) {
        LM.winged.drawFlyer(ctx, FLYER_X, flyer.y, 0.75, heroLook, heroWings(), elapsed);
      }
      if (phase === 'climb' || phase === 'fall') {
        LM.winged.drawFallingFeathers(ctx, { x: FLYER_X - 120, y: flyer.y - 60, width: 260, height: 260 }, 5, elapsed);
      }
    }

    function drawTraffic(ctx) {
      islands.forEach(function (island) { R.drawIslandOnHorizon(ctx, island); });
      feathers.forEach(function (feather) { LM.props.drawFeather(ctx, feather.x, feather.y + Math.sin(elapsed * 3 + feather.x) * 6, 2.6, -0.5); });
      gulls.forEach(function (gull) { LM.winged.drawGull(ctx, gull.x, gull.y, 1.3, elapsed); });
      if (scroll) {
        LM.props.drawQuestionScroll(ctx, scroll.x, scroll.y, 0.8, elapsed);
      }
    }

    function bannerText() {
      if (phase === 'daedalus' && phaseSeconds < 4) {
        return BANNERS.daedalus;
      }
      return BANNERS[phase] || (warning ? warning.text : null);
    }

    function render(ctx) {
      R.drawFlightSky(ctx, elapsed, phase === 'daedalus' || phase === 'arrive' ? 'dusk' : 'day');
      R.drawZones(ctx);
      drawTraffic(ctx);
      R.drawSeaBelow(ctx, elapsed);
      drawFlyers(ctx);
      R.drawAltimeter(ctx, flyer.y);
      R.drawDangerMeter(ctx, FLYER_X, flyer.y - 96, flyer.wax, '#ff7a2a', 'wosk się topi!');
      R.drawDangerMeter(ctx, FLYER_X, flyer.y + 70, flyer.wetness, '#3a8ae8', 'pióra mokną!');
      const text = bannerText();

<script>
// Laying out the feathers of a wing from the shortest to the longest: pick one up and move it with ←/→,
// or click two feathers to swap them.
(function (LM) {
  'use strict';

  const P = LM.palette;
  const D = LM.draw;
  const SLOT_LEFT = 420;
  const SLOT_SPACING = 76;
  const BASE_Y = 440;

  function isAscending(lengths) {
    return lengths.every(function (length, index) { return index === 0 || lengths[index - 1] < length; });
  }

  function slotX(index) {
    return SLOT_LEFT + index * SLOT_SPACING;
  }

  // lengths: shortest first, which is also the order the player has to restore.
  function createFeatherRow(lengths, rng, playSound) {
    const order = LM.random.shuffledOutOfOrder(lengths, rng);
    const row = { order: order, cursor: 0, heldIndex: null };

    function moveHeld(step) {
      const target = row.heldIndex + step;
      if (target >= 0 && target < order.length) {
        LM.random.swap(order, row.heldIndex, target);
        row.heldIndex = target;
        row.cursor = target;
        playSound('move');
      }
    }

    function featherAt(pointer) {
      return order.findIndex(function (length, index) {
        return Math.abs(pointer.x - slotX(index)) < SLOT_SPACING / 2 && pointer.y > BASE_Y - 140 && pointer.y < BASE_Y + 20;
      });
    }

    function clickFeather(index) {
      if (row.heldIndex === null) {
        row.heldIndex = index;
      } else {
        LM.random.swap(order, row.heldIndex, index);
        row.heldIndex = null;
      }
      row.cursor = index;
      playSound('choose');
    }

    function updateKeyboard(input) {
      const step = input.pressedStep('left', 'right');
      if (step !== 0 && row.heldIndex !== null) {
        moveHeld(step);
      } else if (step !== 0) {
        row.cursor = Math.min(order.length - 1, Math.max(0, row.cursor + step));
      }
      if (input.wasPressed('confirm')) {
        row.heldIndex = row.heldIndex === null ? row.cursor : null;
        playSound('choose');
      }
    }

    // Returns true at the moment the feathers become sorted.
    row.update = function (input) {
      const clicked = input.pointer.wasPressed ? featherAt(input.pointer) : -1;
      if (clicked >= 0) {
        clickFeather(clicked);
      } else {
        updateKeyboard(input);
      }
      return isAscending(order);
    };

    row.sortForTesting = function () {
      order.sort(function (first, second) { return first - second; });
    };

    return row;
  }

  function drawLongFeather(ctx, x, baseY, length) {
    D.drawOutlinedEllipse(ctx, x, baseY - length / 2, length * 0.15, length / 2, '#fbf6ea', 2);
    D.drawLine(ctx, x, baseY + 4, x, baseY - length * 0.9, '#c8b88e', 2);
  }

  // look: 'arranging' shows the cursor and the picked-up feather; 'glued' shows the finished wing with wax.
  function drawWingFrame(ctx, row, time, look) {
    LM.draw.drawOutlinedRoundRect(ctx, { x: 350, y: 300, width: 580, height: 190 }, 16, 'rgba(255, 247, 224, 0.85)', 3);
    D.drawLine(ctx, SLOT_LEFT - 40, BASE_Y + 14, slotX(row.order.length - 1) + 40, BASE_Y + 14, P.outline, 12);
    D.drawLine(ctx, SLOT_LEFT - 40, BASE_Y + 14, slotX(row.order.length - 1) + 40, BASE_Y + 14, '#f2c442', 7);
    row.order.forEach(function (length, index) {
      const lift = look === 'arranging' && index === row.heldIndex ? -18 : 0;
      drawLongFeather(ctx, slotX(index), BASE_Y + lift, length);
      if (look === 'arranging' && index === row.cursor) {
        D.drawOutlinedPolygon(ctx, [[slotX(index) - 12, BASE_Y + 40], [slotX(index) + 12, BASE_Y + 40], [slotX(index), BASE_Y + 24]], P.selection, 2);
      }
    });
    if (look === 'glued') {
      LM.workshopArt.drawWaxPot(ctx, 880, 470, time);
    }
  }

  LM.featherOrder = { createFeatherRow, drawWingFrame };
}(window.LM = window.LM || {}));

</script>
<script>
// Stage 1 of mission 2: in Daedalus's workshop the player hands him the right materials (feathers and wax),
// then lays the feathers from the shortest to the longest. Questions follow each step.
(function (LM) {
  'use strict';

  const P = LM.palette;
  const MATERIALS = [
    { id: 'feathers', name: 'Ptasie pióra', isRight: true, reply: 'Tak! Ptasie pióra, jak u prawdziwych ptaków.' },
    { id: 'wax', name: 'Wosk', isRight: true, reply: 'Właśnie! Woskiem skleję pióra.' },
    { id: 'iron', name: 'Żelazne pręty', isRight: false, reply: 'Żelazo jest za ciężkie, z nim nikt nie poleci.' },
    { id: 'cloth', name: 'Płótno żaglowe', isRight: false, reply: 'Płótno to żagiel na morze, a morza pilnuje Minos.' },
    { id: 'planks', name: 'Deski', isRight: false, reply: 'Drewniane skrzydła byłyby za ciężkie.' },
    { id: 'clay', name: 'Glina', isRight: false, reply: 'Glina się kruszy, a skrzydła muszą być lekkie.' },
  ];
  const CARD_WIDTH = 176;
  const CARD_GAP = 16;
  const CARD_TOP = 500;
  const FEATHER_LENGTHS = [40, 56, 72, 88, 104, 120];
  const BUBBLE = { x: 270, y: 74, width: 600, height: 104 };

  function cardRect(index) {
    return { x: 60 + index * (CARD_WIDTH + CARD_GAP), y: CARD_TOP, width: CARD_WIDTH, height: 140 };
  }

  function createWorkshopStage(context) {
    const game = context.game;
    const materials = LM.random.shuffle(MATERIALS, context.rng).map(function (material) { return Object.assign({ state: 'onShelf' }, material); });
    let phase = 'materials';
    let cursor = 0;
    let bubbleText = 'Pomóż mi zrobić skrzydła! Podaj mi dwie rzeczy, z których je zbuduję.';
    let feathers = null;
    let doneSeconds = 0;
    let elapsed = 0;

    function chosenCount() {
      return materials.filter(function (material) { return material.state === 'chosen'; }).length;
    }

    function startFeatherPhase() {
      phase = 'feathers';
      feathers = LM.featherOrder.createFeatherRow(FEATHER_LENGTHS, context.rng, game.sfx);
      bubbleText = 'Teraz ułóż pióra od najkrótszego do najdłuższego, tak jak rosną u ptaka.';
    }

    function askThen(header, next) {
      context.askQuestion('workshop', { header: header }, next);
    }

    function handMaterial(material) {
      bubbleText = material.reply;
      if (!material.isRight) {
        material.state = 'refused';
        game.sfx('back');
        return;
      }
      material.state = 'chosen';
      game.sfx('pickup');
      askThen('Warsztat Dedala · materiały', function () {
        if (chosenCount() === 2) {
          startFeatherPhase();
        }
      });
    }

    function updateMaterials(input) {
      const step = input.pressedStep('left', 'right');
      cursor = (cursor + step + materials.length) % materials.length;
      const pressed = input.pressedOptionIndex();
      const clicked = input.pointer.wasPressed ? materials.findIndex(function (material, index) { return LM.ui.isPointInRect(input.pointer, cardRect(index)); }) : -1;
      const pickedIndex = [pressed, clicked].find(function (index) { return index >= 0 && index < materials.length; });
      if (pickedIndex !== undefined) {
        cursor = pickedIndex;
      }
      if ((pickedIndex !== undefined || input.wasPressed('confirm')) && materials[cursor].state === 'onShelf') {
        handMaterial(materials[cursor]);
      }
    }

    function finishWings() {
      phase = 'done';
      doneSeconds = 0;
      bubbleText = 'Skrzydła gotowe! Teraz nauczę cię latać, synu.';
      game.sfx('achievement');
    }

    function onFeathersSorted() {
      phase = 'gluing';
      bubbleText = 'Pięknie! Od najkrótszego do najdłuższego. Teraz skleję je woskiem.';
      game.sfx('correct');
      askThen('Warsztat Dedala · klejenie', function () {
        askThen('Warsztat Dedala · ostatnie pytanie', finishWings);
      });
    }

    function update(dt, input) {
      elapsed += dt;
      if (phase === 'materials') {
        updateMaterials(input);
      } else if (phase === 'feathers' && feathers.update(input)) {
        onFeathersSorted();
      } else if (phase === 'done') {
        doneSeconds += dt;
        if (doneSeconds > 1.8) {
          context.completeStage();
        }
      }
    }

    function cardState(material, index) {
      if (material.state === 'chosen') {
        return 'correct';
      }
      if (material.state === 'refused') {
        return 'disabled';
      }
      return index === cursor ? 'selected' : 'normal';
    }

    function drawCard(ctx, material, index) {
      const rect = cardRect(index);
      const state = cardState(material, index);
      LM.ui.drawButton(ctx, rect, '', state);
      LM.workshopItems.drawMaterialIcon(ctx, material.id, rect.x + rect.width / 2, rect.y + 78);
      LM.ui.drawNumberBadge(ctx, rect.x + 8, rect.y + 8, String(index + 1));
      const labelColor = state === 'normal' ? P.ink : P.white;
      LM.text.drawTextLine(ctx, material.name, rect.x + rect.width / 2, rect.y + 120, { font: LM.text.boldFont(18), color: labelColor, align: 'center', shadowColor: state === 'normal' ? null : P.textShadow });
    }

    function render(ctx) {
      LM.workshopArt.drawWorkshop(ctx, elapsed);
      LM.characters.drawPerson(ctx, 170, 480, 2.1, LM.characters.looks.daedalus, 'offer');
      LM.characters.drawPerson(ctx, 1150, 480, 1.7, LM.characters.looks.icarus, phase === 'done' ? 'cheer' : 'stand');
      LM.workshopItems.drawSpeechBubble(ctx, bubbleText, BUBBLE, 220, 250);
      if (phase === 'materials') {
        materials.forEach(function (material, index) { drawCard(ctx, material, index); });
      } else {
        LM.featherOrder.drawWingFrame(ctx, feathers, elapsed, phase === 'feathers' ? 'arranging' : 'glued');
      }
    }

    function debugAdvance() {
      if (phase === 'materials') {
        handMaterial(materials.find(function (material) { return material.isRight && material.state === 'onShelf'; }));
      } else if (phase === 'feathers') {
        feathers.sortForTesting();
        onFeathersSorted();
      }
    }

    return {
      update: update,
      render: render,
      hud: function () { return { title: 'Warsztat Dedala', rightText: phase === 'materials' ? 'Materiały: ' + chosenCount() + '/2' : 'Pióra' }; },
      keyHints: function () {
        return phase === 'materials' ?
          [{ keys: ['←', '→'], label: 'wybierz' }, { keys: ['Enter'], label: 'podaj Dedalowi' }] :
          [{ keys: ['←', '→'], label: 'wybierz / przesuń' }, { keys: ['Enter'], label: 'chwyć / upuść pióro' }];
      },
      restoreCheckpoint: function () {},
      debugAdvance: debugAdvance,
    };
  }

  LM.stageFactories.workshop = createWorkshopStage;
}(window.LM = window.LM || {}));

</script>
<script>
// Judging the lute game: which falling note a key press belongs to, and how well it was timed.
// Windows are wide on purpose: the game teaches myths, not reflexes.
(function (LM) {
  'use strict';

  const GREAT_SECONDS = 0.2;
  const GOOD_SECONDS = 0.38;

  // notes: [{ lane, time, result }] with result null until judged.
  function judgePress(notes, lane, pressTime) {
    const candidates = notes.filter(function (note) {
      return note.result === null && note.lane === lane && Math.abs(note.time - pressTime) <= GOOD_SECONDS;
    });
    if (candidates.length === 0) {
      return null;
    }
    const closest = candidates.reduce(function (best, note) {
      return Math.abs(note.time - pressTime) < Math.abs(best.time - pressTime) ? note : best;
    });
    closest.result = Math.abs(closest.time - pressTime) <= GREAT_SECONDS ? 'great' : 'good';
    return closest;
  }

  // Notes nobody played in time become misses; returns the newly missed ones.
  function markMissed(notes, now) {
    const missed = notes.filter(function (note) { return note.result === null && now - note.time > GOOD_SECONDS; });
    missed.forEach(function (note) { note.result = 'miss'; });
    return missed;
  }

  function hitShare(notes) {
    const hits = notes.filter(function (note) { return note.result === 'great' || note.result === 'good'; }).length;
    return notes.length === 0 ? 0 : hits / notes.length;
  }

  // chart: { bpm, notes: [[lane, beat], …] } → timed notes starting at startTime.
  function scheduleChart(chart, startTime) {
    const beatSeconds = 60 / chart.bpm;
    return chart.notes.map(function (entry) {
      return { lane: entry[0], time: startTime + entry[1] * beatSeconds, result: null };
    });
  }

  LM.rhythmJudge = { GREAT_SECONDS, GOOD_SECONDS, judgePress, markMissed, hitShare, scheduleChart };
}(window.LM = window.LM || {}));

</script>
