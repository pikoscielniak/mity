<script>
// Stage 1 of mission 3: Orpheus plays his lute to Charon, Cerberus and Hades. Notes fall slowly down four
// strings (the arrow keys); playing most of them charms the guardian. Two questions follow each guardian.
(function (LM) {
  'use strict';

  const P = LM.palette;
  const J = LM.rhythmJudge;
  const LANE_X = [470, 560, 650, 740];
  const LANE_KEYS = ['left', 'down', 'up', 'right'];
  const LANE_LABELS = ['←', '↓', '↑', '→'];
  const LANE_COLORS = ['#ffd84a', '#5ad8c8', '#ff8ab0', '#8ad85a'];
  const SPAWN_Y = 110;
  const HIT_Y = 560;
  const LEAD_SECONDS = 2.4;
  const CHARMED_SHARE = 0.6;
  const BANNER_SECONDS = 2.8;
  const QUESTIONS_PER_GUARDIAN = 2;
  const STORY = {
    charon: { intro: 'Charon przewozi przez Styks tylko dusze zmarłych. Zagraj mu na lutni!', charmed: 'Charon, oczarowany muzyką, przewozi Orfeusza za darmo!' },
    cerberus: { intro: 'Bramy pilnuje trójgłowy Cerber. Uśpij go spokojną melodią!', charmed: 'Cerber nie szczeknął ani razu. Brama wolna!' },
    hades: { intro: 'Przed tronem Hadesa zaśpiewaj o swojej miłości i tęsknocie.', charmed: 'Płaczą nawet Erynie. Hades się zgadza!' },
  };

  function createLyreStage(context) {
    const game = context.game;
    const charts = LM.data.lyreCharts;
    let guardianIndex = 0;
    let phase = 'intro';
    let phaseSeconds = 0;
    let songClock = 0;
    let notes = [];
    let popups = [];
    let questionsLeftHere = 0;
    let elapsed = 0;

    function chart() {
      return charts[guardianIndex];
    }

    function enterPhase(nextPhase) {
      phase = nextPhase;
      phaseSeconds = 0;
    }

    function startSong() {
      songClock = 0;
      notes = J.scheduleChart(chart(), LEAD_SECONDS);
      game.audio.duckMusic();
      enterPhase('playing');
    }

    function playString(lane) {
      const audio = game.audio;
      if (audio.isReady()) {
        const frequency = LM.notes.midiToFrequency(LM.notes.noteNameToMidi(LM.data.lyreStrings[lane]));
        LM.instruments.lute(audio.context(), audio.bus('sfx'), frequency, audio.context().currentTime, 1, 0.9);
      }
    }

    function showPopup(lane, text) {
      popups.push({ x: LANE_X[lane], text: text, seconds: 0.8 });
    }

    function pressLanes(input) {
      LANE_KEYS.forEach(function (key, lane) {
        if (!input.wasPressed(key)) {
          return;
        }
        const note = J.judgePress(notes, lane, songClock);
        if (note) {
          playString(lane);
          showPopup(lane, note.result === 'great' ? 'Pięknie!' : 'Dobrze');
        }
      });
    }

    function finishSong() {
      game.audio.restoreMusic();
      if (J.hitShare(notes) >= CHARMED_SHARE) {
        game.sfx('correct');
        enterPhase('charmed');
      } else {
        context.loseHeart();
        enterPhase('failed');
      }
    }

    function updateSong(dt, input) {
      songClock += dt;
      pressLanes(input);
      J.markMissed(notes, songClock).forEach(function (note) {
        LM.missionRun.addToStat(context.run, 'notesMissed', 1);
        showPopup(note.lane, 'Ups');
      });
      if (notes.every(function (note) { return note.result !== null; })) {
        finishSong();
      }
    }

    function askGuardianQuestions() {
      if (questionsLeftHere <= 0 || context.remainingQuestions('guardian') === 0) {
        nextGuardian();
        return;
      }
      questionsLeftHere -= 1;
      const header = chart().title + ' · pytanie ' + (QUESTIONS_PER_GUARDIAN - questionsLeftHere) + '/' + QUESTIONS_PER_GUARDIAN;
      context.askQuestion('guardian', { header: header }, askGuardianQuestions);
    }

    function nextGuardian() {
      guardianIndex += 1;
      if (guardianIndex >= charts.length) {
        context.completeStage();
        return;
      }
      enterPhase('intro');
    }

    function update(dt, input) {
      elapsed += dt;
      phaseSeconds += dt;
      popups.forEach(function (popup) { popup.seconds -= dt; });
      popups = popups.filter(function (popup) { return popup.seconds > 0; });
      if (phase === 'playing') {
        updateSong(dt, input);
      } else if (phase === 'intro' && phaseSeconds > BANNER_SECONDS) {
        startSong();
      } else if (phase === 'failed' && phaseSeconds > BANNER_SECONDS) {
        enterPhase('intro');
      } else if (phase === 'charmed' && phaseSeconds > BANNER_SECONDS) {
        enterPhase('questions');
        questionsLeftHere = QUESTIONS_PER_GUARDIAN;
        askGuardianQuestions();
      }
    }

    function noteY(note) {
      return HIT_Y - (note.time - songClock) * (HIT_Y - SPAWN_Y) / LEAD_SECONDS;
    }

    function drawLanes(ctx) {
      LM.draw.fillRoundRect(ctx, { x: 420, y: 90, width: 370, height: 500 }, 18, 'rgba(10, 5, 25, 0.45)');
      LANE_X.forEach(function (x, lane) {
        LM.draw.drawLine(ctx, x, 100, x, HIT_Y + 20, 'rgba(255, 246, 200, 0.5)', 2);
        LM.draw.drawOutlinedCircle(ctx, x, HIT_Y, 26, 'rgba(255, 255, 255, 0.15)', 3);
        LM.text.drawTextLine(ctx, LANE_LABELS[lane], x, HIT_Y + 10, { font: LM.text.boldFont(26), color: P.white, align: 'center' });
      });
      notes.filter(function (note) { return note.result === null; }).forEach(function (note) {
        const y = noteY(note);
        if (y >= SPAWN_Y - 30) {
          LM.draw.drawOutlinedCircle(ctx, LANE_X[note.lane], y, 22, LANE_COLORS[note.lane], 3);
          LM.text.drawTextLine(ctx, LANE_LABELS[note.lane], LANE_X[note.lane], y + 9, { font: LM.text.boldFont(24), color: P.ink, align: 'center' });
        }
      });
      popups.forEach(function (popup) {
        LM.ui.drawShadowText(ctx, popup.text, popup.x, HIT_Y - 60 - (0.8 - popup.seconds) * 40, 20, P.gold, 'center');
      });
    }

    function charm() {
      if (phase === 'charmed' || phase === 'questions') {
        return 1;
      }
      return phase === 'playing' ? J.hitShare(notes) : 0;
    }

    function bannerText() {
      const story = STORY[chart().guardian];
      if (phase === 'intro') {
        return story.intro;
      }
      if (phase === 'failed') {
        return 'Strażnik jeszcze się nie dał oczarować. Zagraj raz jeszcze, spokojnie!';
      }
      return phase === 'charmed' ? story.charmed : null;
    }

    function render(ctx) {
      LM.underworldArt.drawCavern(ctx, elapsed);
      LM.characters.drawPerson(ctx, 220, 560, 2.1, LM.characters.looks.orpheus, 'offer');
      LM.underworldArt.drawGuardian(ctx, chart().guardian, charm(), elapsed);
      drawLanes(ctx);
      const text = bannerText();
      if (text) {
        LM.ui.drawStoryBanner(ctx, text);
      }
    }

    function debugAdvance() {
      if (phase === 'playing') {
        notes.forEach(function (note) { note.result = 'great'; });
      } else {
        phaseSeconds = BANNER_SECONDS + 1;
      }
    }

    return {
      update: update,
      render: render,
      hud: function () {
        return { title: chart().title, rightText: 'Strażnik ' + (guardianIndex + 1) + '/' + charts.length };
      },
      keyHints: function () { return [{ keys: LANE_LABELS, label: 'graj na strunach, gdy nuta dotknie kółka' }]; },
      restoreCheckpoint: function () { enterPhase('intro'); },
      debugAdvance: debugAdvance,
    };
  }

  LM.stageFactories.lyre = createLyreStage;
}(window.LM = window.LM || {}));

</script>
<script>
// The dark path up from the underworld, its echo stones, the light of the exit and the hills of Thrace.
(function (LM) {
  'use strict';

  const D = LM.draw;
  const PIXELS_PER_UNIT = 22;
  const HERO_SCREEN_X = 420;

  // The path rises from the depths (distance 0) to the exit (distance 100).
  function groundY(distance) {
    return 590 - distance * 1.7;
  }

  function screenX(distance, heroDistance) {
    return HERO_SCREEN_X + (distance - heroDistance) * PIXELS_PER_UNIT;
  }

  function drawExitLight(ctx, heroDistance) {
    const x = screenX(104, heroDistance);
    const glow = ctx.createRadialGradient(x, groundY(100) - 80, 10, x, groundY(100) - 80, 520);
    glow.addColorStop(0, 'rgba(255, 244, 200, 0.95)');
    glow.addColorStop(0.3, 'rgba(255, 220, 140, 0.45)');
    glow.addColorStop(1, 'rgba(255, 220, 140, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 56, 1280, 608);
  }

  function drawPath(ctx, heroDistance) {
    const from = heroDistance - 30;
    const to = heroDistance + 40;
    ctx.beginPath();
    ctx.moveTo(screenX(from, heroDistance), 720);
    for (let distance = from; distance <= to; distance += 2) {
      ctx.lineTo(screenX(distance, heroDistance), groundY(distance) + Math.sin(distance) * 3);
    }
    ctx.lineTo(screenX(to, heroDistance), 720);
    ctx.closePath();
    ctx.fillStyle = '#3a2a4a';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#6a5a8a';
    ctx.stroke();
  }

  function drawTunnel(ctx, heroDistance, time) {
    D.drawBandedGradient(ctx, { x: 0, y: 56, width: 1280, height: 608 }, '#0e0818', '#2a1a3a', 10);
    drawExitLight(ctx, heroDistance);
    ctx.fillStyle = '#1a1028';
    for (let rock = Math.floor(heroDistance / 8) * 8 - 24; rock < heroDistance + 48; rock += 8) {
      const x = screenX(rock, heroDistance);
      ctx.beginPath();
      ctx.moveTo(x - 40, 56);
      ctx.lineTo(x, 56 + 50 + ((rock * 13) % 60));
      ctx.lineTo(x + 40, 56);
      ctx.fill();
    }
    drawPath(ctx, heroDistance);
  }

  // state: 'waiting' (glowing question) or 'answered'.
  function drawEchoStone(ctx, distance, heroDistance, time, state) {
    const x = screenX(distance, heroDistance);
    const y = groundY(distance);
    D.drawOutlinedPolygon(ctx, [[x - 26, y + 4], [x - 20, y - 70], [x + 18, y - 76], [x + 26, y + 4]], '#5a5a7a', 3);
    const pulse = 0.4 + 0.25 * Math.sin(time * 4);
    const glow = state === 'answered' ? 'rgba(120, 220, 160, 0.5)' : 'rgba(150, 200, 255, ' + pulse + ')';
    D.fillCircle(ctx, x, y - 38, 18, glow);
    LM.text.drawTextLine(ctx, state === 'answered' ? '✔' : '?', x, y - 29, { font: LM.text.boldFont(24), color: '#e8f0ff', align: 'center' });
  }

  LM.ascentArt = { HERO_SCREEN_X, groundY, screenX, drawTunnel, drawEchoStone };
}(window.LM = window.LM || {}));

</script>
<script>
// Stage 2 of mission 3: the way up from the underworld. Hold → to climb; Eurydice and Hermes follow unseen.
// Voices tempt Orpheus to look back (←) — which Hades forbade. Echo stones ask questions on the way.
// At the exit the myth plays out as written, then Orpheus laments in Thrace (two last questions).
(function (LM) {
  'use strict';

  const A = LM.ascentArt;
  const WALK_SPEED = 5;
  const EXIT_DISTANCE = 97;
  const ECHO_DISTANCES = [20, 40, 60, 80];
  const TEMPTATION_SECONDS = 4.5;
  const SCRIPT_SECONDS = { lookBack: 6, lament: 3 };
  const STEP_SOUND_SECONDS = 0.55;
  const TEMPTATIONS = [
    { at: 11, speaker: 'eurydice', text: 'Orfeuszu… czy ja naprawdę idę za tobą?', isTempting: true },
    { at: 30, speaker: 'eurydice', text: 'Nie słyszę swoich kroków… Może zostałam w ciemności?', isTempting: true },
    { at: 50, speaker: 'narrator', text: 'Za plecami coś cicho zaszeleściło…', isTempting: true },
    { at: 70, speaker: 'hermes', text: 'Cienie zmarłych stąpają bezgłośnie. Idź dalej i nie oglądaj się.', isTempting: false },
    { at: 88, speaker: 'eurydice', text: 'Spójrz na mnie choć raz, Orfeuszu!', isTempting: true },
  ];
  const LOOK_BACK_STORY = 'Byli już prawie u wyjścia, gdy w micie Orfeusz nie wytrzymał i obejrzał się. Eurydyka zniknęła w ciemności na zawsze.';
  const LAMENT_STORY = 'Orfeusz wyszedł na świat sam i długo śpiewał smutne pieśni w górach Tracji.';

  function createAscentStage(context) {
    const game = context.game;
    const echoCount = Math.min(ECHO_DISTANCES.length, context.remainingQuestions('echo'));
    const echoes = ECHO_DISTANCES.slice(0, echoCount).map(function (distance) { return { distance: distance, state: 'waiting' }; });
    let distance = 0;
    let checkpoint = 0;
    let phase = 'climbing';
    let phaseSeconds = 0;
    let temptation = null;
    let nextTemptation = 0;
    let warning = null;
    let stepClock = 0;
    let elapsed = 0;

    function enterPhase(nextPhase) {
      phase = nextPhase;
      phaseSeconds = 0;
    }

    function startTemptation(entry) {
      temptation = { entry: entry, seconds: TEMPTATION_SECONDS };
      game.narrate(entry.text, entry.speaker);
    }

    function lookBack() {
      LM.missionRun.addToStat(context.run, 'lookBacks', 1);
      warning = { text: 'Nie wolno się oglądać! Taki warunek postawił Hades.', seconds: 2.5 };
      game.sfx('wrong');
      context.loseHeart();
    }

    function askEcho(echo) {
      const number = echoes.indexOf(echo) + 1;
      context.askQuestion('echo', { header: 'Echo w ciemności ' + number + '/' + echoes.length }, function () {
        echo.state = 'answered';
        checkpoint = echo.distance;
      });
    }

    function walk(dt, input) {
      const isWalking = input.isHeld('right') || input.isHeld('up');
      const nextEcho = echoes.find(function (echo) { return echo.state === 'waiting'; });
      const limit = nextEcho ? nextEcho.distance : EXIT_DISTANCE;
      if (isWalking) {
        distance = Math.min(limit, distance + WALK_SPEED * dt);
        stepClock += dt;
        if (stepClock > STEP_SOUND_SECONDS) {
          stepClock = 0;
          game.sfx('softStep');
        }
      }
      if (nextEcho && distance >= nextEcho.distance) {
        askEcho(nextEcho);
      } else if (!nextEcho && distance >= EXIT_DISTANCE) {
        game.speech.cancel();
        enterPhase('lookBack');
      }
    }

    function updateTemptation(dt) {
      temptation = LM.timed.tick(temptation, dt);
      const due = TEMPTATIONS[nextTemptation];
      if (due && distance >= due.at) {
        nextTemptation += 1;
        startTemptation(due);
      }
    }

    function askLamentQuestions(left) {
      if (left <= 0 || context.remainingQuestions('ending') === 0) {
        context.completeStage();
        return;
      }
      context.askQuestion('ending', { header: 'Lament Orfeusza' }, function () { askLamentQuestions(left - 1); });
    }

    function update(dt, input) {
      elapsed += dt;
      phaseSeconds += dt;
      warning = LM.timed.tick(warning, dt);
      if (phase === 'climbing') {
        if (input.wasPressed('left')) {
          lookBack();
        }
        walk(dt, input);
        updateTemptation(dt);
      } else if (phase === 'lookBack' && phaseSeconds > SCRIPT_SECONDS.lookBack) {
        enterPhase('lament');
      } else if (phase === 'lament' && phaseSeconds > SCRIPT_SECONDS.lament) {
        enterPhase('lamentQuestions');
        askLamentQuestions(2);
      }
    }

    function drawFollowers(ctx) {
      const fade = Math.max(0, 1 - phaseSeconds / 3.5);
      const groundAt = A.groundY(distance - 6);
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.65 * fade;
      LM.characters.drawPerson(ctx, A.HERO_SCREEN_X - 150 - phaseSeconds * 20, groundAt, 1.6, LM.characters.looks.eurydice, 'mourn');
      ctx.restore();
      LM.characters.drawPerson(ctx, A.HERO_SCREEN_X - 260 - phaseSeconds * 30, groundAt + 10, 1.6, LM.characters.looks.hermes, 'stand');
    }

    function drawClimb(ctx) {
      A.drawTunnel(ctx, distance, elapsed);
      echoes.forEach(function (echo) { A.drawEchoStone(ctx, echo.distance, distance, elapsed, echo.state); });
      if (phase === 'lookBack') {
        drawFollowers(ctx);
      }
      const bob = phase === 'climbing' ? Math.abs(Math.sin(distance * 1.4)) * 4 : 0;
      LM.characters.drawPerson(ctx, A.HERO_SCREEN_X, A.groundY(distance) - bob, 1.9, LM.characters.looks.orpheus, 'stand');
    }

    function drawTemptation(ctx) {
      const entry = temptation.entry;
      LM.ui.drawStoryBanner(ctx, entry.text);
      if (entry.isTempting) {
        const pulse = 1 + 0.08 * Math.sin(elapsed * 10);
        LM.draw.withTransform(ctx, 150, 200, pulse, function () {
          LM.draw.drawOutlinedRoundRect(ctx, { x: -100, y: -34, width: 200, height: 68 }, 14, 'rgba(200, 40, 40, 0.8)', 3);
          LM.text.drawTextLine(ctx, '← obejrzeć się?', 0, 9, { font: LM.text.boldFont(22), color: '#ffffff', align: 'center' });
        });
      }
    }

    function render(ctx) {
      if (phase === 'lament' || phase === 'lamentQuestions') {
        LM.illustrations['thrace-lament'](ctx, elapsed);
        LM.ui.drawStoryBanner(ctx, LAMENT_STORY);
        return;
      }
      drawClimb(ctx);
      if (phase === 'lookBack') {
        LM.ui.drawStoryBanner(ctx, LOOK_BACK_STORY);
      } else if (warning) {
        LM.ui.drawStoryBanner(ctx, warning.text);
      } else if (temptation) {
        drawTemptation(ctx);
      }
    }

    function keyHints() {
      if (phase !== 'climbing') {
        return [];
      }
      return [{ keys: ['→'], label: 'idź w górę (trzymaj)' }, { keys: ['←'], label: 'tego nie naciskaj: obejrzenie się!' }];
    }

    function debugAdvance() {
      if (phase !== 'climbing') {
        phaseSeconds = 99;
        return;
      }
      const nextEcho = echoes.find(function (echo) { return echo.state === 'waiting'; });
      if (nextEcho) {
        distance = nextEcho.distance;
        askEcho(nextEcho);
      } else {
        distance = EXIT_DISTANCE;
        enterPhase('lookBack');
      }
    }

    return {
      update: update,
      render: render,
      hud: function () { return { title: 'Droga z podziemi', rightText: 'Do wyjścia: ' + Math.max(0, Math.round(EXIT_DISTANCE - distance)) + ' kroków' }; },
      keyHints: keyHints,
      restoreCheckpoint: function () { distance = checkpoint; },
      debugAdvance: debugAdvance,
    };
  }

  LM.stageFactories.ascent = createAscentStage;
}(window.LM = window.LM || {}));

</script>
<script>
// Answers A–D (or Prawda/Fałsz): number keys answer at once, arrows + Enter or a click also work.
(function (LM) {
  'use strict';

  function drawOption(ctx, item, rect, state) {
    LM.ui.drawOptionRow(ctx, rect, String(item.index + 1), item.label, state);
  }

  // labels: option texts; disabledIndices: options already tried and wrong. Responds with { optionIndex }.
  function createChoiceView(labels, area, disabledIndices, playSound) {
    const items = labels.map(function (label, index) {
      return { id: 'option', index: index, label: label, isEnabled: disabledIndices.indexOf(index) < 0 };
    });
    const itemHeight = labels.length > 2 ? 64 : 72;
    const menu = LM.menu.createMenu(items, {
      x: area.x, y: area.y, width: area.width, itemHeight: itemHeight, gap: 12,
      playSound: playSound, renderItem: drawOption,
    });

    function update(input) {
      const pressed = input.pressedOptionIndex();
      if (pressed >= 0 && pressed < items.length && items[pressed].isEnabled) {
        playSound('choose');
        return { optionIndex: pressed };
      }
      const chosen = menu.update(input);
      return chosen ? { optionIndex: chosen.index } : null;
    }

    return {
      update: update,
      render: menu.render,
      keyHints: [
        { keys: labels.length > 2 ? ['1', '2', '3', '4'] : ['1', '2'], label: 'odpowiedź' },
        { keys: ['↑', '↓', 'Enter'], label: 'albo strzałki' },
      ],
      dispose: function () {},
    };
  }

  LM.choiceView = { createChoiceView };
}(window.LM = window.LM || {}));

</script>
<script>
// Put the events of a myth in order: pick a card up (Enter or mouse), move it with ↑/↓ or by dragging, drop it.
(function (LM) {
  'use strict';

  const CARD_HEIGHT = 54;
  const CARD_GAP = 10;
  const NUMBER_COLUMN = 52;

  // Responds with { items } in the order the player arranged them.
  function createOrderView(itemsInOrder, area, rng, playSound) {
    const cards = LM.random.shuffledOutOfOrder(itemsInOrder, rng);
    const submitIndex = cards.length;
    let cursor = 0;
    let heldIndex = null;
    let isDragging = false;

    function cardRect(index) {
      return { x: area.x + NUMBER_COLUMN, y: area.y + index * (CARD_HEIGHT + CARD_GAP), width: area.width - NUMBER_COLUMN, height: CARD_HEIGHT };
    }

    function submitRect() {
      return { x: area.x + area.width / 2 - 170, y: area.y + cards.length * (CARD_HEIGHT + CARD_GAP) + 8, width: 340, height: 52 };
    }

    function cardIndexAt(point) {
      return cards.findIndex(function (card, index) { return LM.ui.isPointInRect(point, cardRect(index)); });
    }

    function moveHeldCard(step) {
      const target = heldIndex + step;
      if (target < 0 || target >= cards.length) {
        return;
      }
      LM.random.swap(cards, heldIndex, target);
      heldIndex = target;
      cursor = target;
      playSound('move');
    }

    function moveCursor(step) {
      cursor = Math.min(submitIndex, Math.max(0, cursor + step));
      playSound('move');
    }

    function toggleHold() {
      heldIndex = heldIndex === null ? cursor : null;
      playSound('choose');
    }

    function updateKeyboard(input) {
      const step = input.pressedStep('up', 'down');
      if (step !== 0 && heldIndex !== null) {
        moveHeldCard(step);
      } else if (step !== 0) {
        moveCursor(step);
      }
      if (input.wasPressed('confirm') && cursor === submitIndex) {
        return { items: cards.slice() };
      }
      if (input.wasPressed('confirm')) {
        toggleHold();
      }
      return null;
    }

    function dragHeldCardTo(pointerY) {
      const target = Math.min(cards.length - 1, Math.max(0, Math.floor((pointerY - area.y) / (CARD_HEIGHT + CARD_GAP))));
      while (heldIndex !== target) {
        moveHeldCard(target > heldIndex ? 1 : -1);
      }
    }

    function updatePointer(pointer) {
      if (pointer.wasPressed && LM.ui.isPointInRect(pointer, submitRect())) {
        return { items: cards.slice() };
      }
      const pressedCard = pointer.wasPressed ? cardIndexAt(pointer) : -1;
      if (pressedCard >= 0) {
        heldIndex = pressedCard;
        cursor = pressedCard;
        isDragging = true;
      }
      if (isDragging && pointer.isDown) {
        dragHeldCardTo(pointer.y);
      }
      if (isDragging && pointer.wasReleased) {
        isDragging = false;
        heldIndex = null;
      }
      return null;
    }

    function update(input) {
      return updatePointer(input.pointer) || updateKeyboard(input);
    }

    function render(ctx) {
      cards.forEach(function (card, index) {
        const rect = cardRect(index);
        LM.ui.drawNumberBadge(ctx, area.x, rect.y + (CARD_HEIGHT - 34) / 2, String(index + 1));
        const lift = index === heldIndex ? -4 : 0;
        const state = index === cursor ? 'selected' : 'normal';
        LM.ui.drawOptionRow(ctx, { x: rect.x + lift, y: rect.y + lift, width: rect.width, height: rect.height }, index === heldIndex ? '↕' : null, card, state);
      });
      LM.ui.drawButton(ctx, submitRect(), 'Sprawdź kolejność', cursor === submitIndex ? 'selected' : 'normal', 22);
    }

    return {
      update: update,
      render: render,
      keyHints: [
        { keys: ['↑', '↓'], label: 'wybierz / przesuń' },
        { keys: ['Enter'], label: 'chwyć / upuść' },
      ],
      dispose: function () {},
    };
  }

  LM.orderView = { createOrderView };
}(window.LM = window.LM || {}));

</script>
<script>
// Match pairs: choose an item in one column, then its partner in the other. A coloured line joins each pair.
(function (LM) {
  'use strict';

  const ROW_HEIGHT = 54;
  const ROW_GAP = 10;
  const PAIR_COLORS = ['#e8202a', '#2f9e44', '#2f6fd8', '#c0660f', '#8a3ab8'];
  const LEFT = 0;
  const RIGHT = 1;
  const SUBMIT = 2;

  // Responds with { pairs: { leftText: rightText } } once every left item has a partner.
  function createMatchView(pairs, area, rng, playSound) {
    const lefts = pairs.map(function (pair) { return pair.left; });
    const rights = LM.random.shuffle(pairs.map(function (pair) { return pair.right; }), rng);
    const partnerOfLeft = lefts.map(function () { return null; });
    let cursor = { column: LEFT, index: 0 };
    let pending = null;
    const columnWidth = area.width * 0.42;

    function itemRect(column, index) {
      const x = column === LEFT ? area.x : area.x + area.width - columnWidth;
      return { x: x, y: area.y + index * (ROW_HEIGHT + ROW_GAP), width: columnWidth, height: ROW_HEIGHT };
    }

    function submitRect() {
      return { x: area.x + area.width / 2 - 150, y: area.y + lefts.length * (ROW_HEIGHT + ROW_GAP) + 8, width: 300, height: 52 };
    }

    function isComplete() {
      return partnerOfLeft.every(function (partner) { return partner !== null; });
    }

    function leftPartnerOfRight(rightIndex) {
      return partnerOfLeft.indexOf(rightIndex);
    }

    function link(leftIndex, rightIndex) {
      const previousLeft = leftPartnerOfRight(rightIndex);
      if (previousLeft >= 0) {
        partnerOfLeft[previousLeft] = null;
      }
      partnerOfLeft[leftIndex] = rightIndex;
      playSound('choose');
    }

    // Choosing an item either starts a pair or completes the pair started in the other column.
    function chooseItem(column, index) {
      if (pending && pending.column !== column) {
        const leftIndex = column === LEFT ? index : pending.index;
        const rightIndex = column === RIGHT ? index : pending.index;
        link(leftIndex, rightIndex);
        pending = null;
        return;
      }
      pending = { column: column, index: index };
      playSound('move');
    }

    function moveCursor(input) {
      if (cursor.column === SUBMIT && input.wasPressed('up')) {
        cursor = { column: LEFT, index: lefts.length - 1 };
      } else if (input.wasPressed('down') && cursor.column !== SUBMIT) {
        cursor = cursor.index === lefts.length - 1 ? { column: SUBMIT, index: 0 } : { column: cursor.column, index: cursor.index + 1 };
      } else if (input.wasPressed('up') && cursor.column !== SUBMIT) {
        cursor = { column: cursor.column, index: Math.max(0, cursor.index - 1) };
      } else if (input.wasPressed('left') && cursor.column === RIGHT) {
        cursor = { column: LEFT, index: cursor.index };
      } else if (input.wasPressed('right') && cursor.column === LEFT) {
        cursor = { column: RIGHT, index: cursor.index };
      }
    }

    function response() {
      const chosen = {};
      lefts.forEach(function (left, index) { chosen[left] = rights[partnerOfLeft[index]]; });
      return { pairs: chosen };
    }

    function itemAtPointer(pointer) {
      for (let index = 0; index < lefts.length; index += 1) {
        if (LM.ui.isPointInRect(pointer, itemRect(LEFT, index))) {
          return { column: LEFT, index: index };
        }
        if (LM.ui.isPointInRect(pointer, itemRect(RIGHT, index))) {
          return { column: RIGHT, index: index };
        }
      }
      return null;
    }

    function update(input) {
      moveCursor(input);
      const clicked = input.pointer.wasPressed ? itemAtPointer(input.pointer) : null;
      if (clicked) {
        cursor = clicked;
        chooseItem(clicked.column, clicked.index);
      }
      const clickedSubmit = input.pointer.wasPressed && LM.ui.isPointInRect(input.pointer, submitRect());
      const confirmedSubmit = input.wasPressed('confirm') && cursor.column === SUBMIT;
      if ((clickedSubmit || confirmedSubmit) && isComplete()) {
        return response();
      }
      if (input.wasPressed('confirm') && cursor.column !== SUBMIT) {
        chooseItem(cursor.column, cursor.index);
      }
      return null;
    }

    function pairColorOf(column, index) {
      const leftIndex = column === LEFT ? index : leftPartnerOfRight(index);
      const isPaired = leftIndex >= 0 && partnerOfLeft[leftIndex] !== null;
      return isPaired ? PAIR_COLORS[leftIndex % PAIR_COLORS.length] : null;
    }

    function drawItem(ctx, column, index, text) {
      const rect = itemRect(column, index);
      const isCursor = cursor.column === column && cursor.index === index;
      const isPending = pending !== null && pending.column === column && pending.index === index;
      LM.ui.drawOptionRow(ctx, rect, null, text, isCursor || isPending ? 'selected' : 'normal');
      if (isPending) {
        LM.draw.roundRectPath(ctx, { x: rect.x - 5, y: rect.y - 5, width: rect.width + 10, height: rect.height + 10 }, 12);
        ctx.strokeStyle = LM.palette.gold;
        ctx.lineWidth = 4;
        ctx.stroke();
      }
      const color = pairColorOf(column, index);
      if (color) {
        const dotX = column === LEFT ? rect.x + rect.width + 14 : rect.x - 14;
        LM.draw.drawOutlinedCircle(ctx, dotX, rect.y + ROW_HEIGHT / 2, 9, color, 2);
      }
    }

    function drawLinks(ctx) {
      partnerOfLeft.forEach(function (rightIndex, leftIndex) {
        if (rightIndex === null) {
          return;
        }
        const from = itemRect(LEFT, leftIndex);
        const to = itemRect(RIGHT, rightIndex);
        LM.draw.drawLine(ctx, from.x + from.width + 14, from.y + ROW_HEIGHT / 2, to.x - 14, to.y + ROW_HEIGHT / 2, PAIR_COLORS[leftIndex % PAIR_COLORS.length], 4);
      });
    }

    function submitButtonState() {
      if (!isComplete()) {
        return 'disabled';
      }
      return cursor.column === SUBMIT ? 'selected' : 'normal';
    }

    function render(ctx) {
      drawLinks(ctx);
      lefts.forEach(function (text, index) { drawItem(ctx, LEFT, index, text); });
      rights.forEach(function (text, index) { drawItem(ctx, RIGHT, index, text); });
      LM.ui.drawButton(ctx, submitRect(), 'Sprawdź pary', submitButtonState(), 22);
    }

    return {
      update: update,
      render: render,
      keyHints: [
        { keys: ['←', '→', '↑', '↓'], label: 'wybór' },
        { keys: ['Enter'], label: 'połącz w parę' },
      ],
      dispose: function () {},
    };
  }

  LM.matchView = { createMatchView };
}(window.LM = window.LM || {}));

</script>

// The player types the answer. Esc means "nie wiem" (counts as wrong and shows the answer); Tab opens the hint.
(function (LM) {
  'use strict';

  // Responds with { text } (or { text: '' } after Esc).
  function createTypedView(area, game, onHintKey) {
    const fieldRect = { x: area.x + area.width / 2 - 290, y: area.y + 56, width: 580, height: 60 };
    let pendingResponse = null;
    let coveredText = '';

    function showField(initialText) {
      game.textInput.show(fieldRect, {
        initialText: initialText,
        placeholder: 'Wpisz odpowiedź…',
        maxLength: 40,
        onSubmit: function (text) {
          if (text.trim().length > 0) {
            pendingResponse = { text: text };
          }
        },
        onCancel: function () { pendingResponse = { text: '' }; },
        onTab: onHintKey,
      });
    }

    function update() {
      game.textInput.keepFocus();
      const response = pendingResponse;
      pendingResponse = null;
      return response;
    }

    function render(ctx) {
      const style = { font: LM.text.boldFont(22), color: LM.palette.ink, lineHeight: 28, align: 'center' };
      LM.text.drawWrappedText(ctx, 'Twoja odpowiedź:', area.x + area.width / 2, area.y + 30, area.width, style);
      LM.text.drawWrappedText(ctx, 'Wielkie litery i polskie znaki nie mają znaczenia, drobna literówka też.', area.x + area.width / 2, fieldRect.y + 100, area.width, {
        font: LM.text.regularFont(18), color: LM.palette.inkSoft, lineHeight: 24, align: 'center',
      });
    }

    showField('');

    return {
      update: update,
      render: render,
      keyHints: [{ keys: ['Enter'], label: 'zatwierdź' }, { keys: ['Esc'], label: 'nie wiem' }],
      // The HTML field would float above the hint scroll, so it hides while covered and returns with the typed text.
      cover: function () {
        coveredText = game.textInput.currentText();
        game.textInput.hide();
      },
      uncover: function () { showField(coveredText); },
      dispose: function () { game.textInput.hide(); },
    };
  }

  LM.typedView = { createTypedView };
}(window.LM = window.LM || {}));

</script>

<script>
// Asks one question over the current scene: the answer view, then feedback with the myth's explanation.
// With 'retryUntilCorrect' a wrong answer is followed by another try (only the first try is scored).
(function (LM) {
  'use strict';

  const P = LM.palette;
  const PANEL = { x: 110, y: 36, width: 1060, height: 612 };
  const PROMPT_STYLE = { font: LM.text.boldFont(25), color: P.ink, lineHeight: 33 };
  const PRAISE = ['Dobrze!', 'Brawo!', 'Świetnie!', 'Tak jest!', 'Znakomicie!'];

  function promptText(question) {
    if (question.type === 'truefalse') {
      return 'Prawda czy fałsz?\n„' + question.statement + '”';
    }
    return question.prompt;
  }

  // Choice options are shown in a fresh random order every time, so the right answer is never always first.
  function shuffledOptionOrder(question, rng) {
    const indices = question.type === 'choice' ? question.options.map(function (option, index) { return index; }) : [];
    return LM.random.shuffle(indices, rng);
  }

  // request: { question, header, attemptPolicy: 'retryUntilCorrect' | 'singleAttempt', run (or null), rng?, onClosed({ isFirstAttemptCorrect }) }
  function createQuestionOverlay(game, request) {
    const question = request.question;
    const rng = request.rng || Math.random;
    const prompt = game.say(promptText(question));
    const contentX = PANEL.x + 30;
    const contentWidth = PANEL.width - 60;
    const promptHeight = LM.text.measureWrappedHeight(game.view.ctx, prompt, contentWidth, PROMPT_STYLE);
    const viewTop = PANEL.y + 60 + promptHeight + 20;
    const viewArea = { x: contentX + 20, y: viewTop, width: contentWidth - 40, height: PANEL.y + PANEL.height - viewTop - 20 };
    const optionOrder = shuffledOptionOrder(question, rng);
    const wrongOptions = [];
    const praise = PRAISE[Math.floor(rng() * PRAISE.length)];
    let firstAttemptCorrect = null;
    let lastAttemptCorrect = false;
    let phase = 'asking';
    let hintWasUsed = false;
    let view = null;
    const overlay = {
      kind: 'question',
      question: question,
      update: update,
      render: render,
      exit: exit,
      cover: function () { forwardToView('cover'); },
      uncover: function () { forwardToView('uncover'); },
      answerWith: function (questionResponse) { submit(questionResponse); },
      shownOptionNumber: function (optionIndex) { return optionOrder.indexOf(optionIndex) + 1; },
      isShowingFeedback: function () { return phase === 'feedback'; },
      continueAfterFeedback: function () { continueAfterFeedback(); },
    };

    function createView() {
      if (question.type === 'choice') {
        const labels = optionOrder.map(function (index) { return question.options[index]; });
        return LM.choiceView.createChoiceView(labels, viewArea, wrongOptions, game.sfx);
      }
      if (question.type === 'truefalse') {
        return LM.choiceView.createChoiceView(['Prawda', 'Fałsz'], viewArea, wrongOptions, game.sfx);
      }
      if (question.type === 'order') {
        return LM.orderView.createOrderView(question.itemsInOrder, viewArea, rng, game.sfx);
      }
      if (question.type === 'match') {
        return LM.matchView.createMatchView(question.pairs, viewArea, rng, game.sfx);
      }
      return LM.typedView.createTypedView(viewArea, game, openHint);
    }

    // Views answer in what they display (a shown option number); the answer check needs the question's terms.
    function toQuestionResponse(viewResponse) {
      if (question.type === 'choice') {
        return { optionIndex: optionOrder[viewResponse.optionIndex] };
      }
      if (question.type === 'truefalse') {
        return { value: viewResponse.optionIndex === 0 };
      }
      return viewResponse;
    }

    function answerFromView(viewResponse) {
      const isCorrect = submit(toQuestionResponse(viewResponse));
      if (!isCorrect && viewResponse.optionIndex !== undefined) {
        wrongOptions.push(viewResponse.optionIndex);
      }
    }

    function submit(questionResponse) {
      const isCorrect = LM.answerCheck.isAnswerCorrect(question, questionResponse);
      if (firstAttemptCorrect === null) {
        firstAttemptCorrect = isCorrect;
        if (request.run) {
          LM.missionRun.recordAnswer(request.run, question, isCorrect);
        }
      }
      lastAttemptCorrect = isCorrect;
      view.dispose();
      phase = 'feedback';
      game.sfx(isCorrect ? 'correct' : 'wrong');
      return isCorrect;
    }

    // Only the typed view owns something outside the canvas (its text field), so only it reacts to cover/uncover.
    function forwardToView(method) {
      if (view && view[method]) {
        view[method]();
      }
    }

    const allowsHints = Boolean(request.run && request.run.hintBudget > 0 && question.hintPageId);
    const hintPage = allowsHints ? LM.stories.findStoryPage(question.hintPageId) : null;

    // One hint per question costs one of the mission's scrolls; reopening the same scroll is free.
    function openHint() {
      if (!hintPage || (!hintWasUsed && LM.missionRun.hintsLeft(request.run) <= 0)) {
        game.sfx('back');
        return;
      }
      if (!hintWasUsed) {
        LM.missionRun.recordHintUse(request.run);
        hintWasUsed = true;
      }
      game.sfx('page');
      game.scenes.pushOverlay(LM.hintScroll.createHintScrollOverlay(game, hintPage, LM.missionRun.hintsLeft(request.run)));
    }

    function close() {
      game.scenes.popOverlay(overlay);
      request.onClosed({ isFirstAttemptCorrect: firstAttemptCorrect });
    }

    function continueAfterFeedback() {
      if (lastAttemptCorrect || request.attemptPolicy === 'singleAttempt') {
        close();
        return;
      }
      view = createView();
      phase = 'asking';
    }

    function update(dt, input) {
      if (phase === 'feedback') {
        if (input.wasPressed('confirm') || input.pointer.wasPressed) {
          continueAfterFeedback();
        }
        return;
      }
      if (input.wasPressed('hint')) {
        openHint();
        return;
      }
      // In the typed view Esc never gets here: the text field takes it as "nie wiem".
      if (input.wasPressed('back')) {
        game.scenes.pushOverlay(LM.pauseOverlay.createPauseOverlay(game));
        return;
      }
      const viewResponse = view.update(input);
      if (viewResponse) {
        answerFromView(viewResponse);
      }
    }

    function feedbackTitle() {
      return lastAttemptCorrect ? game.say(praise) : 'Nie tym razem…';
    }

    function drawFeedback(ctx) {
      const centerX = viewArea.x + viewArea.width / 2;
      let y = viewArea.y + 40;
      LM.text.drawTextLine(ctx, feedbackTitle(), centerX, y, {
        font: LM.text.boldFont(38), color: lastAttemptCorrect ? P.correct : P.wrong, align: 'center',
      });
      y += 50;
      if (!lastAttemptCorrect) {
        y += LM.text.drawWrappedText(ctx, 'Poprawna odpowiedź: ' + LM.answerCheck.correctAnswerText(question), centerX, y, viewArea.width, {
          font: LM.text.boldFont(23), color: P.ink, lineHeight: 30, align: 'center',
        }) + 12;
      }
      LM.text.drawWrappedText(ctx, game.say(question.explanation || ''), centerX, y, viewArea.width - 40, {
        font: LM.text.regularFont(22), color: P.inkSoft, lineHeight: 30, align: 'center',
      });
      const willRetry = !lastAttemptCorrect && request.attemptPolicy !== 'singleAttempt';
      LM.ui.drawButton(ctx, { x: centerX - 190, y: PANEL.y + PANEL.height - 86, width: 380, height: 56 }, willRetry ? 'Spróbuj jeszcze raz' : 'Dalej', 'selected', 24);
    }

    function keyHints() {
      if (phase === 'feedback') {
        return [{ keys: ['Enter'], label: 'dalej' }];
      }
      const hints = view.keyHints.slice();
      if (hintPage) {
        hints.push({ keys: [question.type === 'typed' ? 'Tab' : 'H'], label: 'zwój (' + LM.missionRun.hintsLeft(request.run) + ')' });
      }
      if (question.type !== 'typed') {
        hints.push({ keys: ['Esc'], label: 'pauza' });
      }
      return hints;
    }

    function render(ctx) {
      LM.ui.drawDimmer(ctx);
      LM.ui.drawTitledPanel(ctx, PANEL, request.header);
      LM.text.drawWrappedText(ctx, prompt, contentX, PANEL.y + 88, contentWidth, PROMPT_STYLE);
      if (phase === 'feedback') {
        drawFeedback(ctx);
      } else {
        view.render(ctx);
      }
      LM.ui.drawKeyHintBar(ctx, keyHints());
    }

    function exit() {
      if (view) {
        view.dispose();
      }
    }

    view = createView();
    return overlay;
  }

  LM.questionOverlay = { createQuestionOverlay };
}(window.LM = window.LM || {}));

</script>

// Pause during a stage or a question: continue, mute or unmute all sound, or go back to the map.
(function (LM) {
  'use strict';

  function createPauseOverlay(game) {
    const settings = game.profile().settings;
    let isConfirmingExit = false;
    const items = [
      { id: 'resume', label: 'Graj dalej' },
      { id: 'sound', label: '' },
      { id: 'exit', label: '' },
    ];
    const menu = LM.menu.createMenu(items, { x: 440, y: 270, width: 400, itemHeight: 56, gap: 14, fontSize: 22, playSound: game.sfx });
    const overlay = { kind: 'pause', update: update, render: render };

    function refreshLabels() {
      items[1].label = settings.isMuted ? 'Włącz dźwięki' : 'Wycisz dźwięki';
      items[2].label = isConfirmingExit ? 'Na pewno? Ta próba przepadnie' : 'Przerwij i wróć na mapę';
    }

    function toggleMute() {
      settings.isMuted = !settings.isMuted;
      if (settings.isMuted) {
        game.speech.cancel();
      }
      game.applySettings();
      game.persist();
    }

    function update(dt, input) {
      const chosen = menu.update(input);
      if ((chosen && chosen.id === 'resume') || input.wasPressed('back')) {
        game.scenes.popOverlay(overlay);
      } else if (chosen && chosen.id === 'sound') {
        toggleMute();
      } else if (chosen && chosen.id === 'exit' && isConfirmingExit) {
        game.show('map');
      } else if (chosen && chosen.id === 'exit') {
        isConfirmingExit = true;
      }
      refreshLabels();
    }

    function render(ctx) {
      LM.ui.drawDimmer(ctx);
      LM.ui.drawTitledPanel(ctx, { x: 400, y: 190, width: 480, height: 320 }, 'Pauza');
      menu.render(ctx);
      LM.ui.drawKeyHintBar(ctx, [{ keys: ['↑', '↓'], label: 'wybór' }, { keys: ['Enter'], label: 'wybierz' }, { keys: ['Esc'], label: 'graj dalej' }]);
    }

    refreshLabels();
    return overlay;
  }

  LM.pauseOverlay = { createPauseOverlay };
}(window.LM = window.LM || {}));

</script>

<script>
// "Kto gra?": pick a player, create one (name + boy/girl for Polish verb forms) or delete one.
(function (LM) {
  'use strict';

  const MAX_PROFILES = 6;
  const MAX_NAME_LENGTH = 16;
  const PANEL = { x: 340, y: 130, width: 600, height: 470 };
  const NAME_FIELD = { x: 390, y: 300, width: 500, height: 56 };

  const ROOMY_ROWS = { itemHeight: 54, gap: 10, fontSize: 22 };
  // Six players plus "Nowy gracz" and "Usuń gracza" still fit inside the panel.
  const COMPACT_ROWS = { itemHeight: 40, gap: 8, fontSize: 20 };

  function menuLayout(game, itemCount) {
    const rows = itemCount > 6 ? COMPACT_ROWS : ROOMY_ROWS;
    return Object.assign({ x: 380, y: 200, width: 520, playSound: game.sfx }, rows);
  }

  function profileLabel(profile) {
    const passed = profile.progress.passedMissions.length;
    const examMark = profile.progress.isExamPassed ? '  ★' : '';
    return profile.name + '  ·  misje ' + passed + '/' + LM.data.missions.length + examMark;
  }

  function createProfilesScene(game) {
    let elapsed = 0;
    let panel = null;

    function useProfile(profile) {
      game.save.activeProfileId = profile.id;
      game.persist();
      game.applySettings();
      game.show('map');
    }

    function showProfileList() {
      const items = game.save.profiles.map(function (profile) { return { id: 'profile', label: profileLabel(profile), profile: profile }; });
      items.push({ id: 'new', label: 'Nowy gracz', isEnabled: game.save.profiles.length < MAX_PROFILES });
      if (game.save.profiles.length > 0) {
        items.push({ id: 'delete', label: 'Usuń gracza' });
      }
      const menu = LM.menu.createMenu(items, menuLayout(game, items.length));
      panel = {
        title: game.save.profiles.length > 0 ? 'Kto gra?' : 'Witaj w Labiryncie Mitów!',
        update: function (input) {
          const chosen = menu.update(input);
          if (!chosen) {
            return;
          }
          if (chosen.id === 'profile') {
            useProfile(chosen.profile);
          } else if (chosen.id === 'new') {
            showNameEntry();
          } else {
            showDeletePicker();
          }
        },
        render: menu.render,
      };
    }

    function showNameEntry() {
      game.textInput.show(NAME_FIELD, {
        placeholder: 'Wpisz imię…',
        maxLength: MAX_NAME_LENGTH,
        onSubmit: function (text) {
          if (text.trim().length > 0) {
            game.textInput.hide();
            game.sfx('choose');
            showGenderChoice(text.trim());
          }
        },
        onCancel: function () {
          game.textInput.hide();
          game.sfx('back');
          showProfileList();
        },
      });
      panel = {
        title: 'Nowy gracz',
        update: function () { game.textInput.keepFocus(); },
        render: function (ctx) {
          LM.text.drawWrappedText(ctx, 'Jak masz na imię?', 640, 260, 520, {
            font: LM.text.boldFont(26), color: LM.palette.ink, lineHeight: 32, align: 'center',
          });
          LM.text.drawWrappedText(ctx, 'Wpisz imię i naciśnij Enter. Esc wraca.', 640, 410, 520, {
            font: LM.text.regularFont(18), color: LM.palette.inkSoft, lineHeight: 24, align: 'center',
          });
        },
      };
    }

    function showGenderChoice(name) {
      const items = [
        { id: 'boy', label: 'Gram jako chłopak' },
        { id: 'girl', label: 'Gram jako dziewczyna' },
        { id: 'back', label: 'Wróć' },
      ];
      const menu = LM.menu.createMenu(items, Object.assign(menuLayout(game, 3), { y: 300 }));
      panel = {
        title: 'Cześć, ' + name + '!',
        update: function (input) {
          const chosen = menu.update(input);
          if (chosen && chosen.id === 'back') {
            showNameEntry();
          } else if (chosen) {
            useProfile(LM.profiles.createProfile(game.save, name, chosen.id, new Date().toISOString()));
          }
        },
        render: function (ctx) {
          LM.text.drawWrappedText(ctx, 'Gra będzie się do ciebie zwracać we właściwej formie (np. „zdobyłeś” albo „zdobyłaś”).', 640, 230, 520, {
            font: LM.text.regularFont(19), color: LM.palette.ink, lineHeight: 26, align: 'center',
          });
          menu.render(ctx);
        },
      };
    }

    function showDeletePicker() {
      const items = game.save.profiles.map(function (profile) { return { id: 'profile', label: profile.name, profile: profile }; });
      items.push({ id: 'cancel', label: 'Anuluj' });
      const menu = LM.menu.createMenu(items, menuLayout(game, items.length));
      panel = {
        title: 'Którego gracza usunąć?',
        update: function (input) {
          const chosen = menu.update(input);
          if (chosen && chosen.id === 'profile') {
            showDeleteConfirmation(chosen.profile);
          } else if (chosen || input.wasPressed('back')) {
            showProfileList();
          }
        },
        render: menu.render,
      };
    }

    function showDeleteConfirmation(profile) {
      const items = [{ id: 'keep', label: 'Nie, zostaw' }, { id: 'delete', label: 'Tak, usuń' }];
      const menu = LM.menu.createMenu(items, Object.assign(menuLayout(game, 2), { y: 340 }));
      panel = {
        title: 'Usunąć gracza?',
        update: function (input) {
          const chosen = menu.update(input);
          if (chosen && chosen.id === 'delete') {
            LM.profiles.deleteProfile(game.save, profile.id);
            game.persist();
          }
          if (chosen || input.wasPressed('back')) {
            showProfileList();
          }
        },
        render: function (ctx) {
          LM.text.drawWrappedText(ctx, 'Gracz „' + profile.name + '” i cały jego postęp znikną na zawsze.', 640, 250, 520, {
            font: LM.text.regularFont(21), color: LM.palette.ink, lineHeight: 28, align: 'center',
          });
          menu.render(ctx);
        },
      };
    }

    function render(ctx) {
      LM.scenery.drawSunsetCoast(ctx, elapsed);
      LM.ui.drawTitledPanel(ctx, PANEL, panel.title);
      panel.render(ctx);
      if (!game.saveStore.isPersistent()) {
        LM.ui.drawShadowText(ctx, 'Uwaga: ta przeglądarka nie pozwala zapisać postępu.', 640, 640, 18, '#ffd0c0', 'center');
      }
    }

    showProfileList();

    return {
      update: function (dt, input) {
        elapsed += dt;
        panel.update(input);
      },
      render: render,
      exit: function () { game.textInput.hide(); },
    };
  }

  LM.sceneFactories.profiles = createProfilesScene;
}(window.LM = window.LM || {}));

</script>
<script>
// Volumes, mute, narration and full screen. ←/→ change the selected setting, Enter toggles, Esc returns.
(function (LM) {
  'use strict';

  const VOLUME_STEP = 0.1;
  const VOLUME_SETTINGS = { music: 'musicVolume', sfx: 'sfxVolume', voice: 'voiceVolume' };

  function percentLabel(value) {
    return '◄  ' + Math.round(value * 100) + '%  ►';
  }

  function isFullscreen() {
    return Boolean(document.fullscreenElement);
  }

  function toggleFullscreen() {
    if (isFullscreen()) {
      document.exitFullscreen();
    } else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen();
    }
  }

  function createSettingsScene(game) {
    const settings = game.profile().settings;
    let elapsed = 0;
    const items = [
      { id: 'music', label: '' },
      { id: 'sfx', label: '' },
      { id: 'voice', label: '' },
      { id: 'mute', label: '' },
      { id: 'narration', label: '' },
      { id: 'fullscreen', label: '' },
      { id: 'back', label: 'Wróć' },
    ];
    const menu = LM.menu.createMenu(items, { x: 300, y: 180, width: 680, itemHeight: 50, gap: 10, fontSize: 22, playSound: game.sfx });

    function refreshLabels() {
      items[0].label = 'Muzyka:  ' + percentLabel(settings.musicVolume);
      items[1].label = 'Efekty dźwiękowe:  ' + percentLabel(settings.sfxVolume);
      items[2].label = 'Lektor i śpiew:  ' + percentLabel(settings.voiceVolume);
      items[3].label = 'Wszystkie dźwięki wyciszone:  ' + (settings.isMuted ? 'TAK' : 'NIE');
      items[4].label = 'Lektor czyta opowieści:  ' + (settings.isNarrationEnabled ? 'TAK' : 'NIE');
      items[5].label = isFullscreen() ? 'Wyłącz pełny ekran' : 'Włącz pełny ekran';
    }

    function changeVolume(itemId, direction) {
      const key = VOLUME_SETTINGS[itemId];
      const changed = Math.round((settings[key] + direction * VOLUME_STEP) * 10) / 10;
      settings[key] = Math.min(1, Math.max(0, changed));
      game.applySettings();
      game.sfx('move');
    }

    function leave() {
      game.persist();
      game.show('map');
    }

    function update(dt, input) {
      elapsed += dt;
      const selected = menu.selectedItem();
      if (VOLUME_SETTINGS[selected.id] && input.wasPressed('left')) {
        changeVolume(selected.id, -1);
      }
      if (VOLUME_SETTINGS[selected.id] && input.wasPressed('right')) {
        changeVolume(selected.id, 1);
      }
      const chosen = menu.update(input);
      if (chosen && chosen.id === 'mute') {
        settings.isMuted = !settings.isMuted;
        game.applySettings();
      } else if (chosen && chosen.id === 'narration') {
        settings.isNarrationEnabled = !settings.isNarrationEnabled;
      } else if (chosen && chosen.id === 'fullscreen') {
        toggleFullscreen();
      } else if ((chosen && chosen.id === 'back') || input.wasPressed('back')) {
        leave();
      }
      refreshLabels();
    }

    function render(ctx) {
      LM.scenery.drawSunsetCoast(ctx, elapsed);
      LM.ui.drawTitledPanel(ctx, { x: 260, y: 110, width: 760, height: 500 }, 'Ustawienia');
      menu.render(ctx);
      LM.ui.drawKeyHintBar(ctx, [
        { keys: ['↑', '↓'], label: 'wybór' },
        { keys: ['←', '→'], label: 'zmiana' },
        { keys: ['Enter'], label: 'przełącz' },
        { keys: ['Esc'], label: 'wróć' },
      ]);
    }

    refreshLabels();
    return { update, render };
  }

  LM.sceneFactories.settings = createSettingsScene;
}(window.LM = window.LM || {}));

</script>
<script>
// The hub: a map of the myths. Pick a destination (←/→ or the mouse), and the ship sails there to start
// the mission. Locked destinations hide in fog. Hovering any place shows a fact about it. Esc opens the menu.
(function (LM) {
  'use strict';

  const P = LM.palette;
  const MP = LM.mapPainter;
  const VOYAGE_SECONDS = 1.6;
  const DESTINATIONS = [
    { placeId: 'crete', icon: 'labyrinth' },
    { placeId: 'icaria', icon: 'wings' },
    { placeId: 'thrace', icon: 'lute' },
    { placeId: 'delphi', icon: 'oracle' },
  ];
  const INFO_PANEL = { x: 16, y: 516, width: 600, height: 136 };

  function isPlainPlace(place) {
    return !place.missionId && !place.isExam;
  }

  function placeById(placeId) {
    return LM.data.mapPlaces.find(function (place) { return place.id === placeId; });
  }

  // 'locked' | 'open' | 'passed'
  function destinationStatus(profile, destination) {
    const place = placeById(destination.placeId);
    if (place.isExam) {
      if (profile.progress.isExamPassed) {
        return 'passed';
      }
      return LM.profiles.isExamUnlocked(profile) ? 'open' : 'locked';
    }
    if (LM.profiles.hasPassedMission(profile, place.missionId)) {
      return 'passed';
    }
    return LM.profiles.isMissionUnlocked(profile, place.missionId) ? 'open' : 'locked';
  }

  function destinationTitle(place) {
    if (place.isExam) {
      return 'Egzamin: ' + LM.data.exam.title;
    }
    const mission = LM.missions.byId(place.missionId);
    return 'Misja ' + mission.number + ': ' + mission.title;
  }

  const STATUS_TEXT = { locked: 'Zasnute mgłą: najpierw zalicz poprzednią misję.', open: 'Gotowe do wyprawy! Enter: płyniemy.', passed: '✔ Zaliczone. Możesz zagrać jeszcze raz.' };

  function createMapScene(game) {
    const profile = game.profile();
    let selectedIndex = Math.max(0, DESTINATIONS.findIndex(function (destination) { return destinationStatus(profile, destination) === 'open'; }));
    let hoveredPlace = null;
    let voyage = null;
    let message = null;
    let elapsed = 0;

    function shipPlace() {
      return placeById(game.shipPlaceId || LM.data.mapStart);
    }

    function setSail(destination) {
      voyage = { from: shipPlace(), to: placeById(destination.placeId), progress: 0 };
      game.sfx('choose');
    }

    function arrive() {
      game.shipPlaceId = voyage.to.id;
      if (voyage.to.isExam) {
        game.startExam();
      } else {
        game.startMission(voyage.to.missionId);
      }
    }

    function choose(destination) {
      if (destinationStatus(profile, destination) === 'locked') {
        message = { text: 'Ta wyprawa jest jeszcze zasnuta mgłą. Najpierw zalicz poprzednią misję!', seconds: 2.5 };
        game.sfx('back');
        return;
      }
      setSail(destination);
    }

    function placeAtPointer(pointer) {
      return LM.data.mapPlaces.find(function (place) { return Math.hypot(pointer.x - place.x, pointer.y - place.y) < 34; }) || null;
    }

    function updatePointer(pointer) {
      if (pointer.hasMoved) {
        hoveredPlace = placeAtPointer(pointer);
      }
      const destinationIndex = hoveredPlace ? DESTINATIONS.findIndex(function (destination) { return destination.placeId === hoveredPlace.id; }) : -1;
      if (destinationIndex >= 0) {
        selectedIndex = destinationIndex;
      }
      if (pointer.wasPressed && destinationIndex >= 0) {
        choose(DESTINATIONS[destinationIndex]);
      }
    }

    function updateSelection(input) {
      const step = input.pressedStep('left', 'right') + input.pressedStep('up', 'down');
      if (step !== 0) {
        selectedIndex = (selectedIndex + step + DESTINATIONS.length) % DESTINATIONS.length;
        hoveredPlace = null;
        game.sfx('move');
      }
      if (input.wasPressed('confirm')) {
        choose(DESTINATIONS[selectedIndex]);
      }
    }

    function update(dt, input) {
      elapsed += dt;
      message = LM.timed.tick(message, dt);
      if (voyage) {
        voyage.progress += dt / VOYAGE_SECONDS;
        if (voyage.progress >= 1) {
          arrive();
        }
        return;
      }
      if (input.wasPressed('back')) {
        game.scenes.pushOverlay(LM.mapMenu.createMapMenuOverlay(game));
        return;
      }
      updateSelection(input);
      updatePointer(input.pointer);
    }

    function shipPosition() {
      if (!voyage) {
        return shipPlace();
      }
      const t = Math.min(1, voyage.progress);
      const bend = Math.sin(t * Math.PI) * 40;
      return { x: voyage.from.x + (voyage.to.x - voyage.from.x) * t, y: voyage.from.y + (voyage.to.y - voyage.from.y) * t - bend };
    }

    function drawDestinations(ctx) {
      DESTINATIONS.forEach(function (destination, index) {
        const place = placeById(destination.placeId);
        const status = destinationStatus(profile, destination);
        MP.drawMedallion(ctx, place.x, place.y, destination.icon, index === selectedIndex ? 'selected' : 'idle', elapsed);
        MP.drawDestinationLabel(ctx, place);
        if (status === 'locked') {
          MP.drawFog(ctx, place.x, place.y, elapsed);
        } else if (status === 'passed') {
          LM.draw.drawOutlinedCircle(ctx, place.x + 26, place.y - 24, 12, P.correct, 2);
          LM.text.drawTextLine(ctx, '✔', place.x + 26, place.y - 18, { font: LM.text.boldFont(15), color: P.white, align: 'center' });
        }
      });
    }

    function drawInfoPanel(ctx) {
      const isDestinationInfo = !hoveredPlace || hoveredPlace.missionId || hoveredPlace.isExam;
      const place = isDestinationInfo ? placeById(DESTINATIONS[selectedIndex].placeId) : hoveredPlace;
      LM.ui.drawParchmentPanel(ctx, INFO_PANEL);
      const title = isDestinationInfo ? place.name + ' · ' + destinationTitle(place) : place.name;
      LM.text.drawTextLine(ctx, title, INFO_PANEL.x + 18, INFO_PANEL.y + 30, { font: LM.text.boldFont(20), color: P.ink });
      let y = INFO_PANEL.y + 58;
      if (isDestinationInfo) {
        LM.text.drawTextLine(ctx, STATUS_TEXT[destinationStatus(profile, DESTINATIONS[selectedIndex])], INFO_PANEL.x + 18, y, { font: LM.text.boldFont(16), color: '#a8500a' });
        y += 24;
      }
      LM.text.drawWrappedText(ctx, place.fact, INFO_PANEL.x + 18, y, INFO_PANEL.width - 36, { font: LM.text.regularFont(17), color: P.inkSoft, lineHeight: 22 });
    }

    function render(ctx) {
      MP.drawMapBase(ctx, elapsed);
      LM.data.mapPlaces.filter(isPlainPlace).forEach(function (place) {
        MP.drawPlaceLabel(ctx, place, place === hoveredPlace ? 'highlighted' : 'normal');
      });
      drawDestinations(ctx);
      const ship = shipPosition();
      LM.scenery.drawShip(ctx, ship.x + 34, ship.y + 40, 0.3, '#f4eee0', elapsed);
      drawInfoPanel(ctx);
      if (message) {
        LM.ui.drawStoryBanner(ctx, message.text);
      }
      const earned = Object.keys(profile.achievements).length;
      LM.ui.drawHud(ctx, { title: game.say('Mapa mitów · ' + profile.name), rightText: '★ ' + earned + '/' + LM.data.achievements.length });
      LM.ui.drawKeyHintBar(ctx, [
        { keys: ['←', '→'], label: 'wybierz wyprawę' },
        { keys: ['Enter'], label: 'płyń' },
        { keys: ['Esc'], label: 'menu' },
      ], 'Najedź myszą na miejsce: ciekawostka');
    }

    return {
      enter: function () { game.playTheme('map'); },
      update: update,
      render: render,
    };
  }

  LM.sceneFactories.map = createMapScene;
}(window.LM = window.LM || {}));

</script>

<script>
// Story pages: a picture, the text typed out letter by letter and read aloud. Enter = next, ← = back, Esc = skip all.
(function (LM) {
  'use strict';

  const P = LM.palette;
  const TEXT_PANEL = { x: 40, y: 486, width: 1200, height: 164 };
  const TEXT_STYLE = { font: LM.text.regularFont(24), color: P.ink, lineHeight: 32 };
  const LETTERS_PER_SECOND = 55;

  // Wraps the whole text first, so words do not jump between lines while they are being typed.
  function drawTypedText(ctx, fullText, letterCount) {
    const width = TEXT_PANEL.width - 56;
    let budget = Math.floor(letterCount);
    LM.text.wrapText(ctx, fullText, width, TEXT_STYLE.font).forEach(function (line, index) {
      if (budget > 0) {
        LM.text.drawTextLine(ctx, line.slice(0, budget), TEXT_PANEL.x + 28, TEXT_PANEL.y + 44 + index * TEXT_STYLE.lineHeight, TEXT_STYLE);
      }
      budget -= line.length + 1;
    });
  }

  function drawSpeakerLabel(ctx, label) {
    const font = LM.text.boldFont(20);
    const width = LM.text.measureTextWidth(ctx, label, font) + 36;
    LM.draw.drawOutlinedRoundRect(ctx, { x: TEXT_PANEL.x + 24, y: TEXT_PANEL.y - 22, width: width, height: 36 }, 8, P.titleBarTop, 3);
    LM.text.drawTextLine(ctx, label, TEXT_PANEL.x + 42, TEXT_PANEL.y + 4, { font: font, color: P.white, shadowColor: P.textShadow });
  }

  // params: { title, pages, onFinished(wasSkipped) }
  function createCutsceneScene(game, params) {
    const pages = params.pages;
    let pageIndex = 0;
    let elapsed = 0;
    let lettersShown = 0;
    let shownText = '';

    function showPage(index) {
      pageIndex = index;
      lettersShown = 0;
      shownText = game.say(pages[pageIndex].text);
      game.narrate(shownText, pages[pageIndex].speaker);
    }

    function isOnLastPage() {
      return pageIndex === pages.length - 1;
    }

    function isPageFullyShown() {
      return lettersShown >= shownText.length;
    }

    function goForward() {
      if (!isPageFullyShown()) {
        lettersShown = shownText.length;
      } else if (!isOnLastPage()) {
        game.sfx('page');
        showPage(pageIndex + 1);
      } else {
        params.onFinished(false);
      }
    }

    function update(dt, input) {
      elapsed += dt;
      lettersShown = Math.min(shownText.length, lettersShown + dt * LETTERS_PER_SECOND);
      if (input.wasPressed('back')) {
        params.onFinished(!isOnLastPage());
      } else if (input.wasPressed('left') && pageIndex > 0) {
        game.sfx('page');
        showPage(pageIndex - 1);
      } else if (input.wasPressed('confirm') || input.wasPressed('right') || input.pointer.wasPressed) {
        goForward();
      }
    }

    function render(ctx) {
      LM.illustrations[pages[pageIndex].illustration](ctx, elapsed);
      LM.ui.drawHud(ctx, { title: params.title, rightText: (pageIndex + 1) + '/' + pages.length });
      LM.ui.drawParchmentPanel(ctx, TEXT_PANEL);
      const speaker = LM.data.voices[pages[pageIndex].speaker];
      if (speaker && speaker.label) {
        drawSpeakerLabel(ctx, speaker.label);
      }
      drawTypedText(ctx, shownText, lettersShown);
      LM.ui.drawKeyHintBar(ctx, [
        { keys: ['Enter'], label: 'dalej' },
        { keys: ['←'], label: 'wstecz' },
        { keys: ['Esc'], label: 'pomiń opowieść' },
      ]);
    }

    return {
      enter: function () { showPage(0); },
      update: update,
      render: render,
    };
  }

  LM.sceneFactories.cutscene = createCutsceneScene;
}(window.LM = window.LM || {}));

</script>
