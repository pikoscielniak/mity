<script>
// Compact melody notation: "D4/8 E4/8. r/4 F#4/2" — pitch (or r for rest), slash, note value, optional dot.
(function (LM) {
  'use strict';

  const SEMITONES_FROM_C = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const ACCIDENTAL_SHIFT = { '': 0, '#': 1, b: -1 };
  const parsedCache = new Map();

  function noteNameToMidi(name) {
    const match = /^([A-G])([#b]?)(-?\d)$/.exec(name);
    if (!match) {
      throw new Error('Unknown note name: ' + name);
    }
    const octave = Number(match[3]);
    return 12 * (octave + 1) + SEMITONES_FROM_C[match[1]] + ACCIDENTAL_SHIFT[match[2]];
  }

  function midiToFrequency(midi) {
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  // Quarter note = 1 beat; "/8" = 0.5 beat; a trailing dot adds half the value.
  function noteValueToBeats(value) {
    const isDotted = value.endsWith('.');
    const denominator = Number(isDotted ? value.slice(0, -1) : value);
    if (!denominator) {
      throw new Error('Unknown note value: ' + value);
    }
    const beats = 4 / denominator;
    return isDotted ? beats * 1.5 : beats;
  }

  function parseToken(token) {
    const parts = token.split('/');
    if (parts.length !== 2) {
      throw new Error('Bad note token: ' + token);
    }
    const isRest = parts[0] === 'r';
    return { midi: isRest ? null : noteNameToMidi(parts[0]), beats: noteValueToBeats(parts[1]) };
  }

  function parseNoteString(text) {
    if (!parsedCache.has(text)) {
      const tokens = text.split(/\s+/).filter(function (token) { return token && token !== '|'; });
      parsedCache.set(text, tokens.map(parseToken));
    }
    return parsedCache.get(text);
  }

  function totalBeats(notes) {
    return notes.reduce(function (sum, note) { return sum + note.beats; }, 0);
  }

  function repeatPattern(pattern, times) {
    return new Array(times).fill(pattern).join(' ');
  }

  LM.notes = { noteNameToMidi, midiToFrequency, noteValueToBeats, parseNoteString, totalBeats, repeatPattern };
}(window.LM = window.LM || {}));

</script>
<script>
// Saves the game in localStorage. Any storage failure (private mode, file:// restrictions) falls back to memory.
(function (LM) {
  'use strict';

  const SAVE_KEY = 'labiryntMitow.save';
  const BACKUP_KEY = 'labiryntMitow.save.backup';
  const CURRENT_VERSION = 1;

  function emptySave() {
    return { version: CURRENT_VERSION, activeProfileId: null, profiles: [] };
  }

  function isUsableSave(data) {
    return Boolean(data) && typeof data === 'object' && Array.isArray(data.profiles);
  }

  // Future save formats add their upgrade steps here, oldest first.
  function migrateSave(data) {
    if (!isUsableSave(data) || data.version !== CURRENT_VERSION) {
      return emptySave();
    }
    return data;
  }

  function createSaveStore(storageLike) {
    let isPersistent = Boolean(storageLike);

    function keepCorruptCopy(text) {
      try {
        storageLike.setItem(BACKUP_KEY, text);
      } catch (error) {
        isPersistent = false;
      }
    }

    function load() {
      if (!isPersistent) {
        return emptySave();
      }
      let text = null;
      try {
        text = storageLike.getItem(SAVE_KEY);
      } catch (error) {
        isPersistent = false;
        return emptySave();
      }
      if (!text) {
        return emptySave();
      }
      try {
        return migrateSave(JSON.parse(text));
      } catch (error) {
        keepCorruptCopy(text);
        return emptySave();
      }
    }

    function save(data) {
      if (!isPersistent) {
        return;
      }
      try {
        storageLike.setItem(SAVE_KEY, JSON.stringify(data));
      } catch (error) {
        isPersistent = false;
      }
    }

    return { load, save, isPersistent: function () { return isPersistent; } };
  }

  LM.storage = { SAVE_KEY, CURRENT_VERSION, emptySave, migrateSave, createSaveStore };
}(window.LM = window.LM || {}));

</script>

<script>
// Seedable random numbers (mulberry32), so a debug run with ?seed= replays the same question draw.
(function (LM) {
  'use strict';

  function createRng(seed) {
    let state = seed >>> 0;
    return function next() {
      state = (state + 0x6D2B79F5) | 0;
      let mixed = Math.imul(state ^ (state >>> 15), 1 | state);
      mixed = (mixed + Math.imul(mixed ^ (mixed >>> 7), 61 | mixed)) ^ mixed;
      return ((mixed ^ (mixed >>> 14)) >>> 0) / 4294967296;
    };
  }

  function randomSeed() {
    return Math.floor(Math.random() * 4294967296);
  }

  function swap(items, first, second) {
    const temporary = items[first];
    items[first] = items[second];
    items[second] = temporary;
  }

  function shuffle(items, rng) {
    const shuffled = items.slice();
    for (let index = shuffled.length - 1; index > 0; index -= 1) {
      swap(shuffled, index, Math.floor(rng() * (index + 1)));
    }
    return shuffled;
  }

  // A shuffle that is not already in the right order, so an ordering puzzle never starts solved.
  function shuffledOutOfOrder(itemsInOrder, rng) {
    let shuffled = itemsInOrder.slice();
    for (let tries = 0; tries < 10; tries += 1) {
      shuffled = shuffle(itemsInOrder, rng);
      if (shuffled.some(function (item, index) { return item !== itemsInOrder[index]; })) {
        break;
      }
    }
    return shuffled;
  }

  function pickSome(items, count, rng) {
    return shuffle(items, rng).slice(0, count);
  }

  LM.random = { createRng, randomSeed, swap, shuffle, shuffledOutOfOrder, pickSome };
}(window.LM = window.LM || {}));

</script>
<script>
// Comparing typed answers: case, Polish diacritics and small typos must not matter.
(function (LM) {
  'use strict';

  // "Łódź" → "lodz". NFD splits most accented letters; ł has no decomposition, so it is mapped by hand.
  function normalizeAnswerText(text) {
    return String(text)
      .toLowerCase()
      .normalize('NFD')
      .replace(/[̀-ͯ]/g, '')
      .replace(/ł/g, 'l')
      .replace(/[^a-z0-9 ]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function levenshteinDistance(first, second) {
    let previousRow = Array.from({ length: second.length + 1 }, function (unused, index) { return index; });
    for (let row = 1; row <= first.length; row += 1) {
      const currentRow = [row];
      for (let column = 1; column <= second.length; column += 1) {
        const substitutionCost = first[row - 1] === second[column - 1] ? 0 : 1;
        currentRow.push(Math.min(
          previousRow[column] + 1,
          currentRow[column - 1] + 1,
          previousRow[column - 1] + substitutionCost
        ));
      }
      previousRow = currentRow;
    }
    return previousRow[second.length];
  }

  // Short words must be exact ("Styks" vs "Stos"); longer ones forgive one or two slips.
  function allowedTypos(answerLength) {
    if (answerLength <= 4) {
      return 0;
    }
    return answerLength <= 8 ? 1 : 2;
  }

  function isCloseEnough(typedText, acceptedText) {
    const typed = normalizeAnswerText(typedText);
    const accepted = normalizeAnswerText(acceptedText);
    return levenshteinDistance(typed, accepted) <= allowedTypos(accepted.length);
  }

  LM.textNormalize = { normalizeAnswerText, levenshteinDistance, allowedTypos, isCloseEnough };
}(window.LM = window.LM || {}));

</script>
<script>
// Things shown for a while, like a warning: { text, seconds } that disappears when its time runs out.
(function (LM) {
  'use strict';

  // Returns the same object while time is left, otherwise null.
  function tick(timed, dt) {
    if (!timed) {
      return null;
    }
    timed.seconds -= dt;
    return timed.seconds > 0 ? timed : null;
  }

  LM.timed = { tick };
}(window.LM = window.LM || {}));

</script>
<script>
(function (LM) {
  'use strict';

  const WIDTH = 1280;
  const HEIGHT = 720;

  function createCanvasView(canvas, hostWindow) {
    const ctx = canvas.getContext('2d');

    function fitToWindow() {
      const scale = Math.min(hostWindow.innerWidth / WIDTH, hostWindow.innerHeight / HEIGHT);
      const cssWidth = Math.floor(WIDTH * scale);
      const cssHeight = Math.floor(HEIGHT * scale);
      const pixelRatio = hostWindow.devicePixelRatio || 1;
      canvas.style.width = cssWidth + 'px';
      canvas.style.height = cssHeight + 'px';
      canvas.width = Math.round(cssWidth * pixelRatio);
      canvas.height = Math.round(cssHeight * pixelRatio);
    }

    function beginFrame() {
      ctx.setTransform(canvas.width / WIDTH, 0, 0, canvas.height / HEIGHT, 0, 0);
      ctx.clearRect(0, 0, WIDTH, HEIGHT);
    }

    function toLogicalPoint(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * WIDTH / rect.width,
        y: (clientY - rect.top) * HEIGHT / rect.height,
      };
    }

    function logicalRectToCss(logicalRect) {
      const rect = canvas.getBoundingClientRect();
      const scale = rect.width / WIDTH;
      return {
        left: rect.left + logicalRect.x * scale,
        top: rect.top + logicalRect.y * scale,
        width: logicalRect.width * scale,
        height: logicalRect.height * scale,
        scale: scale,
      };
    }

    fitToWindow();
    hostWindow.addEventListener('resize', fitToWindow);

    return { canvas, ctx, beginFrame, toLogicalPoint, logicalRectToCss, fitToWindow };
  }

  LM.view = { WIDTH, HEIGHT, createCanvasView };
}(window.LM = window.LM || {}));

</script>
<script>
(function (LM) {
  'use strict';

  const STEP_SECONDS = 1 / 60;
  const MAX_FRAME_SECONDS = 0.25;

  // Fixed-step updates keep mini-game physics identical on 60 Hz and 144 Hz screens.
  function startGameLoop(update, render) {
    let lastSeconds = null;
    let accumulator = 0;

    function frame(nowMs) {
      const nowSeconds = nowMs / 1000;
      const elapsed = lastSeconds === null ? 0 : nowSeconds - lastSeconds;
      lastSeconds = nowSeconds;
      accumulator += Math.min(elapsed, MAX_FRAME_SECONDS);
      while (accumulator >= STEP_SECONDS) {
        update(STEP_SECONDS);
        accumulator -= STEP_SECONDS;
      }
      render();
      window.requestAnimationFrame(frame);
    }

    window.requestAnimationFrame(frame);
  }

  LM.loop = { STEP_SECONDS, startGameLoop };
}(window.LM = window.LM || {}));

</script>
<script>
(function (LM) {
  'use strict';

  const KEY_ACTIONS = {
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    Enter: 'confirm', NumpadEnter: 'confirm', Space: 'confirm',
    Escape: 'back',
    KeyH: 'hint',
    Digit1: 'option1', Numpad1: 'option1',
    Digit2: 'option2', Numpad2: 'option2',
    Digit3: 'option3', Numpad3: 'option3',
    Digit4: 'option4', Numpad4: 'option4',
    Digit5: 'option5', Numpad5: 'option5',
    Digit6: 'option6', Numpad6: 'option6',
  };

  const OPTION_ACTIONS = ['option1', 'option2', 'option3', 'option4', 'option5', 'option6'];

  function isTextField(target) {
    return Boolean(target) && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA');
  }

  function createInput(view, hostWindow) {
    const heldActions = new Set();
    const pressedActions = new Set();
    const pointer = { x: 0, y: 0, isDown: false, wasPressed: false, wasReleased: false, hasMoved: false };
    let anyKeyWasPressed = false;

    function onKeyDown(event) {
      if (isTextField(event.target)) {
        return;
      }
      const action = KEY_ACTIONS[event.code];
      if (!event.repeat) {
        anyKeyWasPressed = true;
      }
      if (!action) {
        return;
      }
      event.preventDefault();
      if (!event.repeat) {
        pressedActions.add(action);
      }
      heldActions.add(action);
    }

    function onKeyUp(event) {
      const action = KEY_ACTIONS[event.code];
      if (action) {
        heldActions.delete(action);
      }
    }

    function movePointer(event) {
      const point = view.toLogicalPoint(event.clientX, event.clientY);
      pointer.x = point.x;
      pointer.y = point.y;
    }

    function onPointerDown(event) {
      movePointer(event);
      pointer.isDown = true;
      pointer.wasPressed = true;
      pointer.hasMoved = true;
    }

    function onPointerMove(event) {
      movePointer(event);
      pointer.hasMoved = true;
    }

    function onPointerUp(event) {
      movePointer(event);
      pointer.isDown = false;
      pointer.wasReleased = true;
    }

    hostWindow.addEventListener('keydown', onKeyDown);
    hostWindow.addEventListener('keyup', onKeyUp);
    hostWindow.addEventListener('blur', function () { heldActions.clear(); });
    view.canvas.addEventListener('pointerdown', onPointerDown);
    hostWindow.addEventListener('pointermove', onPointerMove);
    hostWindow.addEventListener('pointerup', onPointerUp);

    function pressedOptionIndex() {
      return OPTION_ACTIONS.findIndex(function (action) { return pressedActions.has(action); });
    }

    function endUpdate() {
      pressedActions.clear();
      anyKeyWasPressed = false;
      pointer.wasPressed = false;
      pointer.wasReleased = false;
      pointer.hasMoved = false;
    }

    // -1, 0 or 1 along an axis, e.g. pressedStep('left', 'right') for one step through a list.
    function pressedStep(negativeAction, positiveAction) {
      return (pressedActions.has(positiveAction) ? 1 : 0) - (pressedActions.has(negativeAction) ? 1 : 0);
    }

    function heldStep(negativeAction, positiveAction) {
      return (heldActions.has(positiveAction) ? 1 : 0) - (heldActions.has(negativeAction) ? 1 : 0);
    }

    return {
      pointer,
      isHeld: function (action) { return heldActions.has(action); },
      wasPressed: function (action) { return pressedActions.has(action); },
      pressedStep,
      heldStep,
      wasAnyKeyPressed: function () { return anyKeyWasPressed; },
      pressedOptionIndex,
      endUpdate,
    };
  }

  LM.input = { createInput, OPTION_ACTIONS };
}(window.LM = window.LM || {}));

</script>
<script>
(function (LM) {
  'use strict';

  // One base scene plus a stack of overlays (pause, question, hint). Only the top layer receives updates.
  // A layer may define cover()/uncover() to react when an overlay opens above it or closes again.
  function createSceneManager(game) {
    let baseScene = null;
    const overlays = [];

    function enter(layer) {
      if (layer.enter) {
        layer.enter(game);
      }
    }

    function exit(layer) {
      if (layer.exit) {
        layer.exit();
      }
    }

    function replaceScene(scene) {
      while (overlays.length > 0) {
        exit(overlays.pop());
      }
      if (baseScene) {
        exit(baseScene);
      }
      baseScene = scene;
      enter(scene);
    }

    function topLayer() {
      return overlays.length > 0 ? overlays[overlays.length - 1] : baseScene;
    }

    function pushOverlay(overlay) {
      const covered = topLayer();
      if (covered && covered.cover) {
        covered.cover();
      }
      overlays.push(overlay);
      enter(overlay);
    }

    function popOverlay(overlay) {
      const index = overlays.indexOf(overlay);
      if (index < 0) {
        return;
      }
      const wasOnTop = overlay === topLayer();
      overlays.splice(index, 1);
      exit(overlay);
      const uncovered = topLayer();
      if (wasOnTop && uncovered && uncovered.uncover) {
        uncovered.uncover();
      }
    }

    function update(dt, input) {
      const layer = topLayer();
      if (layer) {
        layer.update(dt, input);
      }
    }

    function render(ctx) {
      if (baseScene) {
        baseScene.render(ctx);
      }
      overlays.forEach(function (overlay) { overlay.render(ctx); });
    }

    return {
      replaceScene,
      pushOverlay,
      popOverlay,
      update,
      render,
      currentScene: function () { return baseScene; },
      topLayer,
    };
  }

  LM.sceneManager = { createSceneManager };
}(window.LM = window.LM || {}));

</script>
<script>
// A real HTML <input> laid over the canvas, so typing Polish letters (AltGr, IME, paste) just works.
(function (LM) {
  'use strict';

  const BASE_FONT_SIZE = 26;

  function noop() {}

  function createTextInputOverlay(view, element, hostWindow) {
    let request = null;

    function reposition() {
      if (!request) {
        return;
      }
      const css = view.logicalRectToCss(request.rect);
      element.style.left = css.left + 'px';
      element.style.top = css.top + 'px';
      element.style.width = css.width + 'px';
      element.style.height = css.height + 'px';
      element.style.fontSize = Math.round(BASE_FONT_SIZE * css.scale) + 'px';
    }

    function onKeyDown(event) {
      if (!request) {
        return;
      }
      if (event.key === 'Enter') {
        event.preventDefault();
        request.onSubmit(element.value);
      } else if (event.key === 'Escape') {
        event.preventDefault();
        request.onCancel();
      } else if (event.key === 'Tab') {
        event.preventDefault();
        request.onTab();
      }
    }

    element.addEventListener('keydown', onKeyDown);
    hostWindow.addEventListener('resize', reposition);

      request = { rect: rect, onSubmit: options.onSubmit, onCancel: options.onCancel || noop, onTab: options.onTab || noop };
      element.value = options.initialText || '';
      element.placeholder = options.placeholder || '';
      element.maxLength = options.maxLength || 40;
      element.hidden = false;
      reposition();
      element.focus();
    }

    function hide() {
      request = null;
      element.hidden = true;
      element.blur();
    }

    // Clicking the canvas steals focus; scenes call this every update while the field is shown.
    function keepFocus() {
      if (request && hostWindow.document.activeElement !== element) {
        element.focus();
      }

      show,
      hide,
      keepFocus,
      currentText: function () { return element.value; },

</script>

<script>
// Drawing primitives for the "colour phone game" look: banded gradients and outlined cartoon shapes.

  'use strict';

    const from = hexToRgb(fromHex);
    const to = hexToRgb(toHex);
    const mixed = from.map(function (channel, index) {
      return Math.round(channel + (to[index] - channel) * amount);

    return 'rgb(' + mixed.join(',') + ')';

        colors.push(mixColors(topColor, bottomColor, bandCount > 1 ? band / (bandCount - 1) : 0));

    ctx.beginPath();
    ctx.moveTo(rect.x + radius, rect.y);
    ctx.arcTo(right, rect.y, right, bottom, radius);
    ctx.arcTo(right, bottom, rect.x, bottom, radius);
    ctx.arcTo(rect.x, bottom, rect.x, rect.y, radius);
    ctx.arcTo(rect.x, rect.y, right, rect.y, radius);
    ctx.closePath();
  }

  function fillRoundRect(ctx, rect, radius, color) {
    roundRectPath(ctx, rect, radius);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function strokeOutline(ctx, outlineWidth) {
    if (outlineWidth > 0) {
      ctx.lineWidth = outlineWidth;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = LM.palette.outline;
      ctx.stroke();
    }

  function fillCircle(ctx, x, y, radius, color) {
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();

  function drawOutlinedCircle(ctx, x, y, radius, fillColor, outlineWidth) {
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fillStyle = fillColor;
    ctx.fill();
    strokeOutline(ctx, outlineWidth);
  }

  function drawOutlinedEllipse(ctx, x, y, radiusX, radiusY, fillColor, outlineWidth) {
    ctx.beginPath();
    ctx.ellipse(x, y, radiusX, radiusY, 0, 0, Math.PI * 2);
    ctx.fillStyle = fillColor;
    ctx.fill();
    strokeOutline(ctx, outlineWidth);
  }

  function polygonPath(ctx, points) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let index = 1; index < points.length; index += 1) {
      ctx.lineTo(points[index][0], points[index][1]);
    }
    ctx.closePath();
  }

  function drawOutlinedPolygon(ctx, points, fillColor, outlineWidth) {
    polygonPath(ctx, points);
    ctx.fillStyle = fillColor;
    ctx.fill();
    strokeOutline(ctx, outlineWidth);
  }

  function drawOutlinedRoundRect(ctx, rect, radius, fillColor, outlineWidth) {
    roundRectPath(ctx, rect, radius);
    ctx.fillStyle = fillColor;
    ctx.fill();
    strokeOutline(ctx, outlineWidth);
  }

  function drawStar(ctx, x, y, outerRadius, innerRadius, fillColor, outlineWidth) {
    const points = [];
    for (let corner = 0; corner < 10; corner += 1) {
      const radius = corner % 2 === 0 ? outerRadius : innerRadius;
      const angle = -Math.PI / 2 + corner * Math.PI / 5;
      points.push([x + Math.cos(angle) * radius, y + Math.sin(angle) * radius]);
    }
    drawOutlinedPolygon(ctx, points, fillColor, outlineWidth);
  }

  function drawLine(ctx, fromX, fromY, toX, toY, color, width) {
    ctx.beginPath();
    ctx.moveTo(fromX, fromY);
    ctx.lineTo(toX, toY);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    drawFn();
    ctx.restore();
  }

  LM.draw = {
    hexToRgb,
    mixColors,
    drawBandedGradient,
    roundRectPath,
    fillRoundRect,
    fillCircle,
    drawOutlinedCircle,
    drawOutlinedEllipse,

    drawOutlinedPolygon,
    drawOutlinedRoundRect,

<script>
(function (LM) {
  'use strict';

  const FONT_FAMILY = 'Verdana, Tahoma, sans-serif';
  const NO_BREAK_SPACE = ' ';
  const MAX_CACHED_WRAPS = 600;
  const wrapCache = new Map();

  function boldFont(size) {
    return 'bold ' + size + 'px ' + FONT_FAMILY;
  }

  function regularFont(size) {
    return size + 'px ' + FONT_FAMILY;
  }

  // Polish typography: a one-letter word (a, i, o, u, w, z) must not end a line.
  function glueOneLetterWords(text) {
    return text.replace(/(?<=^|[\s(„])([aiouwzAIOUWZ])\s+/g, '$1' + NO_BREAK_SPACE);
  }

  function splitLongWord(ctx, word, maxWidth) {
    const pieces = [];
    let piece = '';
    Array.from(word).forEach(function (character) {
      if (piece && ctx.measureText(piece + character).width > maxWidth) {
        pieces.push(piece);
        piece = '';
      }
      piece += character;
    });
    pieces.push(piece);
    return pieces;
  }

  function wrapParagraph(ctx, paragraph, maxWidth) {
    const lines = [];
    let line = '';
    glueOneLetterWords(paragraph).split(' ').forEach(function (rawWord) {
      const words = ctx.measureText(rawWord).width > maxWidth ? splitLongWord(ctx, rawWord, maxWidth) : [rawWord];
      words.forEach(function (word) {
        const candidate = line ? line + ' ' + word : word;
        if (line && ctx.measureText(candidate).width > maxWidth) {
          lines.push(line);
          line = word;
        } else {
          line = candidate;
        }
      });
    });
    lines.push(line);
    return lines;
  }

  function wrapText(ctx, text, maxWidth, font) {
    const key = font + '|' + maxWidth + '|' + text;
    if (wrapCache.has(key)) {
      return wrapCache.get(key);
    }
    ctx.font = font;
    const lines = [];
    String(text).split('\n').forEach(function (paragraph) {
      wrapParagraph(ctx, paragraph, maxWidth).forEach(function (line) { lines.push(line); });
    });
    if (wrapCache.size > MAX_CACHED_WRAPS) {
      wrapCache.clear();
    }
    wrapCache.set(key, lines);
    return lines;
  }

  function drawTextLine(ctx, text, x, y, style) {
    ctx.font = style.font;
    ctx.textAlign = style.align || 'left';
    ctx.textBaseline = 'alphabetic';
    if (style.shadowColor) {
      ctx.fillStyle = style.shadowColor;
      ctx.fillText(text, x + 2, y + 2);
    }
    ctx.fillStyle = style.color;
    ctx.fillText(text, x, y);
  }

  // `y` is the baseline of the first line. Returns the height taken by all lines.
  function drawWrappedText(ctx, text, x, y, maxWidth, style) {
    const lines = wrapText(ctx, text, maxWidth, style.font);
    lines.forEach(function (line, index) {
      drawTextLine(ctx, line, x, y + index * style.lineHeight, style);
    });
    return lines.length * style.lineHeight;
  }

  function measureWrappedHeight(ctx, text, maxWidth, style) {
    return wrapText(ctx, text, maxWidth, style.font).length * style.lineHeight;
  }

  function measureTextWidth(ctx, text, font) {
    ctx.font = font;
    return ctx.measureText(text).width;
  }

  LM.text = {
    FONT_FAMILY,
    boldFont,
    regularFont,
    glueOneLetterWords,
    wrapText,
    drawTextLine,
    drawWrappedText,
    measureWrappedHeight,
    measureTextWidth,
  };
}(window.LM = window.LM || {}));

<script>
(function (LM) {
  'use strict';

  const P = LM.palette;
  const HUD_HEIGHT = 56;
  const HINT_BAR_TOP = 664;
  const HINT_BAR_HEIGHT = 56;

  const BUTTON_COLORS = {
    normal: { top: P.buttonTop, bottom: P.buttonBottom, text: P.ink, edge: P.parchmentEdge },
    selected: { top: '#5a96f5', bottom: '#1a4fb8', text: P.white, edge: P.selectionDark },
    disabled: { top: '#e4e0d8', bottom: '#c8c2b6', text: '#8a8478', edge: '#8a8478' },
    correct: { top: '#7fd86a', bottom: '#2f9e44', text: P.white, edge: '#1d6a2c' },
    wrong: { top: '#ff8a70', bottom: '#c8281a', text: P.white, edge: '#7a160e' },
  };

  function isPointInRect(point, rect) {
    return point.x >= rect.x && point.x <= rect.x + rect.width &&
      point.y >= rect.y && point.y <= rect.y + rect.height;
  }

  function drawGlossyBar(ctx, rect, highlightEdge) {
    LM.draw.drawBandedGradient(ctx, rect, P.hudTop, P.hudBottom, 8);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.fillRect(rect.x, rect.y, rect.width, rect.height / 2);
    ctx.fillStyle = P.hudLine;
    const lineY = highlightEdge === 'top' ? rect.y : rect.y + rect.height - 2;
    ctx.fillRect(rect.x, lineY, rect.width, 2);
  }

  function heartPath(ctx) {
    ctx.beginPath();
    ctx.moveTo(0, 4);
    ctx.bezierCurveTo(0, 1, -5, -1, -5, -4);
    ctx.bezierCurveTo(-5, -7, -1, -8, 0, -5);
    ctx.bezierCurveTo(1, -8, 5, -7, 5, -4);
    ctx.bezierCurveTo(5, -1, 0, 1, 0, 4);
    ctx.closePath();
  }

  function drawHeart(ctx, x, y, scale, state) {
    LM.draw.withTransform(ctx, x, y, scale, function () {
      heartPath(ctx);
      ctx.fillStyle = state === 'full' ? P.heart : P.heartEmpty;
      ctx.fill();
      ctx.lineWidth = 0.6;
      ctx.strokeStyle = '#200810';
      ctx.stroke();
      if (state === 'full') {
        LM.draw.fillCircle(ctx, -2.6, -4.6, 0.9, P.heartShine);
      }
    });
  }

  function drawHearts(ctx, x, y, heartsLeft, heartsMax) {
    for (let index = 0; index < heartsMax; index += 1) {
      drawHeart(ctx, x + index * 40, y, 3.2, index < heartsLeft ? 'full' : 'empty');
    }
  }

  function drawShadowText(ctx, text, x, y, size, color, align) {
    LM.text.drawTextLine(ctx, text, x, y, {
      font: LM.text.boldFont(size), color: color, align: align, shadowColor: P.textShadow,
    });
  }

  // hud: { title, heartsLeft?, heartsMax?, rightText? }
  function drawHud(ctx, hud) {
    drawGlossyBar(ctx, { x: 0, y: 0, width: LM.view.WIDTH, height: HUD_HEIGHT }, 'bottom');
    if (hud.heartsMax) {
      drawHearts(ctx, 36, 30, hud.heartsLeft, hud.heartsMax);
    }
    drawShadowText(ctx, hud.title, LM.view.WIDTH / 2, 37, 24, P.white, 'center');
    if (hud.rightText) {
      drawShadowText(ctx, hud.rightText, LM.view.WIDTH - 24, 37, 22, P.gold, 'right');
    }
  }

  function drawKeyCap(ctx, x, y, label) {
    const font = LM.text.boldFont(16);
    const width = Math.max(30, LM.text.measureTextWidth(ctx, label, font) + 18);
    LM.draw.fillRoundRect(ctx, { x: x, y: y + 4, width: width, height: 26 }, 6, P.keyCapSide);
    LM.draw.fillRoundRect(ctx, { x: x, y: y, width: width, height: 26 }, 6, P.keyCap);
    LM.text.drawTextLine(ctx, label, x + width / 2, y + 19, { font: font, color: P.keyCapText, align: 'center' });
    return x + width;
  }

  // hints: [{ keys: ['↑', '↓'], label: 'lot' }]
  function drawKeyHintBar(ctx, hints, rightText) {
    drawGlossyBar(ctx, { x: 0, y: HINT_BAR_TOP, width: LM.view.WIDTH, height: HINT_BAR_HEIGHT }, 'top');
    let x = 24;
    hints.forEach(function (hint) {
      hint.keys.forEach(function (key, index) {
        x = drawKeyCap(ctx, x + (index > 0 ? 6 : 0), HINT_BAR_TOP + 14, key);
      });
      drawShadowText(ctx, hint.label, x + 10, HINT_BAR_TOP + 35, 17, P.white, 'left');
      x += 10 + LM.text.measureTextWidth(ctx, hint.label, LM.text.boldFont(17)) + 34;
    });
    if (rightText) {
      drawShadowText(ctx, rightText, LM.view.WIDTH - 24, HINT_BAR_TOP + 35, 18, P.white, 'right');
    }
  }

  function drawParchmentPanel(ctx, rect) {
    LM.draw.fillRoundRect(ctx, { x: rect.x - 3, y: rect.y - 3, width: rect.width + 6, height: rect.height + 6 }, 12, P.parchmentEdge);
    LM.draw.fillRoundRect(ctx, rect, 10, P.parchment);
    ctx.save();
    LM.draw.roundRectPath(ctx, rect, 10);
    ctx.clip();
    ctx.fillStyle = P.parchmentShade;
    ctx.fillRect(rect.x, rect.y + rect.height - 10, rect.width, 10);
    ctx.restore();
  }

  // Returns the area below the title bar, where callers draw the panel content.
  function drawTitledPanel(ctx, rect, title) {
    drawParchmentPanel(ctx, rect);
    const barRect = { x: rect.x + 2, y: rect.y + 2, width: rect.width - 4, height: 40 };
    ctx.save();
    LM.draw.roundRectPath(ctx, barRect, 9);
    ctx.clip();
    LM.draw.drawBandedGradient(ctx, barRect, P.titleBarTop, P.titleBarBottom, 5);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
    ctx.fillRect(barRect.x, barRect.y, barRect.width, barRect.height / 2);
    ctx.restore();
    drawShadowText(ctx, title, rect.x + 20, rect.y + 30, 20, P.white, 'left');
    return { x: rect.x + 20, y: rect.y + 56, width: rect.width - 40, height: rect.height - 72 };
  }

  // state: 'normal' | 'selected' | 'disabled' | 'correct' | 'wrong'
  function drawButton(ctx, rect, label, state, fontSize) {
    const colors = BUTTON_COLORS[state];
    const size = fontSize || 22;
    LM.draw.fillRoundRect(ctx, { x: rect.x - 2, y: rect.y - 2, width: rect.width + 4, height: rect.height + 4 }, 10, colors.edge);
    ctx.save();
    LM.draw.roundRectPath(ctx, rect, 8);
    ctx.clip();
    LM.draw.drawBandedGradient(ctx, rect, colors.top, colors.bottom, 5);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
    ctx.fillRect(rect.x, rect.y, rect.width, rect.height * 0.45);
    ctx.restore();
    const style = { font: LM.text.boldFont(size), color: colors.text, lineHeight: size * 1.25, align: 'center' };
    const textHeight = LM.text.measureWrappedHeight(ctx, label, rect.width - 24, style);
    const firstBaseline = rect.y + (rect.height - textHeight) / 2 + size * 0.95;
    LM.text.drawWrappedText(ctx, label, rect.x + rect.width / 2, firstBaseline, rect.width - 24, style);
  }

  function drawNumberBadge(ctx, x, y, label) {
    LM.draw.drawOutlinedRoundRect(ctx, { x: x, y: y, width: 34, height: 34 }, 7, P.gold, 2);
    LM.text.drawTextLine(ctx, label, x + 17, y + 25, { font: LM.text.boldFont(20), color: P.ink, align: 'center' });
  }

  // An answer row: button background, a key badge on the left and left-aligned text.
  function drawOptionRow(ctx, rect, badgeLabel, text, state) {
    drawButton(ctx, rect, '', state);
    const textLeft = badgeLabel ? rect.x + 62 : rect.x + 20;
    if (badgeLabel) {
      drawNumberBadge(ctx, rect.x + 14, rect.y + (rect.height - 34) / 2, badgeLabel);
    }
    const style = { font: LM.text.boldFont(21), color: BUTTON_COLORS[state].text, lineHeight: 26, align: 'left' };
    const maxWidth = rect.x + rect.width - 18 - textLeft;
    const textHeight = LM.text.measureWrappedHeight(ctx, text, maxWidth, style);
    LM.text.drawWrappedText(ctx, text, textLeft, rect.y + (rect.height - textHeight) / 2 + 20, maxWidth, style);
  }

  // An outlined track filled in proportion to share (0..1): torch, danger meters, the score bar.
  function drawMeter(ctx, rect, share, color) {
    LM.draw.drawOutlinedRoundRect(ctx, rect, Math.min(10, rect.height / 2), '#e8dcc0', 2.5);
    const inset = Math.max(2, rect.height * 0.12);
    const fillWidth = (rect.width - inset * 2) * Math.min(1, Math.max(0, share));
    if (fillWidth > 0) {
      const radius = Math.min(8, rect.height / 2 - inset, fillWidth / 2);
      LM.draw.fillRoundRect(ctx, { x: rect.x + inset, y: rect.y + inset, width: fillWidth, height: rect.height - inset * 2 }, radius, color);
    }
  }

  // A small parchment tag, readable over any background; (x, y) is the text baseline centre.
  function drawTag(ctx, text, x, y) {
    const font = LM.text.boldFont(18);
    const width = LM.text.measureTextWidth(ctx, text, font) + 20;
    LM.draw.drawOutlinedRoundRect(ctx, { x: x - width / 2, y: y - 21, width: width, height: 28 }, 6, P.parchment, 2);
    LM.text.drawTextLine(ctx, text, x, y, { font: font, color: P.ink, align: 'center' });
  }

  // A line or two of story told during a stage, on parchment just above the key-hint bar.
  function drawStoryBanner(ctx, text) {
    drawParchmentPanel(ctx, { x: 160, y: 560, width: 960, height: 88 });
    LM.text.drawWrappedText(ctx, text, 640, 596, 900, { font: LM.text.boldFont(22), color: P.ink, lineHeight: 28, align: 'center' });
  }

  function drawDimmer(ctx) {
    ctx.fillStyle = P.dimmer;
    ctx.fillRect(0, 0, LM.view.WIDTH, LM.view.HEIGHT);
  }

  // Hard colour stops give the chunky banded look of old title logos.
  function bandedTextFill(ctx, topY, bottomY, colors) {
    const gradient = ctx.createLinearGradient(0, topY, 0, bottomY);
    colors.forEach(function (color, index) {
      gradient.addColorStop(index / colors.length, color);
      gradient.addColorStop((index + 1) / colors.length, color);
    });
    return gradient;
  }

  function drawTitleText(ctx, text, x, y, size) {
    ctx.font = LM.text.boldFont(size);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.lineJoin = 'round';
    ctx.lineWidth = size * 0.2;
    ctx.strokeStyle = '#2a1004';
    ctx.strokeText(text, x, y + size * 0.08);
    ctx.strokeText(text, x, y);
    ctx.fillStyle = bandedTextFill(ctx, y - size * 0.78, y + size * 0.05, ['#fff8c8', '#ffe066', '#ffbf2e', '#f08a1c']);
    ctx.fillText(text, x, y);
  }

  // A Greek key ("meander") band: a baseline with a hook in every square unit.
  function drawMeanderBand(ctx, rect, color) {
    const unit = rect.height;
    const lineWidth = Math.max(2, unit / 7);
    ctx.save();
    ctx.beginPath();
    ctx.rect(rect.x, rect.y, rect.width, rect.height);
    ctx.clip();
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'square';
    ctx.lineJoin = 'miter';
    const bottom = rect.y + unit - lineWidth / 2;
    ctx.beginPath();
    ctx.moveTo(rect.x, bottom);
    ctx.lineTo(rect.x + rect.width, bottom);
    for (let left = rect.x; left < rect.x + rect.width; left += unit) {
      const s = unit / 10;
      ctx.moveTo(left + s, bottom);
      ctx.lineTo(left + s, rect.y + s);
      ctx.lineTo(left + 8 * s, rect.y + s);
      ctx.lineTo(left + 8 * s, rect.y + 6.5 * s);
      ctx.lineTo(left + 4.5 * s, rect.y + 6.5 * s);
      ctx.lineTo(left + 4.5 * s, rect.y + 4 * s);
    }
    ctx.stroke();
    ctx.restore();
  }

  LM.ui = {
    HUD_HEIGHT,
    HINT_BAR_TOP,
    isPointInRect,
    drawGlossyBar,
    drawHeart,
    drawHearts,
    drawShadowText,
    drawHud,
    drawKeyCap,
    drawKeyHintBar,
    drawParchmentPanel,
    drawTitledPanel,
    drawButton,
    drawNumberBadge,
    drawOptionRow,
    drawMeter,
    drawTag,
    drawStoryBanner,
    drawDimmer,
    drawTitleText,
    drawMeanderBand,
  };
}(window.LM = window.LM || {}));

<script>
// Reusable landscape pieces: sky, sun, clouds, sea, islands, a temple and a Greek ship.
(function (LM) {
  'use strict';

  const P = LM.palette;
  const D = LM.draw;

  function drawSky(ctx, rect, topColor, bottomColor) {
    D.drawBandedGradient(ctx, rect, topColor, bottomColor, 22);
  }

  function drawSun(ctx, x, y, radius, time) {
    D.fillCircle(ctx, x, y, radius * 1.75, 'rgba(255, 196, 60, 0.16)');
    D.fillCircle(ctx, x, y, radius * 1.37, 'rgba(255, 210, 80, 0.28)');
    ctx.fillStyle = '#ffd24a';
    const spin = time * 0.15;
    for (let ray = 0; ray < 12; ray += 1) {
      const angle = spin + ray * Math.PI / 6;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(angle - 0.1) * radius * 1.1, y + Math.sin(angle - 0.1) * radius * 1.1);
      ctx.lineTo(x + Math.cos(angle) * radius * 1.55, y + Math.sin(angle) * radius * 1.55);
      ctx.lineTo(x + Math.cos(angle + 0.1) * radius * 1.1, y + Math.sin(angle + 0.1) * radius * 1.1);
      ctx.fill();
    }
    D.fillCircle(ctx, x, y, radius, '#ffe27a');
    D.fillCircle(ctx, x, y, radius * 0.72, '#fff6c8');
  }

  function drawCloud(ctx, x, y, scale) {
    const shade = [[0, 6, 26], [34, 0, 34], [70, 6, 26], [34, 12, 30]];
    const puffs = [[0, 0, 26], [34, -10, 34], [70, 0, 26]];
    shade.forEach(function (puff) { D.fillCircle(ctx, x + puff[0] * scale, y + (puff[1] + 8) * scale, puff[2] * scale, '#c4def7'); });
    puffs.forEach(function (puff) { D.fillCircle(ctx, x + puff[0] * scale, y + puff[1] * scale, puff[2] * scale, P.white); });
    D.fillCircle(ctx, x + 26 * scale, y - 20 * scale, 12 * scale, P.white);
  }

  function drawSea(ctx, rect, time, colors) {
    const seaColors = colors || { top: P.seaTop, bottom: P.seaBottom, foam: P.foam, wave: '#74b4f0' };
    D.drawBandedGradient(ctx, rect, seaColors.top, seaColors.bottom, 10);
    const drift = (time * 30) % 56;
    ctx.fillStyle = seaColors.foam;
    for (let x = -56; x < rect.x + rect.width + 56; x += 56) {
      const offset = (Math.round(x / 56) % 2) * 20;
      ctx.beginPath();
      ctx.ellipse(x + offset + drift + 20, rect.y + 8, 22, 3, 0, Math.PI, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = seaColors.wave;
    const slowDrift = (time * 14) % 74;
    for (let x = -74; x < rect.x + rect.width + 74; x += 74) {
      ctx.fillRect(x + 30 - slowDrift, rect.y + rect.height * 0.3, 34, 3);
      ctx.fillRect(x + 6 + slowDrift, rect.y + rect.height * 0.62, 26, 3);
    }
  }

  // An island hill: `baseY` is the waterline, `width` and `height` its size.
  function drawIsland(ctx, centerX, baseY, width, height) {
    const half = width / 2;
    D.drawOutlinedPolygon(ctx, [
      [centerX - half, baseY],
      [centerX - half * 0.6, baseY - height * 0.7],
      [centerX - half * 0.1, baseY - height],
      [centerX + half * 0.45, baseY - height * 0.75],
      [centerX + half, baseY],
    ], P.grassDark, 3);
    D.drawOutlinedPolygon(ctx, [
      [centerX - half * 0.6, baseY - height * 0.7],
      [centerX - half * 0.1, baseY - height],
      [centerX + half * 0.45, baseY - height * 0.75],
      [centerX + half * 0.3, baseY - height * 0.62],
      [centerX - half * 0.1, baseY - height * 0.84],
      [centerX - half * 0.5, baseY - height * 0.58],
    ], P.grassLight, 0);
    ctx.fillStyle = '#e6d6a8';
    ctx.fillRect(centerX - half, baseY - 4, width, 4);
  }

  // Temple with a pediment roof; (x, y) is the bottom centre, drawn ~120 px wide at scale 1.

(function (LM) {
  'use strict';

  const P = LM.palette;
  const D = LM.draw;

  function drawSword(ctx, hand) {
    D.drawLine(ctx, hand[0], hand[1], hand[0] + 4, hand[1] - 46, P.outline, 8);
    D.drawLine(ctx, hand[0], hand[1], hand[0] + 4, hand[1] - 46, '#dfe6ee', 5);
    D.drawLine(ctx, hand[0] - 8, hand[1] - 4, hand[0] + 9, hand[1] - 5, '#c8a040', 5);
  }

  function drawThreadBall(ctx, x, y, radius) {
    D.drawOutlinedCircle(ctx, x, y, radius, '#d8282a', 2);
    ctx.strokeStyle = '#ff8a7a';
    ctx.lineWidth = 1.4;
    for (let turn = -1; turn <= 1; turn += 1) {
      ctx.beginPath();
      ctx.ellipse(x, y, radius * 0.85, radius * 0.4, turn * 0.8, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawLute(ctx, x, y) {
    D.drawOutlinedPolygon(ctx, [[x - 14, y - 30], [x - 10, y], [x + 10, y], [x + 14, y - 30], [x + 8, y - 30], [x + 6, y - 8], [x - 6, y - 8], [x - 8, y - 30]], '#c8902a', 2);
    D.drawLine(ctx, x - 13, y - 28, x + 13, y - 28, '#7a4a10', 3);
    ctx.strokeStyle = '#fff6c8';
    ctx.lineWidth = 1;
    [-4, 0, 4].forEach(function (stringX) {
      ctx.beginPath();
      ctx.moveTo(x + stringX, y - 27);
      ctx.lineTo(x + stringX * 0.8, y - 4);
      ctx.stroke();
    });
  }

  function drawStaff(ctx, hand) {
    D.drawLine(ctx, hand[0] + 2, hand[1] - 50, hand[0] + 2, hand[1] + 44, P.outline, 7);
    D.drawLine(ctx, hand[0] + 2, hand[1] - 50, hand[0] + 2, hand[1] + 44, '#8a5a2a', 4);
  }

  function drawLaurelBranch(ctx, hand) {
    D.drawLine(ctx, hand[0], hand[1], hand[0] + 10, hand[1] - 34, '#5a3a1a', 3);
    for (let leaf = 0; leaf < 5; leaf += 1) {
      D.drawOutlinedEllipse(ctx, hand[0] + 2 + leaf * 2 + (leaf % 2 ? 5 : -5), hand[1] - 8 - leaf * 6, 5, 2.5, '#4a9a3a', 1);
    }
  }

  // hands: [[leftX, leftY], [rightX, rightY]] in the character's own coordinates.
  function drawHeldItem(ctx, item, hands) {

(function (LM) {

    } else if (look.headwear === 'darkCrown') {

      D.drawOutlinedPolygon(ctx, [[-16, -114], [-34, -124], [-30, -112]], P.white, 1.5);

(function (LM) {

    [-12, 12].forEach(function (eyeX) {
      D.drawOutlinedCircle(ctx, eyeX, -140, 5, eyeColor, 1.5);
      D.fillCircle(ctx, eyeX, -140, 2, P.outline);
    });

    D.drawLine(ctx, 18, -149, 6, -145, P.outline, 3);
  }

  function drawMinotaurBody(ctx, armRaise) {
    [-12, 12].forEach(function (legX) {
      D.drawOutlinedRoundRect(ctx, { x: legX - 8, y: -46, width: 16, height: 42 }, 6, FUR, 2.5);
      D.drawOutlinedRoundRect(ctx, { x: legX - 10, y: -8, width: 20, height: 9 }, 3, '#2a1a10', 2);
    });
    D.drawOutlinedPolygon(ctx, [[-34, -112], [34, -112], [26, -46], [-26, -46]], FUR_LIGHT, 2.5);
    D.drawOutlinedPolygon(ctx, [[-26, -58], [26, -58], [22, -30], [-22, -30]], '#a82a1a', 2.5);

      const handX = side * (44 + armRaise * 6);
      const handY = -66 - armRaise * 40;

      D.drawLine(ctx, side * 30, -104, handX, handY, FUR, 12);
      D.drawOutlinedCircle(ctx, handX, handY, 8, FUR, 2);
    });
  }

  function drawMinotaur(ctx, x, y, scale, armRaise, isAngry) {
    D.withTransform(ctx, x, y, scale, function () {
      drawMinotaurBody(ctx, armRaise);
      drawMinotaurHead(ctx, isAngry);
    });
  }

    D.drawOutlinedPolygon(ctx, [[headX - 14, headY - 10], [headX - 20, headY - 30], [headX - 6, headY - 16]], '#2a2a2a', 2);
    D.drawOutlinedPolygon(ctx, [[headX + 14, headY - 10], [headX + 20, headY - 30], [headX + 6, headY - 16]], '#2a2a2a', 2);

    D.withTransform(ctx, x, y, scale, function () {

    D.fillCircle(ctx, x, y - 8, 22 + flicker, 'rgba(255, 170, 60, 0.25)');
    D.drawOutlinedPolygon(ctx, [[x - 9, y], [x, y - 26 - flicker], [x + 9, y]], '#ffb030', 1.5);
    D.drawOutlinedPolygon(ctx, [[x - 4, y], [x, y - 14 - flicker], [x + 4, y]], '#fff0a0', 0);

  // A stone corridor seen in perspective, lit by two torches.
  function drawLabyrinthHall(ctx, time) {

    D.drawOutlinedPolygon(ctx, [[0, 0], [480, 170], [480, 430], [0, 720]], '#5a4a3a', 3);
    D.drawOutlinedPolygon(ctx, [[1280, 0], [800, 170], [800, 430], [1280, 720]], '#5a4a3a', 3);
    D.drawOutlinedPolygon(ctx, [[0, 720], [480, 430], [800, 430], [1280, 720]], '#3a3028', 3);
    ctx.fillStyle = '#0a0806';
    ctx.fillRect(480, 170, 320, 260);
    ctx.strokeStyle = '#3a3028';
    ctx.lineWidth = 2;
    for (let row = 1; row < 6; row += 1) {

<script>
// Feathered wings made of wax and feathers, people flying with them, gulls and drifting feathers.
// Used by the Icarus story pictures and by the workshop and flight stages.
(function (LM) {
  'use strict';

  const P = LM.palette;
  const D = LM.draw;
  const FEATHER = '#fbf6ea';
  const FEATHER_QUILL = '#c8b88e';
  const WAX = '#f2c442';
  const CHEST_TO_FEET = 60;

  // Feathers of one wing, from the body outwards: [along x, along y, length, angle].
  const WING_FEATHERS = [
    [6, 2, 34, 1.45], [16, 0, 40, 1.3], [26, -2, 46, 1.14], [36, -4, 50, 0.98],
    [46, -7, 54, 0.8], [56, -10, 58, 0.6], [64, -12, 60, 0.4], [70, -14, 58, 0.2],
  ];

  function drawWingFeather(ctx, x, y, length, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    D.drawOutlinedEllipse(ctx, length / 2, 0, length / 2, length * 0.17, FEATHER, 1.6);
    D.drawLine(ctx, 3, 0, length * 0.85, 0, FEATHER_QUILL, 1.4);
    ctx.restore();
  }

  function drawWaxDrips(ctx, time) {
    [14, 34, 54].forEach(function (dripX, index) {
      const dripLength = 6 + ((time * 8 + index * 5) % 10);
      D.drawLine(ctx, dripX, -dripX * 0.2 + 4, dripX, -dripX * 0.2 + 4 + dripLength, WAX, 4);
    });
  }

  // wings: { flap (radians, up is positive), featherCount (0-8, default all), isMelting, and for the wearer: pose, tilt }.
  // Drawn in a person's own coordinates, hanging from the shoulder on `side` (-1 left, 1 right).
  function drawWing(ctx, side, wings, time) {
    ctx.save();
    ctx.translate(side * 14, -74);
    ctx.scale(side, 1);
    ctx.rotate(-(wings.flap || 0));
    const featherCount = wings.featherCount === undefined ? WING_FEATHERS.length : wings.featherCount;
    WING_FEATHERS.slice(0, featherCount).reverse().forEach(function (feather) {
      drawWingFeather(ctx, feather[0], feather[1], feather[2], feather[3]);
    });
    D.drawLine(ctx, 0, 0, 72, -15, P.outline, 13);
    D.drawLine(ctx, 0, 0, 72, -15, WAX, 8);
    if (wings.isMelting) {
      drawWaxDrips(ctx, time);
    }
    ctx.restore();
  }

  // Placed like a person: (x, y) is where the wearer's feet are.
  function drawPairOfWings(ctx, x, y, scale, wings, time) {
    D.withTransform(ctx, x, y, scale, function () {
      drawWing(ctx, -1, wings, time);
      drawWing(ctx, 1, wings, time);
    });
  }

  // Like drawPerson, with a pair of wings strapped to the shoulders.
  function drawWingedPerson(ctx, x, y, scale, look, wings, time) {
    drawPairOfWings(ctx, x, y, scale, wings, time);
    LM.characters.drawPerson(ctx, x, y, scale, look, wings.pose || 'stand');
  }

  // On the ground the wings are held up behind the back, so they do not hide the body.
  function restingWings(pose) {
    return { flap: 0.9, pose: pose };
  }

  // A flyer is placed by the chest and leans forward by wings.tilt (radians).
  function drawFlyer(ctx, x, y, scale, look, wings, time) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(wings.tilt || 0);
    drawWingedPerson(ctx, 0, CHEST_TO_FEET * scale, scale, look, wings, time);
    ctx.restore();
  }

  function flapAt(time, speed) {
    return 0.25 + 0.35 * Math.sin(time * speed);
  }

  function drawGull(ctx, x, y, scale, time) {
    const lift = Math.sin(time * 6 + x) * 10;
    D.withTransform(ctx, x, y, scale, function () {
      D.drawOutlinedPolygon(ctx, [[-2, 0], [-28, -12 - lift], [-12, 3]], '#d8dde6', 2);
      D.drawOutlinedPolygon(ctx, [[2, 0], [28, -12 - lift], [12, 3]], '#d8dde6', 2);
      D.drawOutlinedEllipse(ctx, 0, 2, 13, 5, P.white, 2);
      D.drawOutlinedCircle(ctx, 12, -1, 5, P.white, 2);
      D.drawOutlinedPolygon(ctx, [[16, -2], [24, 0], [16, 2]], P.orange, 1);
    });
  }

  // Loose feathers drifting down through `area`, each on its own looping path.
  function drawFallingFeathers(ctx, area, count, time) {
    for (let index = 0; index < count; index += 1) {
      const progress = (time * 0.12 + index / count) % 1;
      const x = area.x + ((index * 137) % area.width) + Math.sin(time * 2 + index) * 18;
      const y = area.y + progress * area.height;
      LM.props.drawFeather(ctx, x, y, 2.2, Math.sin(time * 2.5 + index) * 0.8);
    }
  }

  LM.winged = {
    drawPairOfWings,
    drawWingedPerson,
    restingWings,
    drawFlyer,
    flapAt,
    drawGull,
    drawFallingFeathers,
  };
}(window.LM = window.LM || {}));

</script>

  const { drawPairOfWings, drawWingedPerson, restingWings, drawFlyer, flapAt, drawGull, drawFallingFeathers } = LM.winged;
  const drawTag = LM.ui.drawTag;

  // ---- Landscape pieces ---------------------------------------------------------------------

  // sky: { top, bottom, horizonY, sunX, sunY, sunRadius }.
  function drawFlightSky(ctx, time, sky) {

  }

    S.drawSun(ctx, 1110, 120, 48, time);

    D.drawOutlinedPolygon(ctx, [[0, 720], [0, 430], [300, 412], [640, 440], [820, 500], [880, 720]], P.grassDark, 3);

  }
